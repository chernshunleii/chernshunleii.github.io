<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>题库导航</title>
<style>
.tab{display:none;}
.tab.active{display:block;}
.tab-btn{padding:8px 16px;cursor:pointer;}
</style>
</head>
<body>
<div>
  <button class="tab-btn" onclick="openTab('tab1')">会计测试</button>
  <button class="tab-btn" onclick="openTab('tab2')">题库2175</button>
</div>

<div id="tab1" class="tab active">
<iframe src="Accounting-Tests.html" width="35%" height="100%"></iframe>
</div>
<div id="tab2" class="tab">
<iframe src="题库(2175）.html" width="35%" height="100%"></iframe>
</div>

<script>
function openTab(tabId){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
}
</script>
</body>
</html>
