"错误","C":null,"D":null,"正确选项":"B","试题解析":"WTD设备车载主机包括，电源模块、数据采集模块、数据处理及存储模块、网络防护模块、4G无线传输模块、WLAN传输模块、卫星定位模块等功能模块组成，负责传输实时和非实时数据。"},{"序号":898,"试题类型":"判断题","试题内容":"WTDS：动车组车载信息无线传输系统。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"WTDS：动车组车载信息无线传输系统。"},{"序号":899,"试题类型":"单选题","试题内容":"WTD设备主要采集动车组（）传感器数据。","A":"牵引、制动系统","B":"乘客信息系统","C":"餐饮系统","D":"接触网供电系统","正确选项":"A","试题解析":"WTD设备会采集动车组车载网络控制系统中的牵引、制动、轴温、车门、空调、卫生间等系统的传感器数据。"},{"序号":900,"试题类型":"多选题","试题内容":"WTD设备采集的传感器数据包括（）（）（）的信息。","A":"牵引系统","B":"车门系统","C":"空调系统","D":"接触网供电系统","正确选项":"ABC","试题解析":"WTD设备会采集动车组车载网络控制系统中的牵引、制动、轴温、车门、空调、卫生间等系统的传感器数据。"},{"序号":901,"试题类型":"单选题","试题内容":"WTD设备将传感器数据发送到（）。","A":"动车组内部存储器","B":"司机手持设备","C":"地面监控系统","D":"动车组乘客界面","正确选项":"C","试题解析":"WTD设备会将周期采样的传感器数据实时发送到地面监控系统，以便地面监控人员可实时掌握动车组状态。"},{"序号":902,"试题类型":"判断题","试题内容":"WTD设备实时发送的传感器数据可以帮助地面监控人员实时掌握动车组状态。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"WTD设备会将周期采样的传感器数据实时发送到地面监控系统，以便地面监控人员可实时掌握动车组状态。"},{"序号":903,"试题类型":"单选题","试题内容":"WTD设备采集的数据主要通过（）实时发送到地面。","A":"5G网络","B":"WLAN","C":"红外","D":"蓝牙","正确选项":"B","试题解析":"对于传感器采集的全部过程数据，则在动车组回库后，通过WLAN方式传输到非实时数据采集子系统。"},{"序号":904,"试题类型":"判断题","试题内容":"动车组回库后，WTD设备无法继续传输数据。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"对于传感器采集的全部过程数据，则在动车组回库后，通过WLAN方式传输到非实时数据采集子系统。"},{"序号":905,"试题类型":"单选题","试题内容":"PHM的基本概念是利用（）来实时监测装备运行的状态参数及特征信号。","A":"各类先进传感器","B":"听觉检查","C":"视觉检查","D":"触觉检查","正确选项":"A","试题解析":"PHM的基本概念是利用各类先进传感器实时监测装备运行的状态参数及特征信号。"},{"序号":906,"试题类型":"判断题","试题内容":"PHM仅仅利用单一类型的传感器来监测装备状态。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"PHM的基本概念是利用各类先进传感器实时监测装备运行的状态参数及特征信号。"},{"序号":907,"试题类型":"单选题","试题内容":"PHM是（）解决“是否需要维修”的问题的。","A":"依靠人工经验","B":"通过装备状态监测信息","C":"随意判断","D":"依据走行公里","正确选项":"B","试题解析":"解决“是否需要维修”的问题：依据获取的装备状态监测信息、判断当前装备系统处于其性能退化过程中的哪一种健康状况，并估计当前的状态偏离正常态的程度大小。"},{"序号":908,"试题类型":"单选题","试题内容":"PHM是（）解决“何时会故障”的问题的。","A":"依靠人工经验","B":"通过过去和现有状态预测未来","C":"依赖固定时间表","D":"依据走行公里","正确选项":"B","试题解析":"解决“何时会故障的”问题：确定未来一段时间内装备是否能正常完成其功能，并根据过去和现有的状态预测未来时间的状态，从而做到提前预警。"},{"序号":909,"试题类型":"多选题","试题内容":"PHM的内涵包括（）（）（）。","A":"一项新的维修保障技术","B":"代表了维修理念的转变","C":"无需状态监控","D":"实现精确故障诊断的重要手段","正确选项":"ABD","试题解析":"PHM的内涵：（1）是一项新的维修保障技术。\n（2）代表了维修理念的转变。\n（3）是对机内测试和状态监控技术的拓展。\n（4）实现精确故障诊断的重要手段。\n（5）实现装备状态维修的重要途径。\n（6）是提高装备维修保障效率的重要保证。"},{"序号":910,"试题类型":"多选题","试题内容":"PHM的作用主要体现在（）（）（）。","A":"解决“是否需要维修”的问题","B":"解决“故障是什么”的问题","C":"解决“何时会故障”的问题","D":null,"正确选项":"ABC","试题解析":"PHM的作用\n（1）解决“是否需要维修”的问题，（2）解决“故障是什么”的问题，（3）解决“何时会故障的”问题"},{"序号":911,"试题类型":"判断题","试题内容":"PHM的作用仅限于解决“是否需要维修”的问题。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"PHM的作用\n（1）解决“是否需要维修”的问题，（2）解决“故障是什么”的问题，（3）解决“何时会故障的”问题"},{"序号":912,"试题类型":"判断题","试题内容":"PHM：动车组故障预测与健康管理系统。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"PHM：动车组故障预测与健康管理系统"},{"序号":913,"试题类型":"多选题","试题内容":"动车组故障预测与健康管理系统（PHM）的总体功能包含（）。","A":"故障预测-故障监控","B":"故障预测-故障预警查询","C":"故障预测-性能演化趋势","D":"故障预测-温度趋势分析","正确选项":"ABCD","试题解析":"动车组故障预测与健康管理系统（PHM）的总体功能包含：1.故障预测-故障监控、2.故障预测-故障预警查询、3.全图监控-车辆监控、车组监控/故障预测-历史参数快照、4.故障预测-性能演化趋势、5.故障预测-温度趋势分析、6.模型管理-模型集市"},{"序号":914,"试题类型":"判断题","试题内容":"制动：指对已制动的列车或机车解除或减弱其制动作用。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"制动：人为地制止列车的运动,包括使它减速、不加速或停止运行 。"},{"序号":915,"试题类型":"单选题","试题内容":"缓解就是指对已制动的列车或机车解除或（）其制动作用。","A":"减弱","B":"加强","C":"隔离","D":"增大","正确选项":"A","试题解析":"缓解：对已制动的列车或机车解除或减弱其制动作用,则称为“缓解” 。"},{"序号":916,"试题类型":"单选题","试题内容":"动车组从列车施行制动作用开始，到其完全停住所驶过的距离称为（）。","A":"制动曲线","B":"制动轨迹","C":"制动距离","D":"制动路程","正确选项":"C","试题解析":"制动距离：从列车施行制动作用开始，到其完全停住所驶过的距离称为制动距离"},{"序号":917,"试题类型":"单选题","试题内容":"传送制动原动力并产生制动力的部分称为（）。","A":"基础制动装置","B":"盘型制动","C":"电阻制动","D":"再生制动","正确选项":"A","试题解析":"基础制动装置：传送制动原动力并产生制动力的部分。"},{"序号":918,"试题类型":"单选题","试题内容":"时速200km～300km动车组的制动能量是普通列车的（）倍。","A":"1～5","B":"2～6","C":"3～8","D":"4～9","正确选项":"D","试题解析":"时速200km～300km动车组的制动能量是普通列车的4～9倍。"},{"序号":919,"试题类型":"多选题","试题内容":"制动方式的分类标准：（）、（）、（）。","A":"按动能的转移方式","B":"按制动力的形成方式","C":"按制动力的操纵控制方式","D":"按动能的形成方式","正确选项":"ABC","试题解析":"制动方式的分类标准：按动能的转移方式、按制动力的形成方式、按制动力的操纵控制方式。"},{"序号":920,"试题类型":"判断题","试题内容":"按列车制动过程中动能的转移方式分类，动车组制动分为盘形制动、电阻制动、再生制动。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"按动能的转移方式，动车组所采用的制动方式主要有以下几种：盘形制动，电阻制动，再生制动"},{"序号":921,"试题类型":"单选题","试题内容":"盘形制动是在车轴或车轮辐板侧面安装制动盘，用制动夹钳使两个闸片紧压制动盘侧面，通过摩擦产生制动力，将列车动能转变成（），消散于大气。","A":"机械能","B":"动能","C":"热能","D":"势能","正确选项":"C","试题解析":"盘形制动是在车轴或车轮辐板侧面安装制动盘，用制动夹钳使两个闸片紧压制动盘侧面，通过摩擦产生制动力，将列车动能转变成热能，消散于大气。"},{"序号":922,"试题类型":"判断题","试题内容":"与盘形制动相比，闸瓦制动更适合于高速动车组。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"与闸瓦制动相比，盘形制动更适合于高速动车组。"},{"序号":923,"试题类型":"判断题","试题内容":"电阻制动将电能反馈回电网，使本来由电能变成的列车动能再生为电能。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"再生制动将电能反馈回电网，使本来由电能变成的列车动能再生为电能，而不是变成热能消散掉。"},{"序号":924,"试题类型":"单选题","试题内容":"按照制动力的形成方式，制动方式可分为非粘着制动、（）。","A":"粘着制动","B":"再生制动","C":"摩擦制动","D":"轨道涡流制动","正确选项":"A","试题解析":"按照制动力的形成方式，制动方式又可分为粘着制动和非粘着制动。"},{"序号":925,"试题类型":"单选题","试题内容":"（）是指车轮在钢轨上的运动状态，是静中有微动，或滚中有滑。","A":"磁轨","B":"轨道涡流","C":"粘着","D":"电制动","正确选项":"C","试题解析":"粘着是指车轮在钢轨上的运动状态，是静中有微动，或滚中有滑。"},{"序号":926,"试题类型":"多选题","试题内容":"下列哪项制动不是粘着制动（）、（） 。","A":"磁轨制动","B":"盘形制动","C":"电阻制动","D":"轨道涡流制动","正确选项":"AD","试题解析":"除磁轨制动和轨道涡流制动外，其它方式一般说来都属于粘着制动。"},{"序号":927,"试题类型":"判断题","试题内容":"除磁轨制动和轨道涡流制动外，其它制动方式一般说来都属于非粘着制动 。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"除磁轨制动和轨道涡流制动外，其它方式一般说来都属于粘着制动。"},{"序号":928,"试题类型":"单选题","试题内容":"粘着制动的制动力的最大值受（）的限制。","A":"摩擦力","B":"牵引","C":"粘着力","D":"速度","正确选项":"C","试题解析":"制动力的最大值受粘着力的限制。"},{"序号":929,"试题类型":"判断题","试题内容":"按动车组制动力的操纵方式可分为空气制动、电空制动、电制动。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"按制动力的操纵控制方式，动车组所采用的制动方式可分为空气制动、电空制动和电制动三类。"},{"序号":930,"试题类型":"单选题","试题内容":"空气制动分为自动式空气制动和（）。","A":"再生制动","B":"紧急制动","C":"直通式空气制动","D":"黏着制动","正确选项":"C","试题解析":"空气制动又分为直通式空气制动和自动式空气制动两种"},{"序号":931,"试题类型":"多选题","试题内容":"自动式空气制动机制动系统有（）、（）、（）组成。","A":"三通阀","B":"分配阀","C":"MR管","D":"副风缸","正确选项":"ABD","试题解析":"自动式空气制动机制动系统有三通阀或分配阀、副风缸等组成。"},{"序号":932,"试题类型":"多选题","试题内容":"自动式空气制动机“三通”指的是：（）、（）、（）。","A":"制动管","B":"副风缸","C":"制动缸","D":"MR管","正确选项":"ABC", 端CCU收到指令后，通过MVB发给TBM，若车速5km/h以下允许手动撒砂（）s。","A":3,"B":5,"C":10,"D":15,"正确选项":"C","试题解析":".CR400BF动车组司机操纵台设置撒砂拨键开关，司机台激活端CCU收到指令后，通过MVB发给TBM，若车速5km/h以下允许手动撒砂10s，按钮操作不到10秒，CCU根据按钮操作时间进行控制，按钮操作超过10秒，继续操作无效。按钮松开后再次操作重新计时，继续执行手动撒砂指令。"},{"序号":1040,"试题类型":"单选题","试题内容":"CR400AF型动车组紧急制动UB的触发源分别是：（）①主控信号。②ATP系统触发列车紧急制动。③紧急制动按钮。④BP救援转换装置压力开关。⑤紧急制动EB制动力不足。⑥列车分离。","A":"②③④","B":"①②③④","C":"①②③④⑥","D":"①②③④⑤⑥","正确选项":"D","试题解析":"CR400AF动车组紧急制动UB的触发源分别是：\n①主控信号。\n②ATP系统触发列车紧急制动。\n③紧急制动按钮。\n④BP救援转换装置压力开关。\n⑤紧急制动EB制动力不足。\n⑥列车分离。"},{"序号":1041,"试题类型":"判断题","试题内容":"CR400AF型动车组紧急制动EB制动力不足可以被旁路。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CR400AF动车组其中紧急制动EB制动力不足、BP救援转换装置压力开关、ATP紧急制动不可以被旁路。"},{"序号":1042,"试题类型":"单选题","试题内容":"CR400AF型动车组紧急制动UB的所有触发源都应停车后施加（）再进行紧急复位操作。","A":"停放制动","B":"快速制动","C":"保持制动","D":"常用制动","正确选项":"A","试题解析":"CR400AF动车组紧急制动UB的所有触发源都应停车后施加停放制动再进行紧急复位操作。"},{"序号":1043,"试题类型":"单选题","试题内容":"CR400AF型动车组保持制动力应满足（）级常用制动的对应要求。","A":4,"B":5,"C":6,"D":7,"正确选项":"A","试题解析":"CR400AF动车组动车组有保持制动功能，保持制动力应满足定员载荷状态的动车组在一定坡道上静止和启动而不溜逸的要求，保持制动力应满足 4 级常用制动的对应要求。"},{"序号":1044,"试题类型":"单选题","试题内容":"CR400BF型动车组全列共设（）个停放制动夹钳，满足定员载荷动车组在20‰坡道上安全停放的要求。","A":8,"B":10,"C":12,"D":16,"正确选项":"C","试题解析":"CR400BF动车组停放制动满足动车组在定员载荷下停放在20‰的坡道上不溜车，并具有不小于1.2倍的安全系数。动车组停放制动夹钳设置于1、8车的3、4轴，3、6车的1、2、3、4轴，共12个。"},{"序号":1045,"试题类型":"多选题","试题内容":"CR400BF动车组常用制动采用（）的减速度控制模式，由（）进行统一制动力管理。","A":"速度-粘着","B":"速度-曲线","C":"TBM","D":"SBM","正确选项":"AC","试题解析":"CR400BF动车组常用制动采用速度-粘着的减速度控制模式，由TBM进行统一制动力管理"},{"序号":1046,"试题类型":"单选题","试题内容":"CR400BF型动车组常用制动时速度小于25km/h，常用制动转为（）模式。","A":"比例制动","B":"清洁制动","C":"保持制动","D":"停放制动","正确选项":"A","试题解析":"CR400BF动车组常用制动时速度大于25km/h，为正常制动模式；速度小于25km/h，常用制动转为比例制动模式，整个制动过程都由TBM进行制动力分配。"},{"序号":1047,"试题类型":"单选题","试题内容":"CR400BF型动车组安全环路共（）路。","A":5,"B":6,"C":7,"D":8,"正确选项":"B","试题解析":"CR400BF动车组安全环路共6路：紧急制动EB环路、紧急制动UB环路、乘客紧急制动环路、停放制动监控环路、制动不缓解环路、火灾报警环路。"},{"序号":1048,"试题类型":"判断题","试题内容":"CR400BF型动车组所有的安全回路建立在主控投入的前提下，当拔取主控、换端时所有的环路断开。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CR400BF动车组所有的安全回路建立在主控投入的前提下，当拔取主控、换端时所有的环路断开。"},{"序号":1049,"试题类型":"单选题","试题内容":"CR400BF型动车组紧急制动EB环路断开条件有:（）①司控器在紧急制动EB位。②乘客紧急制动环路断开。③停放制动监控环路断开。④司机警惕装置触发紧急制动请求。⑤车载地震紧急处置装置发出（II级、Ⅲ级）报警信号。","A":"③④⑤","B":"①③④⑤","C":"②③④⑤","D":"①②③④⑤","正确选项":"D","试题解析":"CR400BF动车组紧急制动EB环路断开条件如下:\n①司控器在紧急制动EB位。\n②乘客紧急制动环路断开。\n③停放制动监控环路断开。\n④司机警惕装置触发紧急制动请求。\n⑤车载地震紧急处置装置发出（II级、III级）报警信号。"},{"序号":1050,"试题类型":"单选题","试题内容":"CR400BF动车组紧急复位操作：车辆停止状态，司控器处于制动位，按下停放制动施加按钮，确认停放制动施加，按下紧急复位按钮，确认（）已缓解。","A":"停放制动","B":"停车制动","C":"紧急制动","D":"耐雪制动","正确选项":"C","试题解析":"CR400BF动车组触发紧急EB制动后需要停车进行紧急复位操作：车辆停止状态，司控器处于制动位，按下停放制动施加按钮，确认停放制动施加，按下紧急复位按钮，确认紧急制动已缓解。"},{"序号":1051,"试题类型":"单选题","试题内容":"CR400BF型动车组列车设置乘客紧急制动安全环路，客室两端各设置（）个乘客紧急制动手柄，乘客紧急制动手柄设有电开关。","A":1,"B":2,"C":3,"D":4,"正确选项":"A","试题解析":"CR400BF动车组列车设置乘客紧急制动安全环路，客室两端各设置1个乘客紧急制动手柄，乘客紧急制动手柄设有电开关"},{"序号":1052,"试题类型":"多选题","试题内容":"CR400BF型动车组如果乘客触发乘客紧急制动拉手则断开乘客紧急制动安全环路，同时在（）、（）中产生声光报警信号。","A":"司机室","B":"乘务室","C":"2车","D":"7车","正确选项":"AB","试题解析":"CR400BF动车组中，如果乘客触发乘客紧急制动拉手则断开乘客紧急制动安全环路，触发紧急制动EB安全环路，同时在司机室、乘务室中产生声光报警信号并HMI屏弹报“乘客紧急制动环路断开”、“乘客紧急制动请求x”故障，同时使得列车自动触发紧急制动EB。"},{"序号":1053,"试题类型":"判断题","试题内容":"CR400BF动车组紧急制动UB是在紧急制动UB安全环路失电时控制紧急制动电磁阀实施的紧急制动。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CR400BF动车组紧急制动UB是在紧急制动UB安全环路失电时控制紧急制动电磁阀实施的紧急制动。"},{"序号":1054,"试题类型":"判断题","试题内容":"司机室设置有可以忽略乘客紧急制动装置，需司机进行手动操作。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"司机室设置有可以忽略乘客紧急制动装置，需司机进行手动操作。"},{"序号":1055,"试题类型":"单选题","试题内容":"CR400BF型动车组清洁制动时每辆车均施加（）的空气制动力。","A":"50kPa±20kPa","B":"60kPa±20kPa","C":"70kPa±20kPa","D":"80kPa±20kPa","正确选项":"C","试题解析":"CR400BF动车组为了改善冰雪潮湿天气下制动盘和闸片的摩擦系数，司机可通过清洁制动按钮施加手动施加清洁制动，此时每辆车均施加70kPa±20kPa的空气制动力。"},{"序号":1056,"试题类型":"单选题","试题内容":"CR400BF型动车组根据轮轨的实际粘着条件，（）按照减速度和速度差等判据来判断滑行状态。","A":"主供电系统","B":"防滑系统","C":"辅助电源系统","D":"烟火报警系统","正确选项":"B","试题解析":"CR400BF动车组在列车制动工况下，由BCU统一管理电制动和空气制动的防滑控制；根据轮轨的实际粘着条件，防滑系统按照减速度和速度差等判据来判断滑行状态，通过降低电制动力和控制防滑阀的动作，来减少制动力。"},{"序号":1057,"试题类型":"单选题","试题内容":"CR400BF型动车组当空气制动防滑系统失效时，空气制动仍能维持运用而无滑行保护，保证（）。","A":"向心力","B":"制动力","C":"牵引力","D":"离心力","正确选项":"B","试题解析":"CR400BF动车组当空气制动防滑系统失效时，空气制动仍能维持运用而无滑行保护，保证制动力。"},{"序号":1058,"试题类型":"单选题","试题内容":"CR400BF型动车组1车主控，手动撒砂，（）车撒砂动作。","A":"1、8","B":"5、8","C":"1、5","D":"1、4","正确选项":"D","试题解析":"CR400BF动车组1车主控，手动撒砂，1、4车撒砂动作；8车主控，手动撒砂，5、8车撒砂动作。"},{"序号":1059,"试题类型":"多选题","试题内容":"CR400BF型动车组保持制动施加满足以下哪些条件：（）。","A":"列车处于非牵引状态","B":"车辆速度低于1.5km/h","C":"列车处于非ASC模式（CCU发送给LBCU的ASC模式信号）","D":"TBM（或自律模式时单车LBCU）发出保持制动施加指令","正确选项":"ABCD","试题解析":"CR400BF动车组保持制动施加满足以下所有条件：列车处于非牵引状态；车辆速度低于1.5km/h；列车处于非ASC模式（CCU发送给LBCU的ASC模式信号），TBM（或自律模式时单车LBCU）发出保持制动施加指令。"},{"序号":1060,"试题类型":"判断题","试题内容":"CR400BF型动车组有保持制动功能，保持制动力应满足定员载荷状态的动车组在一定坡道上静止和启动而不溜逸的要求。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CR400BF型动车组有保持制动功能，保持制动力应满足定员载荷状态的动车组在一定坡道上静止和启动而不溜逸的要求。"},{"序号":1061,"试题类型":"判断题","试题内容":"CR400BF型动车组防滑系统按照减速度和速度差等判据来判断滑行状态，通过降低电制动力和控制防滑阀的动作，来减少制动力。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CR400BF型动车组防滑系统按照减速度和速度差等判据来判断滑行状态，通过降低电制动力和控制防滑阀的动作，来减少制动力。"},{"序号":1062,"试题类型":"判断题","试题内容":"CR400BF动车组具有比例制动功能由TBM统一管理。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CR400BF动车组具有比例制动功能，特点是TBM统一管理，各BCU采用等减速度的控制模式。"},{"序号":1063,"试题类型":"单选题","试题内容":"CR400AF动车组制动试验采用（）方式。","A":"手动制动试验","B":"菜单引导式制动试验","C":"自动制动试验","D":"遥控制动试验","正确选项":"B","试题解析":"CR400AF动车组制动试验采用菜单引导式制动试验。"},{"序号":1064,"试题类型":"单选题","试题内容":"CR400AF动车组制动试验中，（）不是试验内容。","A":"直通制动试验","B":"紧急制动EB试验","C":"牵引力试验","D":"防滑系统试验","正确选项":"C","试题解析":"CR400AF动车组试验内容包括：直通制动试验、紧急制动EB 试验/EB 转 UB 试验、紧急制动 UB 试验、防滑系统试验、总风管贯通性试验。"},{"序号":1065,"试题类型":"判断题","试题内容":"CR400AF动车组制动试验时，司机室无需投入占用即可开始试验。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":".CR400AF动车组制动试验前提条件\n（1）司机室需投入占用，并升弓送电， HMI 屏制动界面显示正常。\n（2）停放制动监控环路 PBML 与紧急制动环路EBL 未被旁路。\n（3）停放制动处于施加状态。\n（4）列车空气制动处于缓解状态\n（5）总风压力处于正常工作压力(800-950 kPa)范围。"},{"序号":1066,"试题类型":"单选题","试题内容":"在CR400AF动车组“直通制动试验”中，制动施加的时间至少应为（）秒。","A":3,"B":5,"C":7,"D":10,"正确选项":"B","试题解析":"CR400AF动车组“直通制动试验”中，制动必须施加至少5s。"},{"序号":1067,"试题类型":"判断题","试题内容":"CR400AF动车组“总风贯通性试验”中，将BP压力降低至800kPa以下。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CR400AF动车组“总风贯通性试验”中，将MR压力降低至900kPa以下。"},{"序号":1068,"试题类型":"判断题","试题内容":"CR400AF动车组“总风贯通性试验”中，等待1分钟空压机使两个端车的总风压力上升至少20kPa。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CR400AF动车组“总风贯通性试验”中，等待1分钟空压机使两个端车的总风压力上升至少 30kPa。"},{"序号":1069,"试题类型":"单选题","试题内容":"标准动车组运行中，紧急电磁阀（）始终得电。","A":"B12.01","B":"B12.02","C":"B12.03","D":"B12.04","正确选项":"C","试题解析":"标准动车组运行中，紧急电磁阀（B12.03）始终得电。"},{"序号":1070,"试题类型":"多选题","试题内容":"标准动车组供风与空簧控制模块的功能有（）、（）。","A":"给制动系统提供压缩空气","B":"给空气悬挂系统提供压缩空气","C":"防滑检测","D":"调整总风压力至所需值","正确选项":"AB","试题解析":"标准动车组供风与空簧控制模块负责给制动系统及空气悬挂系统提供所需的压缩空气。"},{"序号":1071,"试题类型":"判断题","试题内容":"标准动车组来自总风缸的压缩空气，经过安全阀后，分别被送往制动风缸及空气悬挂系统。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"标准动车组来自总风缸的压缩空气，经过滤清器后，分别被送往制动风缸及空气悬挂系统。"},{"序号":1072,"试题类型":"判断题","试题内容":"标准动车组总风压力超过670kPa时，总风缸才向空气弹簧供风。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"标准动车组总风压力不足时，为了优先满足制动系统的用风需求，在空簧控制气路上设置溢流阀(B13.03)，因此总风压力超过670kPa时，总风缸才向空气弹簧供风。"},{"序号":1073,"试题类型":"判断题","试题内容":"标准动车组为了防止空气弹簧因压力过高而爆裂，减压阀(B13.04)将总风压力调整至770kPa。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"标准动车组为了防止空气弹簧因压力过高而爆裂，减压阀(B13.04)将总风压力调整至700kPa。"},{"序号":1074,"试题类型":"单选题","试题内容":"标准动车组停放控制模块的主要功能是（）。","A":"控制列车启动和停止","B":"控制停放制动的施加和缓解","C":"监控列车空气压力","D":"调节列车运行速度","正确选项":"B","试题解析":"标准动车组停放控制模块用于控制停放制动的施加和缓解。"},{"序号":1075,"试题类型":"多选题","试题内容":"标准动车组来自供风模块的压缩空气，经（）、（）、（），进入停放缸。","A":"减压阀","B":"单脉冲电磁阀","C":"双脉冲电磁阀","D":"双向止回阀","正确选项":"ACD","试题解析":"标准动车组来自供风模块的压缩空气，经减压阀调整(B15.01)，再通过双脉冲电磁阀(B15.03)、双向止回阀(B15.06)后，进入停放缸。"},{"序号":1076,"试题类型":"判断题","试题内容":"标准动车组为防止空气制动力和停放制动力叠加，停放制动空气气路上设置双向止回阀(B15.06)。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"标准动车组为防止空气制动力和停放制动力叠加，停放制动空气气路上设置双向止回阀(B15.06)。"},{"序号":1077,"试题类型":"多选题","试题内容":"标准动车组制动控制装置包括（）、（）。","A":" PBCU","B":"EBCU","C":"TCU","D":"MCU","正确选项":"AB","试题解析":"标准动车组制动控制装置可分为两部分：左侧为PBCU，气动制动控制单元；右侧为EBCU，电子制动控制单元。"},{"序号":1078,"试题类型":"单选题","试题内容":"标准动车组为了检查主空压机的工作状态，需要在（）状态下进行暖机。","A":"空压机运转5分钟以上，停机后立即检查","B":"空压机运转5分钟以上，停机5-20分钟内","C":"空压机运转10分钟以上，停机后立即检查","D":"空压机运转10分钟以上，停机3-5分钟内","正确选项":"B","试题解析":"标准动车组暖机状态：空压机运转5分钟以上，停机5-20分钟内"},{"序号":1079,"试题类型":"判断题","试题内容":"标准动车组主供风单元检查中，需打开A04风缸的排水阀进行排水，排尽后复位，使用刀口布清洁底板。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"标准动车组主供风单元检查中，需打开A04风缸的排水阀进行排水，排尽后复位，使用刀口布清洁底板。"},{"序号":1080,"试题类型":"单选题","试题内容":"标准动车组主空压机散热风机工作时，冷却用风是由（）吸入的。","A":"主空压机箱体内侧进风口","B":"主空压机箱体下侧进风口","C":"主空压机箱体上侧进风口","D":"主空压机箱体右侧进风口","正确选项":"D","试题解析":"标准动车组主空压机散热风机工作后，冷却用风由主空压机箱体右侧的进风口吸入，吹向主空压机过滤器散热翅片，用于冷却主空压机油及压缩空气。"},{"序号":1081,"试题类型":"单选题","试题内容":"动车组空压机隔热棉长期在高温环境下运行，当温度超过（）℃时，会导致隔热棉老化。","A":80,"B":90,"C":100,"D":110,"正确选项":"C","试题解析":"动车组空压机隔热棉长期在高温环境下运行，当温度超过隔热棉的极限温度（100℃），导致隔热棉老化，长期受风吹出现隔热棉出现风干老化及破损脱落情况。"},{"序号":1082,"试题类型":"单选题","试题内容":"标准动车组制动阀板上的（）截断塞门负责单车制动供风。","A":"B30/1","B":"B30/2","C":"B32","D":"B37","正确选项":"C","试题解析":"标准动车组制动阀板及阀板上的截断塞门B30/1（一位转向架空簧供风）、B30/2（二位转向架空簧供风）、B36（单车供风，带触点）、B32（单车制动供风，带触点）、B37（停放制动供风，带触点）、B38（总风压力开关供风）、B51（总风给受电弓供风，带触点）、F30（撒砂供风，带触点）"},{"序号":1083,"试题类型":"判断题","试题内容":"标准动车组附加设备和球阀检查中，检查检测套管 （Z24）、 溢流阀 （Z23）、球阀（Z34、 Z31、Z32）、节流阀（Z25）安装牢固、无漏风。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"标准动车组附加设备和球阀检查中，检查检测套管 （Z24）、 溢流阀 （Z23）、球阀（Z34、 Z31、Z32）、节流阀（Z25）安装牢固、无漏风。"},{"序号":1084,"试题类型":"判断题","试题内容":"标准动车组其它制动部件检查：检查Z33/1（门/厕所供风截断塞门）、Z33/2（空调供风）、Z33/3（卫生间供风）、B31（总风截断塞门）、B33（总风截断塞门）、G01（防滑阀）等气动控制部件外观安装状态良好。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"标准动车组其它制动部件检查：检查Z33/1（门/厕所供风截断塞门）、Z33/2（空调供风）、Z33/3（卫生间供风）、B31（总风截断塞门）、B33（总风截断塞门）、G01（防滑阀）等气动控制部件外观安装状态良好。"},{"序号":1085,"试题类型":"单选题","试题内容":"标准动车组制动系统在无制动指令时，检测到制动缸压力大于（）kPa，会诊断“摩擦制动缓解故障”（故障代码520E）。","A":30,"B":40,"C":50,"D":60,"正确选项":"D","试题解析":"标准动车组紧急电磁阀受控于列车紧急制动UB安全环路，正常情况下紧急电磁阀处于得电的工作状态。当紧急电磁阀线圈发生开路故障时，会意外施加紧急制动；制动系统在无制动指令时，检测到制动缸压力大于60kPa，会诊断“摩擦制动缓解故障”（故障代码520E）。"},{"序号":1086,"试题类型":"单选题","试题内容":"标准动车组制动闸片最薄处应大于或等于（）mm（含钢背厚度）。","A":4,"B":5,"C":6,"D":3,"正确选项":"C","试题解析":"标准动车组制动闸片厚度超限者更换，闸片最薄处≥6mm（含钢背厚度）。"},{"序号":1087,"试题类型":"判断题","试题内容":"标准动车组制动盘上产生的所有裂纹都必须立即修复或更换。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"标准动车组在运用过程中，承受主要热应力的摩擦盘会产生深度很浅的细微分叉状裂纹。多数情况下这些所谓的发丝状裂纹是无关紧要的。"},{"序号":1088,"试题类型":"单选题","试题内容":"在标准动车组制动盘上，（）裂纹是不允许产生的。","A":"表面细微分叉状","B":"从内径扩展到外径的贯通","C":"冷却片上的微小","D":"冷却筋上的发丝状","正确选项":"B","试题解析":"在制动盘上不允许产生从内径一直扩展到外径，或扩展到冷却片或冷却筋的贯通裂纹。"},{"序号":1089,"试题类型":"多选题","试题内容":"标准动车组制动控制模块的主要功能包括（）、（）、（）。","A":"实现常用制动","B":"实现紧急制动EB","C":"实现紧急制动UB","D":"监控列车牵引系统","正确选项":"ABC","试题解析":"标准动车组制动控制模块用于实现常用制动、紧急制动EB、紧急制动UB等功能。"},{"序号":1090,"试题类型":"单选题","试题内容":"标准动车组菜单引导式制动试验完成后，HMI制动主界面应显示（）。","A":"制动系统故障","B":"空气制动不可用","C":"空气制动可用","D":"制动缸压力异常","正确选项":"C","试题解析":"标准动车组菜单引导式制动试验完成后，在 HMI 制动主界面各车显示空气制动可用。"},{"序号":1091,"试题类型":"判断题","试题内容":"CR400BF动车组在拖车空气制动不满足整车除电制动外剩余制动力时，由拖车空气制动补足剩余制动力。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":".CR400BF动车组若拖车空气制动不满足整车除电制动外剩余制动力时，剩余由动车空气制动补足。"},{"序号":1092,"试题类型":"判断题","试题内容":"CR400BF动车组制动时，电制动优先于空气制动。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CR400BF动车组动车中电制动优先，拖车最大空气制动优先。"},{"序号":1093,"试题类型":"多选题","试题内容":"以下关于CR400BF动车组制动系统的描述中，正确的有（）。","A":"制动系统具有停放制动状态检测功能","B":"制动系统具有防止空气制动力和停放制动力叠加的功能","C":"诊断功能","D":"停放制动的施加、缓解由贯穿列车的硬线控制","正确选项":"ABCD","试题解析":"CR400BF动车组制动系统具有停放制动状态检测、诊断功能、防止空气制动力和停放制动力叠加功能，停放制动的施加、缓解由贯穿列车的硬线控制。"},{"序号":1094,"试题类型":"单选题","试题内容":"CR400BF动车组检测到全轴滑行时，BCU会向（）单元发出电制动切除信号。","A":"TCU","B":"PBCU","C":"EBCU","D":"空压机","正确选项":"A","试题解析":"CR400BF动车组电制动防滑策略当检测到全轴滑行时，BCU向TCU发出电制动切除信号。"},{"序号":1095,"试题类型":"多选题","试题内容":"CR400BF动车组停放模块由（）等部件组成。","A":"停放减压阀","B":"双脉冲电磁阀","C":"压力测点","D":"双向止回阀","正确选项":"ABCD","试题解析":"CR400BF动车组停放模块组成：停放减压阀(B15.01)、双脉冲电磁阀(B15.03)、压力测点(B15.04、B15.07)、压力传感器(B15.05)和双向止回阀(B15.06)组成。"},{"序号":1096,"试题类型":"单选题","试题内容":"CR400BF动车组停放模块中的减压阀将（）kPa的总风压力调整至600kPa。","A":"600～750","B":" 700～800","C":"800～950","D":"750～950","正确选项":"C","试题解析":"CR400BF动车组减压阀(B15.01)：将800kPa～950kPa的总风压力调整至600kPa，防止停放制动缓解压力超出停放缸的承受能力。"},{"序号":1097,"试题类型":"单选题","试题内容":"CR400BF动车组双脉冲电磁阀采用（）方式。","A":" 一位二通单电控","B":"二位二通双电控","C":"一位三通双电控","D":"二位三通双电控","正确选项":"D","试题解析":".CR400BF动车组双脉冲电磁阀(B15.03)：采用二位三通双电控方式，有两个电磁线圈。"},{"序号":1098,"试题类型":"判断题","试题内容":"CR400BF动车组双向止回阀(B15.06)：防止空气制动力和停放制动力叠加。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CR400BF动车组双向止回阀(B15.06)：防止空气制动力和停放制动力叠加。"},{"序号":1099,"试题类型":"单选题","试题内容":"CR400AF动车组当总风压力小于（）kPa时，空压机内部压力开关会控制强制启机。","A":"600±20","B":"750±20","C":"800±20","D":"950±20","正确选项":"B","试题解析":"CR400AF动车组EBCU故障或者无主控时，当总风压力小于750±20kPa时，由空压机内部压力开关控制强制启机，两台空压机错时5s启动，大于950±20kPa时，由空压机内部压力开关控制空压机停机。"},{"序号":1100,"试题类型":"单选题","试题内容":"CR400AF动车组1、8车制动控制装置内接（）压力开关。","A":"600kPa和700kPa","B":"700kPa和800kPa","C":"750kPa和950kPa","D":"600kPa和750kPa","正确选项":"A","试题解析":"CR400AF动车组1、8车制动控制装置内接700kPa和600kPa压力开关。3、6车制动控制装置中内接750kPa和950kPa压力开关。"},{"序号":1101,"试题类型":"单选题","试题内容":"标准动车组司控器手柄向后代表（）。","A":"制动","B":"缓解","C":"牵引","D":"停车","正确选项":"A","试题解析":"标准动车组司控器设置1个手柄向前为牵引，向后为制动。"},{"序号":1102,"试题类型":"单选题","试题内容":"电牵引传动系统的核心控制对象是（）。","A":"齿轮箱","B":"牵引电机","C":"联轴节","D":"空气弹簧","正确选项":"B","试题解析":"电牵引传动系统以牵引电机为控制对象，对电机的转矩和速度进行调节，以满足车辆牵引和制动特性的要求。"},{"序号":1103,"试题类型":"单选题","试题内容":"交流传动系统和直流传动系统的主要区别是（）。","A":"电机类型","B":"电机尺寸","C":"电机悬挂方式","D":"电机重量","正确选项":"A","试题解析":"根据所采用传动电机是直流牵引电机还是交流牵引电机来分，电牵引传动系统可以分为直流传动系统和交流传动系统两大类。"},{"序号":1104,"试题类型":"单选题","试题内容":"现代高速列车主要采用（）传动系统。","A":"直流牵引","B":"交流牵引","C":"液压牵引","D":"气动牵引","正确选项":"B","试题解析":"目前世界范围内绝大部分高速列车均采用交流牵引传动系统。"},{"序号":1105,"试题类型":"多选题","试题内容":"动力分散型动车组相较于动力集中型动车组的优势包括（）、（）、（）。","A":"轴重小","B":"牵引力大","C":"启动加速快","D":"设备集中","正确选项":"ABC","试题解析":"动力分散型动车组轴重小，牵引动力大，启动加速快，驱动动轴多，粘着性能比较稳定，容易实现高速运转。"},{"序号":1106,"试题类型":"单选题","试题内容":"动力分散型动车组的特点不包括（）。","A":"轴重小","B":"牵引力大","C":"启动加速快","D":"设备集中","正确选项":"D","试题解析":"动力分散型动车组轴重小，牵引动力大，启动加速快，驱动动轴多，粘着性能比较稳定，容易实现高速运转。"},{"序号":1107,"试题类型":"判断题","试题内容":"动力集中动车组设置的特点之一是便于检修和集中通风冷却。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"动力集中设置的特点在于集中在头车的动力设备便于检修和集中通风冷却，同时使拖车少负担动力设备的重量和噪声干扰。"},{"序号":1108,"试题类型":"单选题","试题内容":"动力集中型动车组的特点不包括以下哪一项（）。","A":"便于检修和集中通风冷却","B":"集中在头车的动力设备","C":"拖车负担轻","D":"动力设备分散布置","正确选项":"D","试题解析":"动力集中设置的特点在于集中在头车的动力设备便于检修和集中通风冷却，同时使拖车少负担动力设备的重量和噪声干扰。"},{"序号":1109,"试题类型":"判断题","试题内容":"动力分散型动车组牵引电机驱动轴通常集中在头车的车轴上。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"动力分散布置：将全列车分为若干个动力单元，在每一个动力单元中带牵引电机的驱动轴（动力轴）分散布置在单元的每一个或部分车轴上。"},{"序号":1110,"试题类型":"单选题","试题内容":"动力分散型动车组牵引电机驱动轴通常布置在（）。","A":"只在头车的车轴上","B":"只在尾车的车轴上","C":"动力车每一个或部分车轴上","D":"只在受电弓所在车的车轴上","正确选项":"C","试题解析":"动力分散布置：将全列车分为若干个动力单元，在每一个动力单元中带牵引电机的驱动轴（动力轴）分散布置在单元的每一个或部分车轴上。"},{"序号":1111,"试题类型":"判断题","试题内容":"动力集中型动车组两端（或一端）的驱动装置对旅客座位区域的噪声影响小。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"动力集中型动车组驱动装置集中在两端（或一端），远离旅客座位，噪声小。"},{"序号":1112,"试题类型":"单选题","试题内容":"动车组通过（）升起受电弓，使受电弓滑板与接触网接触。","A":"电力驱动","B":"手动操作","C":"压缩空气进入升弓装置气囊","D":"液力驱动","正确选项":"C","试题解析":"受电弓是从接触网获得电能的部件，列车运行时压缩空气通过车辆的各阀进入受电弓升弓装置气囊，升起受电弓，使受电弓滑板与接触网接触。"},{"序号":1113,"试题类型":"多选题","试题内容":"为了保证高速动车组高速运行时的可靠受流，受电弓必须满足（）、（）、（）等关键要求。","A":"合适的接触压力","B":"结构设计合理","C":"降低运动部分重量","D":"升降弓动作速度先慢后快","正确选项":"ABC","试题解析":"为了保证高速动车组高速运行时的可靠受流，高速动车组受电弓必须满足一定要求。（1）板的材料、形状、尺寸；（2）合适的接触压力；（3）结构设计；（4）降低受电弓运动部分的重量；（5）升降弓时，动作速度。"},{"序号":1114,"试题类型":"判断题","试题内容":"目前动车组主要采用单滑板受电弓和双滑板受电弓。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"目前动车组主要采用单滑板受电弓和双滑板受电弓。"},{"序号":1115,"试题类型":"多选题","试题内容":"受电弓降弓时，以下哪些要求是正确的（）、（）。","A":"离开接触网导线要快","B":"到达落弓位时要慢","C":"可以产生拉弧","D":"对车顶冲击力可以较大","正确选项":"AB","试题解析":"受电弓降弓时，离开接触网导线要快，避免产生拉弧，而到达落弓位时要慢，减少对车顶冲击力。"},{"序号":1116,"试题类型":"单选题","试题内容":"受电弓滑板在其垂直工作范围内保持水平的原因是（）。","A":"减小接触面积","B":"减小空气阻力对接触压力的影响","C":"增加受电弓的支撑力","D":"提高受电弓的升降速度","正确选项":"B","试题解析":"受电弓滑板在其垂直工作范围内始终保持水平，减少甚至消除空气阻力对滑板与接触网间接触压力的影响。"},{"序号":1117,"试题类型":"单选题","试题内容":"受电弓滑板在其垂直工作范围内应保持（）状态。","A":"倾斜","B":"垂直","C":"水平","D":"不定","正确选项":"C","试题解析":"受电弓滑板在其垂直工作范围内始终保持水平，减少甚至消除空气阻力对滑板与接触网间接触压力的影响。"},{"序号":1118,"试题类型":"单选题","试题内容":"受电弓升弓的主要驱动力是（）。","A":"电动马达","B":"压缩空气","C":"液压缸","D":"手动操作","正确选项":"B","试题解析":"受电弓一般是通过压缩空气驱动气囊来实现升降控制的，要升弓时，风管路向气囊充气，气囊充气后膨胀，推动连杆机构使受电弓升起，当需要降弓时，气囊失气，受电弓升降机构及弓头由于重力作用，自动降下。"},{"序号":1119,"试题类型":"单选题","试题内容":"当需要降下受电弓时，主要依靠（）作用使其降下。","A":"风管路充气","B":"气囊膨胀","C":"连杆机构推动","D":"重力","正确选项":"D","试题解析":"受电弓一般是通过压缩空气驱动气囊来实现升降控制的，要升弓时，风管路向气囊充气，气囊充气后膨胀，推动连杆机构使受电弓升起，当需要降弓时，气囊失气，受电弓升降机构及弓头由于重力作用，自动降下。"},{"序号":1120,"试题类型":"判断题","试题内容":"为了适应不同的接触网特性及受电弓弓头质量等条件，可以通过调整受电弓弓头弹簧的弹性、改变受电弓的阻尼特性来应对。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"为了适应不同的接触网特性及受电弓弓头质量等条件，可以通过调整受电弓弓头弹簧的弹性、改变受电弓的阻尼特性来应对。"},{"序号":1121,"试题类型":"单选题","试题内容":"受电弓的压缩空气管路中，用于调节空气压力的部件是（）。","A":"液压阀","B":"空气过滤器","C":"节流阀","D":"精密调压阀","正确选项":"D","试题解析":"受电弓的压缩空气的空气管路主要由电控阀、空气过滤器、节流阀、精密调压阀、升弓装置（气囊）等组成。"},{"序号":1122,"试题类型":"判断题","试题内容":"CR400AF/BF型动车组均采用被动控制方式的受电弓。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CR400AF/BF型动车组均采用主动控制方式的受电弓。"},{"序号":1123,"试题类型":"单选题","试题内容":"DSA250受电弓的（）部分负责实现升降动作。","A":"底架","B":"弓装配","C":"升弓装置（气囊）","D":"编导线","正确选项":"C","试题解析":"DSA250受电弓主要由弓头、上臂、上导杆、下臂、下导杆、升弓装置（气囊）、阻尼器、底架及空气管路等组成。"},{"序号":1124,"试题类型":"多选题","试题内容":"CX-GI型单臂受电弓主要包括（）等主要部件。","A":"底架（带有自动降弓装置ADD阀）","B":"下臂和上臂","C":"弓头（包括碳滑板）","D":"绝缘气管APIM及APIM固定板","正确选项":"ABCD","试题解析":"CX-GI型单臂受电弓主要由如下主要部件组成：底架（带有自动降弓装置ADD阀）、下臂、上臂、下拉杆、上平衡杆、气囊、阻尼器、弓头（包括碳滑板）、软连线、绝缘子和绝缘气管APIM及APIM固定板等。"},{"序号":1125,"试题类型":"单选题","试题内容":"CX-GI型受电弓通过（）模块对气囊压力进行主动控制。","A":"空气过滤","B":"液压控制","C":"电空集成控制","D":"电磁控制","正确选项":"C","试题解析":"CX-GI型受电弓采用主动先导控制技术，以列车速度和受电弓位置参数等为依据，通过电空集成的控制模块对受电弓气囊压力进行主动控制，进而间接的控制受电弓与接触网之间的接触压力。"},{"序号":1126,"试题类型":"单选题","试题内容":"受电弓碳滑板内部安装的ADD检测气路主要用于实现（）功能。","A":"调节受电弓高度","B":"检测升弓高度","C":"自动降弓检测","D":"控制列车速度","正确选项":"C","试题解析":"受电弓碳滑板内部安装有ADD检测气路，具有自动降弓检测功能，当列车运行过程中受电弓发生自动降弓时，会同时自动断开主断路器。"},{"序号":1127,"试题类型":"单选题","试题内容":"主断路器的主要功能是（）。","A":"控制列车速度","B":"断开高压回路、保护设备","C":"控制受电弓升降","D":"监测列车运行状态","正确选项":"B","试题解析":"主断路器，实现断开高压回路、保护设备的功能。在故障状态下、控制电路失电情况下主断路器的触点能够自动断开，可实现良好的开关能力，具有良好的安全性能。具有控制和保护的双重功能。"},{"序号":1128,"试题类型":"单选题","试题内容":"主断路器内真空泡主要（）组成。","A":"真空灭弧室与压力传感器","B":"真空灭弧室与动、静触点","C":"绝缘体与动触点","D":"静触点与气囊","正确选项":"B","试题解析":"主断路器内的真空泡由真空灭弧室及动、静触点组成，动、静触点均置于真空灭弧室内。"},{"序号":1129,"试题类型":"多选题","试题内容":"下列关于动车组真空断路器的描述中，（）、（）、（）是正确的。","A":"CRH2型动车组采用CB201型真空断路器","B":"CRH380A型动车组采用22CBNG型真空断路器","C":"CRH5型动车组采用22CBNG型真空断路器","D":"CRH380AL型动车组采用与CRH2型相同的真空断路器","正确选项":"ACD","试题解析":"CRH2及CRH380A/CRH380AL型动车组采用CB201型真空断路器；CRH5型动车组采用22CBNG型真空断路器。"},{"序号":1130,"试题类型":"单选题","试题内容":"断路器分闸时，车辆主电路中的高压电弧在（）熄灭。","A":"普通空气中","B":"电感器中","C":"灭弧室组装的真空管内","D":"电容器中","正确选项":"C","试题解析":"断路器分闸时，车辆主电路中高压电弧在灭弧室组装中的真空管内进行熄灭。"},{"序号":1131,"试题类型":"多选题","试题内容":"CR400BF型动车组真空断路器的主要组成部分包括（）、（）、（）。","A":"高压部分（灭弧室）","B":"隔离绝缘部分（支持绝缘子）","C":"控制系统","D":"低压操作机构","正确选项":"ABD","试题解析":"CR400BF型动车组真空断路器有三个主要的组成部分，上面是高压部分（灭弧室部分），中间是隔离绝缘部分（支持绝缘子部分），下面是低压部分（低压操作机构部分）。"},{"序号":1132,"试题类型":"判断题","试题内容":"CR400BF型动车组真空断路器接地开关采用手动控制，它有两个位置：“运行”位和“接地”位。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CR400BF型动车组真空断路器接地开关采用手动控制，它有两个位置：“运行”位和“接地”位。"},{"序号":1133,"试题类型":"单选题","试题内容":"接地保护开关的主要作用是（）。","A":"在维修时使辅助回路接地，确保操作安全","B":"监测列车电气状态","C":"在维修时使主回路接地，确保操作安全","D":"调整列车灯光系统","正确选项":"C","试题解析":"接地保护开关属于安全保护装置，当操作人员进行检查或维修时，操作接地保护开关可使机车上断路器两侧的主回路接地，使机车主电路处于无电状态，从而保证操作人员的人身安全。"},{"序号":1134,"试题类型":"多选题","试题内容":"避雷器主要由（）等部件构成。","A":"硅橡胶复合外套","B":"芯体","C":"接线端子","D":"法兰和接地引线","正确选项":"ABCD","试题解析":"避雷器主要由硅橡胶复合外套、芯体、接线端子、法兰和接地引线构成。"},{"序号":1135,"试题类型":"判断题","试题内容":"避雷器具有体积小、重量轻、耐污秽能力优良等特点。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"避雷器具有体积小、重量轻、耐污秽能力优良等特点。"},{"序号":1136,"试题类型":"判断题","试题内容":"电流互感器的二次侧额定电流为10A，电压互感器的二次侧额定电压为100V。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"电流互感器的二次侧额定电流为5A或1A，电压互感器的二次侧额定电压为100V。"},{"序号":1137,"试题类型":"多选题","试题内容":"（）、（）、（）安装了高压隔离开关。","A":"CRH1型动车组","B":"CRH2型动车组","C":"CRH3型动车组","D":"CRH5型动车组","正确选项":"ABC","试题解析":"除CRH5型动车组外，其他动车组均安装有高压隔离开关。"},{"序号":1138,"试题类型":"单选题","试题内容":"CR400AF/BF型动车组高压隔离开关采用（）控制方式。","A":"电控、手动","B":"电控、气动","C":"气动、手动","D":"液压、电控","正确选项":"B","试题解析":"CR400AF/BF型动车组高压隔离开关采用电控、气动控制。"},{"序号":1139,"试题类型":"单选题","试题内容":"CR400AF/BF型动车组高压隔离开关（）安装于密封高压电器箱内，正常运行时为（）状态。","A":"水平、断开","B":"垂直、断开","C":"垂直、闭合","D":"水平、闭合","正确选项":"D","试题解析":"CR400AF/BF型动车组高压隔离开关水平安装于密封高压电器箱内，正常运行时为闭合状态，当某个高压单元故障时可通过隔离开关进行切除，提高动车组高压系统冗余度。"},{"序号":1140,"试题类型":"单选题","试题内容":"高压隔离开关在（）条件下进行所有动作。","A":"主断路器处于闭合状态","B":"主断路器处于分断状态","C":"无论主断路器处于何种状态","D":"特定条件下，与主断路器状态无关","正确选项":"B","试题解析":"高压隔离开关不带灭弧装置，不具有开断电流的能力；因此，它的所有动作都必须在主断路器处于分断状态时进行。"},{"序号":1141,"试题类型":"判断题","试题内容":"高压隔离开关的动作可以在主断路器处于闭合状态时进行。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"高压隔离开关不带灭弧装置，不具有开断电流的能力；因此，它的所有动作都必须在主断路器处于分断状态时进行。"},{"序号":1142,"试题类型":"单选题","试题内容":"高压电缆组件主要功能是将受电弓处获得的电能传输到动车组（）。","A":"辅助变流器","B":"牵引变压器","C":"牵引变流器","D":"牵引电机","正确选项":"B","试题解析":"高压电缆组件作为高压系统的一部分，其主要功能是将受电弓处获得的电能传输到动车组牵引变压器。"},{"序号":1143,"试题类型":"单选题","试题内容":"电压互感器工作时，一次侧接（），二次侧接（）。","A":"功率表的电压线圈，被测的高压电路","B":"电压表的电压线圈，被测的高压电路","C":"电压表或功率表的电压线圈、被测的高压电路","D":"被测的高压电路、电压表或功率表的电压线圈","正确选项":"D","试题解析":"电压互感器工作时，一次侧直接接到被测的高压电路，二次侧接电压表或功率表的电压线圈。"},{"序号":1144,"试题类型":"单选题","试题内容":"CX-GI型受电弓在控制单元内设置（）曲线。","A":"速度-气囊压力","B":"湿度-气囊压力","C":"温度-气囊压力","D":"载重-气囊压力","正确选项":"A","试题解析":"CX-GI型受电弓主动控制逻辑首先根据线路接触网参数和以往的运营经验在控制单元内设置速度-气囊压力曲线。"},{"序号":1145,"试题类型":"单选题","试题内容":"列车发出升弓指令后，（）得电，使压力空气流向升弓气囊和碳滑板ADD检测气路。","A":"升弓电磁阀","B":"调压阀","C":"安全阀","D":"ADD电磁阀","正确选项":"A","试题解析":"列车发出受电弓升弓指令后，升弓电磁阀得电，压力空气经过升弓电磁阀、调压阀及车顶供气管路，一路进入气囊，驱动受电弓升起，另一路通过ADD阀到碳滑板ADD检测气路、压力开关和ADD电磁阀。"},{"序号":1146,"试题类型":"多选题","试题内容":"列车发出降弓命令后，（）部件会参与降弓过程。","A":"升弓电磁阀","B":"碳滑板ADD检测气路、压力开关","C":"受电弓","D":"升弓气囊","正确选项":"ABCD","试题解析":"列车发出降弓命令后，升弓电磁阀失电，气囊内的压力空气经由升弓电磁阀排气口排出，受电弓在重力作用下降弓，碳滑板ADD检测气路、压力开关和ADD电磁阀内的压力空气也同时排出。"},{"序号":1147,"试题类型":"判断题","试题内容":"在动车组行进过程中，为了改善受流性能，弓头与上臂杆之间采用刚性结构。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"在动车组行进过程中，为了改善受流性能，弓头与上臂杆之间采用弹性结构。"},{"序号":1148,"试题类型":"单选题","试题内容":"真空断路器灭弧室内动触头的操作是由（）传动来完成。","A":"液压装置","B":"感应装置","C":"机械装置","D":"手动装置","正确选项":"C","试题解析":"真空断路器灭弧室组装内安装有真空开关管，真空管内有两个主触头：一个是静触头，另一个是动触头，其触头通过波纹管密封和大气隔离，动触头的操作是由机械装置传动来完成。"},{"序号":1149,"试题类型":"判断题","试题内容":"真空断路器支持绝缘子主要是保证高压部分与低压部分之间的绝缘。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"真空断路器支持绝缘子主要是保证高压部分与低压部分之间的绝缘。"},{"序号":1150,"试题类型":"判断题","试题内容":"真空断路器低压部分主要是机械操作部分，用于操作灭弧室内的动触头。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"真空断路器低压部分主要是机械操作部分，用于操作灭弧室内的动触头。"},{"序号":1151,"试题类型":"单选题","试题内容":"在整个升弓过程中，ADD阀（）。","A":"控制受电弓升弓速度","B":"上下阀体压力会达到平衡","C":"控制受电弓降弓速度","D":"上下阀体压力不会达到平衡","正确选项":"B","试题解析":"在整个升弓过程中，ADD阀的作用非常重要，压力空气首先通过下阀体的缩孔向上阀体、碳滑板ADD检测气路、压力开关和ADD电磁阀供风直至上下阀体压力达到平衡，受电弓升起。"},{"序号":1152,"试题类型":"单选题","试题内容":"动车组上（）将25kV高压电变换为适合牵引变流器工作的电压。","A":"受电弓","B":"辅助变流器","C":"主变压器","D":"主断路器","正确选项":"C","试题解析":"主变压器是动车组上的重要部件，用来把接触网上取得的25kV高压电变换为供给牵引变流器及其他电器工作所适合的电压。"},{"序号":1153,"试题类型":"单选题","试题内容":"变压器是以（）为媒介来实现能量传递的。","A":"电流","B":"电阻","C":"电场","D":"磁场","正确选项":"D","试题解析":"变压器是以磁场为媒介的。"},{"序号":1154,"试题类型":"单选题","试题内容":"变压器两个绕组中一个接到交流电源，称为（），另一个接到负载，称为二次绕组。","A":"一次绕组","B":"二次绕组","C":"负载绕组","D":"辅助绕组","正确选项":"A","试题解析":"变压器两个绕组中一个接到交流电源，称为一次绕组，另一个接到负载，称为二次绕组。"},{"序号":1155,"试题类型":"判断题","试题内容":"变压器的结构主要由铁芯、绕组、油箱和缘套管等部件组成。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"变压器的结构主要由铁芯、绕组、油箱和缘套管等部件组成。"},{"序号":1156,"试题类型":"多选题","试题内容":"变压器油的主要作用是（）、（）。","A":"冷却","B":"绝缘","C":"机械支撑","D":"电磁感应","正确选项":"AB","试题解析":"铁芯和绕组是变压器进行电磁感应的基本部分，称为器身。油箱起机械支撑、冷却散热和保护作用；油起冷却和绝缘作用；套管主要起绝缘作用。"},{"序号":1157,"试题类型":"单选题","试题内容":"变压器油箱的主要作用不包括（）。","A":"机械支撑","B":"冷却散热","C":"绝缘保护","D":"电磁感应","正确选项":"D","试题解析":"铁芯和绕组是变压器进行电磁感应的基本部分，称为器身。油箱起机械支撑、冷却散热和保护作用；油起冷却和绝缘作用；套管主要起绝缘作用。"},{"序号":1158,"试题类型":"单选题","试题内容":"变压器铁芯主要由（）部分组成。","A":"芯柱和铁轭","B":"芯柱和绕组","C":"铁轭和绕组","D":"绕组和油箱","正确选项":"A","试题解析":"铁芯是变压器的磁路部分，它分为芯柱和铁轭两部分。"},{"序号":1159,"试题类型":"单选题","试题内容":"动车组牵引变压器主要采用（）结构。","A":"芯式变压器和壳式变压器","B":"干式变压器和油浸式变压器","C":"自耦变压器和隔离变压器","D":"电力变压器和特种变压器","正确选项":"A","试题解析":"动车组牵引变压器主要采用两种结构：芯式变压器和壳式变压器。"},{"序号":1160,"试题类型":"单选题","试题内容":"为了减少交变磁通在铁芯中产生的磁滞损耗，变压器铁芯通常由（）叠装而成。","A":"厚度为1mm的铜片","B":"厚度为0.5mm的热轧低碳钢片","C":"厚度为0.35mm的冷轧高硅钢片","D":"厚度为2mm的铝片","正确选项":"C","试题解析":"为了减少交变磁通在铁芯中产生磁滞损耗，变压器铁芯通常由厚度为0.35mm、表面涂绝缘漆的冷轧高硅钢片叠装而成。"},{"序号":1161,"试题类型":"判断题","试题内容":"CRH2/CRH380A系列动车组采用芯式变压器。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CRH2/CRH380A系列动车组采用壳式变压器。"},{"序号":1162,"试题类型":"判断题","试题内容":"CR400AF/CR400BF型动车组采用芯式变压器。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CR400AF/CR400BF型动车组采用芯式变压器。"},{"序号":1163,"试题类型":"判断题","试题内容":"绕组是变压器的磁路部分，它由包有绝缘材料的铜（或铝）导线绕制而成。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"绕组是变压器的电路部分，它由包有绝缘材料的铜（或铝）导线绕制而成。"},{"序号":1164,"试题类型":"判断题","试题内容":"高速动车组变压器线圈均放置在油箱中，箱内充满变压器油，其目的是提高绝缘强度、加强散热。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"高速动车组变压器线圈均放置在油箱中，箱内充满变压器油，其目的是提高绝缘强度（因变压器油绝缘性能比空气好）、加强散热。"},{"序号":1165,"试题类型":"单选题","试题内容":"变压器绝缘套管的结构主要取决于（）因素。","A":"变压器容量","B":"变压器油箱类型","C":"电压等级","D":"电流大小","正确选项":"C","试题解析":"变压器绝缘套管一般是瓷质、硅橡胶或树脂材料的，它的结构主要取决于电压等级。"},{"序号":1166,"试题类型":"判断题","试题内容":"为了增加表面放电距离，变压器绝缘套管外形做成多级伞形，电压越高级数越少。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"为了增加表面放电距离，变压器绝缘套管外形做成多级伞形，电压越高级数越多。"},{"序号":1167,"试题类型":"单选题","试题内容":"目前动车组牵引变压器普遍采用（）方式冷却。","A":"油循环强迫风冷","B":"水冷","C":"自然风冷","D":"水循环强迫风冷","正确选项":"A","试题解析":"目前动车组普遍采用油循环强迫风冷方式冷却。"},{"序号":1168,"试题类型":"多选题","试题内容":"动车组牵引系统主要由（）、（）、（）等设备组成。","A":"牵引变压器","B":"牵引变流器","C":"辅助变流器","D":"牵引电机","正确选项":"ABD","试题解析":"动车组牵引系统主要由牵引变压器、牵引变流器及牵引电机等设备组成。"},{"序号":1169,"试题类型":"单选题","试题内容":"CR400AF型动车组每台牵引变流器通过（）方式驱动牵引电机。","A":"架控","B":"轴控","C":"车控","D":"自控","正确选项":"A","试题解析":"CR400AF型动车组每台牵引变流器通过“架控”方式驱动2个转向架的4台牵引电机。"},{"序号":1170,"试题类型":"单选题","试题内容":"CR400AF型动车组每个转向架上有（）牵引电机。","A":"1台","B":"2台","C":"3台","D":"4台","正确选项":"B","试题解析":"CR400AF型动车组每台牵引变流器通过“架控”方式驱动2个转向架的4台牵引电机。"},{"序号":1171,"试题类型":"单选题","试题内容":"CR400AF型动车组牵引变压器用于将接触网上获得的AC25kV高压电变换为供给牵引变流器所适合的（）电压。","A":"AC1800V","B":"DC1800V","C":"AC1900V","D":"DC1900V","正确选项":"C","试题解析":"CR400AF型动车组牵引变压器用于将接触网上获得的AC25kV高压电变换为供给牵引变流器所适合的AC1900V电压。"},{"序号":1172,"试题类型":"单选题","试题内容":"CR400AF型动车组牵引变压器的结构设计特点包括（）。","A":"铁芯为空心结构","B":"只有一个绕组","C":"绕组与铁芯直接接触","D":"五个互相绝缘的绕组套在一个共同的铁芯上","正确选项":"D","试题解析":"CR400AF型动车组牵引变压器利用电磁感应原理工作，结构设计为五个互相绝缘的绕组套在一个共同的铁芯上，通过磁耦合进行电压变换。"},{"序号":1173,"试题类型":"单选题","试题内容":"CR400AF型动 "4和7车","正确选项":"C","试题解析":"CRH5型动车组高压设备位于3和6车上，由受电弓、主断路器、避雷器、网侧检测装置等组成。"},{"序号":1242,"试题类型":"多选题","试题内容":"CR400AF型动车组高压设备连接的特点包括（）、（）。","A":"高压设备箱采用整体密封结构","B":"受电弓安装在车顶高压设备箱内","C":"除受电弓和网侧避雷器外，其它高压设备均安装在车下高压设备箱内","D":"网侧避雷器安装在车下高压设备箱内","正确选项":"AC","试题解析":"CR400AF型动车组高压设备连接采用高压设备箱整体密封结构，除受电弓和网侧避雷器外的其它高压设备均安装在车下高压设备箱内。"},{"序号":1243,"试题类型":"单选题","试题内容":"CR400AF型动车组的高压设备连接主要采用了（）结构形式。","A":"高压设备箱整体密封","B":"分散安装","C":"开放式","D":"无密封","正确选项":"A","试题解析":"CR400AF型动车组高压设备连接采用高压设备箱整体密封结构，除受电弓和网侧避雷器外的其它高压设备均安装在车下高压设备箱内。"},{"序号":1244,"试题类型":"单选题","试题内容":"8辆编组的CR400AF型动车组（）各设置1个基本高压单元。","A":"Tp3车和Tp6车","B":"Tp2车和Tp6车","C":"Tp3车和Tp5车","D":"Tp2车和Tp5车","正确选项":"A","试题解析":"8辆编组的CR400AF型动车组Tp3车和Tp6车各设置 1个基本高压单元，每个高压单元的设置相同。"},{"序号":1245,"试题类型":"单选题","试题内容":"CR400AF型动车组可通过（）隔离对应的高压单元。","A":"真空断路器","B":"隔离开关","C":"熔断器","D":"自动控制系统","正确选项":"B","试题解析":"CR400AF型动车组可通过隔离开关隔离对应的高压单元。"},{"序号":1246,"试题类型":"单选题","试题内容":"CR400AF型动车组通过（）可对故障受电弓、电压互感器、电流互感器等进行隔离。","A":"真空断路器","B":"隔离开关","C":"熔断器","D":"自动控制系统","正确选项":"A","试题解析":"CR400AF型动车组通过真空断路器可对故障受电弓、电压互感器、电流互感器等进行隔离。"},{"序号":1247,"试题类型":"单选题","试题内容":"CR400AF型动车组每个高压单元设置（）个避雷器。","A":1,"B":2,"C":3,"D":4,"正确选项":"B","试题解析":"CR400AF型动车组每个高压单元设置2个避雷器，实现高压回路过电压两级保护。"},{"序号":1248,"试题类型":"单选题","试题内容":"CR400BF型动车组的高压设备主要位于（）。","A":"车厢侧部","B":"TP车车顶","C":"车厢底部","D":"车厢端部","正确选项":"B","试题解析":"CR400BF型动车组高压设备主要位于TP车车顶，采用高压电器箱方案，将除受电弓、绝缘子、网侧避雷器外的其余高压部件放置于高压电器箱内。"},{"序号":1249,"试题类型":"判断题","试题内容":"8辆编组CR400BF型动车组供电系统高压各部件分别布置于TP03车、TP05车。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"8辆编组CR400BF型动车组供电系统高压各部件分别布置于TP03车、TP06车。"},{"序号":1250,"试题类型":"单选题","试题内容":"电气制动主要利用了（）原理来实现制动效果。","A":"热力学","B":"电机可逆性","C":"流体力学","D":"机械摩擦","正确选项":"B","试题解析":"电气制动是利用电机的可逆性原理。"},{"序号":1251,"试题类型":"单选题","试题内容":"在电气制动过程中，电机通常处于（）状态。","A":"电动机状态","B":"发电机状态","C":"停止状态","D":"反转状态","正确选项":"B","试题解析":"动车组在电气制动时，列车的惯性带动牵引电机，此时牵引电机做发电机运行，使列车动能转变为电能，输出制动电流的同时，在牵引电机轴上产生反向力矩并作用于轮对，形成制动力。"},{"序号":1252,"试题类型":"单选题","试题内容":"电气制动主要分为（）两种形式。","A":"电阻制动和机械制动","B":"电阻制动和再生制动","C":"再生制动和电磁制动","D":"电磁制动和机械制动","正确选项":"B","试题解析":"电气制动分为电阻制动和再生制动两种形式。"},{"序号":1253,"试题类型":"多选题","试题内容":"在电阻制动中，制动时产生的电能（）、（）。","A":"回馈到电网","B":"存储在电池中","C":"通过制动电阻消耗","D":"转化为热能消耗","正确选项":"CD","试题解析":"将电气制动时产生的电能利用电阻使之转化为能量消耗，称为电阻制动；如果将电气制动产生的电能重新反馈到电网加以利用，称之为再生制动。"},{"序号":1254,"试题类型":"单选题","试题内容":"再生制动时，制动时产生的电能主要流向（）。","A":"制动电阻","B":"电池","C":"电机","D":"电网","正确选项":"D","试题解析":"将电气制动时产生的电能利用电阻使之转化为能量消耗，称为电阻制动；如果将电气制动产生的电能重新反馈到电网加以利用，称之为再生制动。"},{"序号":1255,"试题类型":"多选题","试题内容":"电制动优越性包括：（）、（）、（）。","A":"减少基础制动装置的机械磨耗","B":"提高制动系统的可靠性和安全性","C":"缩短制动距离","D":"浪费了电能","正确选项":"ABC","试题解析":"电制动优越性：减少基础制动装置的机械磨耗，大大地降低检修成本，加快制动力上升速度，提高制动系统的可靠性和安全性，以达到延长基础制动装置的使用寿命及缩短制动距离的目的；同时也节约了电能。"},{"序号":1256,"试题类型":"判断题","试题内容":"CR400AF型动车组牵引变压器为三相芯式变压器，采用整体设计，变压器本体与冷却系统、储油柜一体化布置。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CR400AF型动车组牵引变压器为单相芯式变压器，采用整体设计，变压器本体与冷却系统、储油柜一体化布置。"},{"序号":1257,"试题类型":"判断题","试题内容":"CR400AF型动车组牵引变压器采用高强度结构钢制油箱，储油柜布置在油箱顶面。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CR400AF型动车组牵引变压器采用高强度结构钢制油箱，储油柜布置在油箱侧面。"},{"序号":1258,"试题类型":"判断题","试题内容":"牵引变压器吸湿器硅胶颜色（新品为橘红色）有半数以上变色（绿色）时，更换硅胶或对硅胶干燥处理。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"应该按照检修维修计划对牵引变压器吸湿器硅胶颜色进行监控，当硅胶的颜色（新品为橘红色）有半数以上变色（绿色）时，更换硅胶或对硅胶干燥处理。"},{"序号":1259,"试题类型":"单选题","试题内容":"牵引变压器温度传感器原理是利用温度传感器中随温度变化的（），换算到相应的温度。","A":"电感值","B":"电压值","C":"电流值","D":"电阻值","正确选项":"D","试题解析":"牵引变压器温度传感器用于记录变压器油的温度，其原理是利用温度传感器中随温度变化的电阻值，换算到相应的温度。"},{"序号":1260,"试题类型":"判断题","试题内容":"CR400AF型动车组牵引变压器温度传感器护套内集成三个独立的pt100，pt100为铂金测量电阻器。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CR400AF型动车组牵引变压器温度传感器护套内集成两个独立的pt100，pt100为铂金测量电阻器。"},{"序号":1261,"试题类型":"单选题","试题内容":"牵引变压器油流继电器的主要作用是（）。","A":"监测油温","B":"监测油压","C":"监测油流状态","D":"控制变压器电流","正确选项":"C","试题解析":"CR400AF型动车组牵引变压器在油管上设置了一个油流继电器，用于监测油流的状态是否正常。循环油量大致减少到120L/min以下时，变流器主接触器断开。"},{"序号":1262,"试题类型":"判断题","试题内容":"CR400AF型动车组牵引变压器油位低，报警提示；油位过低，车辆 VCB（真空断路器）断开。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CR400AF型动车组牵引变压器油位低，报警提示；油位过低，车辆 VCB（真空断路器）断开。"},{"序号":1263,"试题类型":"多选题","试题内容":"牵引变压器温度继电器报警可能原因：（）。","A":"过载","B":"油冷却器堵塞","C":"送风机故障","D":"温度继电器自身故障","正确选项":"ABCD","试题解析":"牵引变压器温度继电器报警原因：（1）过载；（2）油冷却器堵塞；（3）送风机故障；（4）温度继电器自身故障。"},{"序号":1264,"试题类型":"多选题","试题内容":"牵引变压器压力释放阀动作可能原因：（）。","A":"内部异常过热","B":"内部放电","C":"外部短路冲击","D":"压力释放阀自身故障","正确选项":"ABCD","试题解析":"牵引变压器压力释放阀动作原因：（1）内部异常过热；（2）内部放电；（3）外部短路冲击；（4）压力释放阀自身故障。"},{"序号":1265,"试题类型":"多选题","试题内容":"牵引变压器原边过流保护可能原因：（）、（）、（）。","A":"变压器原边接地","B":"变压器次边断路","C":"变流器短路","D":"互感器自身故障","正确选项":"ACD","试题解析":"牵引变压器原边过流保护原因：（1）变压器原边接地；（2）变压器次边短路；（3）变流器短路；（4）互感器自身故障。"},{"序号":1266,"试题类型":"判断题","试题内容":"CR400BF型动车组牵引变流器通过中间直流环节为相邻拖车的辅助变流器供电。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CR400BF型动车组牵引变流器通过中间直流环节为相邻拖车的辅助变流器供电。"},{"序号":1267,"试题类型":"判断题","试题内容":"大功率IGBT的采用，减轻了牵引变流器的重量，对于采用了动力分散带来的动力设备多、重量大的缺点可以很好的弥补。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"大功率IGBT的采用，减轻了牵引变流器的重量，对于采用了动力分散带来的动力设备多、重量大的缺点可以很好的弥补。"},{"序号":1268,"试题类型":"判断题","试题内容":"脉冲整流器在再生制动时作为逆变器，将直流电转变成三相交流电。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"脉冲整流器在牵引时作为整流器，将单相交流电转变成直流电；再生制动时作为逆变器，将直流电转变成单相交流电。"},{"序号":1269,"试题类型":"判断题","试题内容":"CR400AF型动车组牵引变流器采用主辅分离设计。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CR400AF型动车组牵引变流器采用主辅一体化设计，由四象限整流器、牵引逆变器、中间直流环节、辅助逆变器等构成。"},{"序号":1270,"试题类型":"判断题","试题内容":"CR400AF型动车组牵引变流器主要由功率模块、传动控制装置（TCU）、主接触器、支撑电容、二次谐振电容、斩波电阻等组成。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CR400AF型动车组牵引变流器主要由功率模块、传动控制装置（TCU）、主接触器、支撑电容、二次谐振电容、斩波电阻、水泵、主风机、辅助变压器、二次谐振电抗器等组成。"},{"序号":1271,"试题类型":"判断题","试题内容":"CR400BF型动车组牵引变流器采取主辅分离方案，牵引变流器与辅助变流器分别为独立个体。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CR400BF型动车组牵引变流器采取主辅分离方案，牵引变流器与辅助变流器分别为独立个体。"},{"序号":1272,"试题类型":"判断题","试题内容":"CR400BF型动车组牵引变流器冷却系统独立于牵引变流器。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CR400BF型动车组牵引变流器位于02、04、05、07车车下的设备舱内，其冷却系统独立于牵引变流器。"},{"序号":1273,"试题类型":"单选题","试题内容":"CR400BF型动车组牵引变流器的主要功能是为牵引电机的运行提供（）交流电源，由集成在牵引变流器箱体内的（）控制牵引变流器的工作状态。","A":"单相、TCU","B":"三相 function savePracticeSession() {
  if (!practiceQuestions.length) {
    hasPracticeSession = false;
    localStorage.removeItem(PRACTICE_SESSION_KEY);
    return;
  }
  const session = {
    questionIds: practiceQuestions.map(q => q['序号']),
    practiceIndex,
    practiceAnswers,
    pendingSelections,
    memorize: practiceMemorize,
    savedAt: Date.now()
  };
  localStorage.setItem(PRACTICE_SESSION_KEY, JSON.stringify(session));
  hasPracticeSession = true;
}

function loadPracticeSession() {
  try {
    const raw = localStorage.getItem(PRACTICE_SESSION_KEY);
    if (!raw) return false;
    const session = JSON.parse(raw);
    if (!session || !Array.isArray(session.questionIds) || !session.questionIds.length) return false;

    const idSet = new Set(session.questionIds.map(Number));
    const restored = session.questionIds
      .map(id => questions.find(q => Number(q['序号']) === Number(id)))
      .filter(Boolean);

    if (!restored.length) return false;

    // 题库变动时只恢复仍存在的题目，并尽量保持原顺序。
    practiceQuestions = restored;
    practiceIndex = Math.min(Math.max(Number(session.practiceIndex) || 0, 0), practiceQuestions.length - 1);
    practiceAnswers = session.practiceAnswers && typeof session.practiceAnswers === 'object' ? session.practiceAnswers : {};
    pendingSelections = session.pendingSelections && typeof session.pendingSelections === 'object' ? session.pendingSelections : {};
    practiceMemorize = !!session.memorize;

    // 若上一次练习已经完成，则不再作为“继续练习”。
    const unfinished = practiceQuestions.some(q => !practiceAnswers[q['序号']]);
    if (!unfinished) {
      localStorage.removeItem(PRACTICE_SESSION_KEY);
      hasPracticeSession = false;
      return false;
    }

    // 清理已经不属于本次会话的历史键。
    const validKeys = new Set(practiceQuestions.map(q => String(q['序号'])));
    practiceAnswers = Object.fromEntries(Object.entries(practiceAnswers).filter(([k]) => validKeys.has(String(k))));
    pendingSelections = Object.fromEntries(Object.entries(pendingSelections).filter(([k]) => validKeys.has(String(k))));
    hasPracticeSession = true;
    return true;
  } catch (e) {
    console.warn('恢复练习失败：', e);
    localStorage.removeItem(PRACTICE_SESSION_KEY);
    hasPracticeSession = false;
    return false;
  }
}

function clearPracticeSession() {
  practiceQuestions = [];
  practiceIndex = 0;
  practiceAnswers = {};
  pendingSelections = {};
  hasPracticeSession = false;
  localStorage.removeItem(PRACTICE_SESSION_KEY);
}

function continuePractice() {
  if (loadPracticeSession()) {
    showPage('practice');

    showToast('没有可继续的练习');
    renderOverview();
  }
}

function goToQuestion(id) {
  const idx = questions.findIndex(q => Number(q['序号']) === Number(id));
  if (idx >= 0) {
    // 从题目浏览进入某一道题时，建立一个新的“全部题目”练习会话。
    practiceQuestions = [...questions];
    practiceIndex = idx;
    practiceAnswers = {};
    pendingSelections = {};
    practiceMemorize = memorizePref;
    savePracticeSession();
    showPage('practice');
  }
}

// ===================== Practice Mode =====================
function startPractice(mode) {
  // 背题模式：总开关（memorizePref）或模式后缀 |mem / 'memorize'
  practiceMemorize = memorizePref || mode === 'memorize' || mode.endsWith('|mem');
  if (mode === 'memorize') mode = 'all';
  else if (mode.endsWith('|mem')) mode = mode.slice(0, -4);
  if (mode === 'wrong') {
    practiceQuestions = questions.filter(q => wrongAnswers.has(q['序号']));
    if (practiceQuestions.length === 0) {
      showToast('暂无错题，先去练习吧！');
      return;
    }
  } else if (mode === 'fav') {
    practiceQuestions = questions.filter(q => favorites.has(q['序号']));
    if (practiceQuestions.length === 0) {
      showToast('暂无收藏题目');
      return;
    }
  } else if (mode === 'single') {
    practiceQuestions = questions.filter(q => q['试题类型'] === '单选题');
  } else if (mode === 'judge') {
    practiceQuestions = questions.filter(q => q['试题类型'] === '判断题');
  } else if (mode === 'multi') {
    practiceQuestions = questions.filter(q => q['试题类型'] === '多选题');
  } else if (mode.startsWith('cat:')) {
    const cat = mode.slice(4);
    practiceQuestions = questions.filter(q => catOf(q) === cat);
    if (practiceQuestions.length === 0) {
      showToast('该分类暂无题目');
      return;
    }
  } else if (mode === 'random20') {
    practiceQuestions = shuffleArray([...questions]).slice(0, Math.min(20, questions.length));
  } else {
    practiceQuestions = [...questions];
  }

  if (settings.randomOrder && mode !== 'random20') {
    practiceQuestions = shuffleArray([...practiceQuestions]);
  }

  practiceIndex = 0;
  practiceAnswers = {};
  pendingSelections = {};
  savePracticeSession();

  showPage('practice');
}

function toggleMemorizePref() {
  memorizePref = !memorizePref;
  renderOverview();
  showToast(memorizePref ? '背题模式已开启：直接显示正确答案与解析' : '背题模式已关闭');
}

function renderPractice() {
  if (practiceQuestions.length === 0) {
    document.getElementById('contentArea').innerHTML = `
      <div class="empty-state fade-in">
        <div class="icon">📝</div>
        <h3>请选择练习模式</h3>
        <p>从概览页选择一种练习方式开始答题</p>
        <button class="btn btn-primary" style="margin-top:16px;" onclick="showPage('overview')">返回概览</button>
      </div>
    `;
    document.getElementById('topbarActions').innerHTML = '';
    return;
  }
  
  const q = practiceQuestions[practiceIndex];
  const total = practiceQuestions.length;
  const current = practiceIndex + 1;
  const key = q['序号'];
  const ans = practiceAnswers[key];
  const isFav = favorites.has(key);
  
  let optionsHtml = '';
  const type = q['试题类型'];
  const pendingSelected = pendingSelections[key] || '';

  if (type === '判断题') {
    const opts = ['A', 'B'];
    const labels = [q['A'], q['B']];
    optionsHtml = opts.map((opt, i) => {
      let cls = '';
      if (practiceMemorize) {
        cls = opt === q['正确选项'] ? 'correct disabled' : 'disabled';
      } else if (ans) {
        if (opt === q['正确选项']) cls = 'correct disabled';
        else if (ans.selected === opt) cls = 'wrong disabled';
        else cls = 'disabled';
      } else if (pendingSelected === opt) {
        cls = 'selected';
      }
      return `
        <div class="option-item ${cls}" onclick="selectOption('${opt}')">
          <span class="option-key">${opt}</span>
          <span class="option-text">${labels[i] || opt}</span>
        </div>
      `;
    }).join('');
  } else {
    const opts = ['A', 'B', 'C', 'D'].filter(o => q[o] !== null && q[o] !== undefined);
    optionsHtml = opts.map(opt => {
      let cls = '';
      if (practiceMemorize) {
        const memCorrect = q['正确选项'].split('');
        cls = memCorrect.includes(opt) ? 'correct disabled' : 'disabled';
      } else if (ans) {
        const correctOpts = q['正确选项'].split('');
        if (correctOpts.includes(opt)) cls = 'correct disabled';
        else if (ans.selected && ans.selected.includes(opt)) cls = 'wrong disabled';
        else cls = 'disabled';
      } else if (pendingSelected.includes(opt)) {
        cls = 'selected';
      }
      return `
        <div class="option-item ${cls}" onclick="selectOption('${opt}')">
          <span class="option-key">${opt}</span>
          <span class="option-text">${q[opt]}</span>
        </div>
      `;
    }).join('');
  }

  let analysisHtml = '';
  if (practiceMemorize) {
    analysisHtml = `
      <div class="analysis-section fade-in">
        <div class="answer-result correct">📖 背题模式 · 正确答案: ${q['正确选项']}</div>
        <h4>💡 解析</h4>
        <p>${q['试题解析'] || '暂无解析'}</p>
      </div>
    `;
  } else if (ans && settings.showAnalysis) {
    const correct = ans.correct;
    analysisHtml = `
      <div class="analysis-section fade-in">
        <div class="answer-result ${ans.revealed ? 'correct' : (correct ? 'correct' : 'wrong')}">
          ${ans.revealed ? '👀 已查看答案' : (correct ? '✅ 回答正确' : '❌ 回答错误')}
          <span style="color:var(--gray-500);font-weight:400;font-size:13px;margin-left:8px;">正确答案: ${q['正确选项']}</span>
        </div>
        <h4>💡 解析</h4>
        <p>${q['试题解析'] || '暂无解析'}</p>
      </div>
    `;
  }
  
  document.getElementById('contentArea').innerHTML = `
    <div class="practice-container fade-in">
      <div class="practice-progress">
        <span style="font-size:13px;color:var(--gray-500);font-weight:600;">${current}/${total}</span>
        <div class="practice-progress-bar">
          <div class="practice-progress-fill" style="width:${current/total*100}%"></div>
        </div>
        <div class="practice-stats">
          <span>✅ <span id="practiceCorrect">0</span></span>
          <span>❌ <span id="practiceWrong">0</span></span>
        </div>
      </div>
      
      <div class="question-card">
        <div class="question-header">
          <span class="question-number">第 ${q['序号']} 题</span>
          <span class="question-type ${type === '单选题' ? 'type-single' : type === '判断题' ? 'type-judge' : 'type-multi'}">${type}</span>
          ${catBadge(q)}
          ${practiceMemorize ? '<span class="question-cat" style="color:#7c3aed;background:#7c3aed1a;border:1px solid #7c3aed33">📖 背题模式</span>' : ''}
          <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite(${key})" title="收藏">★</button>
        </div>
        <div class="question-content">${q['试题内容']}</div>
        <div class="options-list" id="optionsList">
          ${optionsHtml}
        </div>
        ${analysisHtml}
      </div>
      
      <div class="practice-nav">
        <button class="btn btn-secondary nav-prev" onclick="prevQuestion()" ${practiceIndex === 0 ? 'disabled style="opacity:0.4"' : ''}>← 上一题</button>
        <div class="nav-actions">
          ${practiceMemorize ? `
            <button class="btn btn-primary" onclick="nextQuestion()">${practiceIndex === total - 1 ? '完成背题' : '下一题 →'}</button>
          ` : !ans ? `
            <button class="btn btn-secondary" onclick="showAnswer()">查看答案</button>
            ${type === '多选题' ? `<button class="btn btn-primary" onclick="submitAnswer()">提交答案</button>` : ''}
          ` : `
            <button class="btn btn-primary" onclick="nextQuestion()">${practiceIndex === total - 1 ? '完成练习' : '下一题 →'}</button>
          `}
        </div>
      </div>
    </div>
  `;
  
  updatePracticeStats();
  
  savePracticeSession();

  document.getElementById('topbarActions').innerHTML = `
    <button class="btn btn-ghost" onclick="showPage('overview')">退出练习</button>
  `;
}

function selectOption(opt) {
  const q = practiceQuestions[practiceIndex];
  const key = q['序号'];
  if (practiceAnswers[key] || practiceMemorize) return;

  const type = q['试题类型'];
  let selected = pendingSelections[key] || '';

  if (type === '多选题') {
    const opts = selected.split('').filter(Boolean);
    if (opts.includes(opt)) {
      selected = opts.filter(o => o !== opt).sort().join('');
    } else {
      selected = [...opts, opt].sort().join('');
    }
  } else {
    // 单选题、判断题：每次只能保留一个选项
    selected = opt;
  }

  pendingSelections[key] = selected;
  savePracticeSession();

  // 这里只更新选项的选中样式，不重新渲染整个题目页面。
  // 原来的 renderPractice() 会导致 contentArea.innerHTML 整体重建，
  // 浏览器在选择选项时容易出现明显的页面闪烁。
  const optionsList = document.getElementById('optionsList');
  if (optionsList) {
    optionsList.querySelectorAll('.option-item').forEach(item => {
      const optionKey = item.querySelector('.option-key')?.textContent.trim();
      item.classList.toggle('selected', selected.includes(optionKey));
    });
  }

  // 单选题、判断题：选中即直接判定正误，无需手动提交
  if (type !== '多选题') {
    submitAnswer();
  }
}

function submitAnswer() {
  const q = practiceQuestions[practiceIndex];
  const key = q['序号'];
  const type = q['试题类型'];

  // 只要本次练习还没有提交，就允许重新作答，即使历史上做过这道题
  if (practiceAnswers[key] || practiceMemorize) return;

  const selected = pendingSelections[key] || '';
  if (!selected) {
    showToast('请先选择答案后再提交');
    return;
  }

  const correctAnswer = q['正确选项'];
  const isCorrect = selected === correctAnswer;
  const result = { selected, correct: isCorrect, time: Date.now() };

  // 1) 保存本次练习结果：供当前练习页面显示正误
  practiceAnswers[key] = result;

  // 2) 更新历史记录：供概览、历史统计等使用
  answered[key] = result;
  localStorage.setItem('answered', JSON.stringify(answered));

  delete pendingSelections[key];

  if (!isCorrect) {
    wrongAnswers.add(key);
  } else {
    wrongAnswers.delete(key);
  }
  localStorage.setItem('wrongAnswers', JSON.stringify([...wrongAnswers]));

  updateBadges();
  savePracticeSession();
  renderPractice();

  // 单选题、判断题：答对直接跳转下一题；答错留在本题查看正确答案与解析
  const isSingleLike = type === '单选题' || type === '判断题';
  if (isSingleLike) {
    if (isCorrect) {
      if (practiceIndex < practiceQuestions.length - 1) {
        showToast('✅ 回答正确，进入下一题');
      }
      nextQuestion();
    } else {
      showToast('❌ 回答错误，正确答案已标出');
    }
  } else if (settings.autoNext && isCorrect && practiceIndex < practiceQuestions.length - 1) {
    setTimeout(() => nextQuestion(), 800);
  }
}

function showAnswer() {
  const q = practiceQuestions[practiceIndex];
  const key = q['序号'];

  if (!practiceAnswers[key]) {
    // “查看答案”只结束当前题的本次练习状态，不覆盖历史答题记录，
    // 也不自动把题目加入错题本。
    practiceAnswers[key] = {
      selected: '',
      correct: false,
      revealed: true,
      time: Date.now()
    };
    delete pendingSelections[key];
    savePracticeSession();
  }

  renderPractice();
}

function prevQuestion() {
  if (practiceIndex > 0) {
    practiceIndex--;
    savePracticeSession();
    renderPractice();
  }
}

function nextQuestion() {
  if (practiceIndex < practiceQuestions.length - 1) {
    practiceIndex++;
    savePracticeSession();
    renderPractice();
  } else {
    clearPracticeSession();
    showPage('overview');
    showToast(practiceMemorize ? '背题完成！' : '练习完成！');
  }
}

function updatePracticeStats() {
  const keys = practiceQuestions.map(q => q['序号']);
  let correct = 0, wrong = 0;
  keys.forEach(k => {
    const result = practiceAnswers[k];
    if (result && !result.revealed) {
      if (result.correct) correct++;
      else wrong++;
    }
  });
  const elC = document.getElementById('practiceCorrect');
  const elW = document.getElementById('practiceWrong');
  if (elC) elC.textContent = correct;
  if (elW) elW.textContent = wrong;
}

function toggleSetting(key) {
  settings[key] = !settings[key];
  localStorage.setItem('settings', JSON.stringify(settings));
  renderSettings();
}

function clearData(type) {
  if (!confirm('确定要清除吗？此操作不可恢复。')) return;
  
  if (type === 'answered' || type === 'all') {
    answered = {};
    localStorage.setItem('answered', '{}');
  }
  if (type === 'favorites' || type === 'all') {
    favorites = new Set();
    localStorage.setItem('favorites', '[]');
  }
  if (type === 'wrong' || type === 'all') {
    wrongAnswers = new Set();
    localStorage.setItem('wrongAnswers', '[]');
  }
  if (type === 'all') {
    settings = { showAnalysis: true, randomOrder: false, autoNext: false, filterType: 'all' };
    localStorage.setItem('settings', JSON.stringify(settings));
    clearPracticeSession();
  }
  
  updateBadges();
  showToast('已清除');
  renderSettings();
}

// ===================== Utilities =====================
function toggleFavorite(id) {
  if (favorites.has(id)) {
    favorites.delete(id);
    showToast('已取消收藏');
  } else {
    favorites.add(id);
    showToast('已收藏');
  }
  localStorage.setItem('favorites', JSON.stringify([...favorites]));
  updateBadges();
  
  if (currentPage === 'practice') {
    renderPractice();
  }
}

function updateBadges() {
  document.getElementById('favBadge').textContent = favorites.size;
  document.getElementById('wrongBadge').textContent = wrongAnswers.size;
}

function showToast(msg) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(10px)';
    setTimeout(() => toast.remove(), 300);
  }, 2000);
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
