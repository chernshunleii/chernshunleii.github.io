<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电气题库练习系统</title>
<style>
:root {
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --primary-light: #dbeafe;
  --success: #16a34a;
  --success-light: #dcfce7;
  --danger: #dc2626;
  --danger-light: #fee2e2;
  --warning: #ca8a04;
  --warning-light: #fef9c3;
  --gray-50: #f9fafb;
  --gray-100: #f3f4f6;
  --gray-200: #e5e7eb;
  --gray-300: #d1d5db;
  --gray-400: #9ca3af;
  --gray-500: #6b7280;
  --gray-600: #4b5563;
  --gray-700: #374151;
  --gray-800: #1f2937;
  --gray-900: #111827;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --radius: 12px;
  --radius-sm: 8px;
  --transition: all 0.2s ease;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
  background: var(--gray-50);
  color: var(--gray-800);
  line-height: 1.6;
  min-height: 100vh;
}
.app { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar {
  width: 260px;
  background: #fff;
  border-right: 1px solid var(--gray-200);
  display: flex;
  flex-direction: column;
  position: fixed;
  height: 100vh;
  z-index: 100;
  transition: transform 0.3s ease;
}
.sidebar-header {
  padding: 24px 20px;
  border-bottom: 1px solid var(--gray-200);
}
.sidebar-header h1 {
  font-size: 18px;
  font-weight: 700;
  color: var(--gray-900);
  display: flex;
  align-items: center;
  gap: 10px;
}
.sidebar-header .icon {
  width: 36px; height: 36px;
  background: var(--primary);
  color: white;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
.sidebar-header p {
  font-size: 12px;
  color: var(--gray-400);
  margin-top: 4px;
  padding-left: 46px;
}
.nav-menu { padding: 12px 0; flex: 1; overflow-y: auto; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  margin: 2px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
  color: var(--gray-600);
  font-size: 14px;
  font-weight: 500;
  border: none;
  background: none;
  width: calc(100% - 24px);
  text-align: left;
}
.nav-item:hover { background: var(--gray-100); color: var(--gray-800); }
.nav-item.active { background: var(--primary-light); color: var(--primary); }
.nav-item .nav-icon { font-size: 18px; width: 24px; text-align: center; }
.nav-badge {
  margin-left: auto;
  background: var(--gray-200);
  color: var(--gray-500);
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 20px;
  font-weight: 600;
}
.nav-item.active .nav-badge { background: var(--primary); color: white; }
.sidebar-footer {
  padding: 16px 20px;
  border-top: 1px solid var(--gray-200);
  font-size: 12px;
  color: var(--gray-400);
  text-align: center;
}

/* Main Content */
.main {
  flex: 1;
  margin-left: 260px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.topbar {
  background: #fff;
  border-bottom: 1px solid var(--gray-200);
  padding: 16px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
}
.topbar h2 { font-size: 20px; font-weight: 700; color: var(--gray-900); }
.topbar-actions { display: flex; gap: 12px; align-items: center; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  border: 1px solid transparent;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-secondary { background: var(--gray-100); color: var(--gray-700); border-color: var(--gray-200); }
.btn-secondary:hover { background: var(--gray-200); }
.btn-success { background: var(--success); color: white; }
.btn-danger { background: var(--danger); color: white; }
.btn-ghost { background: transparent; color: var(--gray-500); }
.btn-ghost:hover { background: var(--gray-100); }
.btn-sm { padding: 6px 12px; font-size: 13px; }

.content { padding: 24px 32px; flex: 1; }

/* Loading */
.loading-screen {
  position: fixed;
  inset: 0;
  background: var(--gray-50);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  gap: 20px;
}
.spinner {
  width: 48px; height: 48px;
  border: 3px solid var(--gray-200);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-screen p { color: var(--gray-500); font-size: 14px; }

/* Stats Cards */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 24px;
}
.stat-card {
  background: #fff;
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow);
  border: 1px solid var(--gray-200);
}
.stat-card .stat-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  margin-bottom: 12px;
}
.stat-card .stat-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--gray-900);
  line-height: 1.2;
}
.stat-card .stat-label {
  font-size: 13px;
  color: var(--gray-500);
  margin-top: 4px;
}
.stat-card.blue .stat-icon { background: var(--primary-light); }
.stat-card.green .stat-icon { background: var(--success-light); }
.stat-card.yellow .stat-icon { background: var(--warning-light); }
.stat-card.red .stat-icon { background: var(--danger-light); }

/* Progress Section */
.progress-section {
  background: #fff;
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow);
  border: 1px solid var(--gray-200);
  margin-bottom: 24px;
}
.progress-section h3 {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 16px;
  color: var(--gray-800);
}
.progress-bar-container {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}
.progress-bar-container span {
  font-size: 13px;
  color: var(--gray-500);
  width: 60px;
  text-align: right;
}
.progress-bar-bg {
  flex: 1;
  height: 10px;
  background: var(--gray-100);
  border-radius: 5px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  border-radius: 5px;
  transition: width 0.5s ease;
}
.progress-bar-fill.blue { background: var(--primary); }
.progress-bar-fill.green { background: var(--success); }
.progress-bar-fill.yellow { background: var(--warning); }
.progress-bar-fill.red { background: var(--danger); }

/* Search & Filter Bar */
.filter-bar {
  background: #fff;
  border-radius: var(--radius);
  padding: 16px 20px;
  box-shadow: var(--shadow);
  border: 1px solid var(--gray-200);
  margin-bottom: 20px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}
.search-input {
  flex: 1;
  min-width: 200px;
  padding: 10px 14px;
  border: 1px solid var(--gray-200);
  border-radius: var(--radius-sm);
  font-size: 14px;
  outline: none;
  transition: var(--transition);
}
.search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.filter-select {
  padding: 10px 14px;
  border: 1px solid var(--gray-200);
  border-radius: var(--radius-sm);
  font-size: 14px;
  outline: none;
  background: #fff;
  cursor: pointer;
}

/* Question Card */
.question-card {
  background: #fff;
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow);
  border: 1px solid var(--gray-200);
  margin-bottom: 16px;
  transition: var(--transition);
}
.question-card:hover { box-shadow: var(--shadow-md); }
.question-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.question-number {
  background: var(--primary-light);
  color: var(--primary);
  font-size: 12px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 20px;
}
.question-type {
  font-size: 12px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
}
.type-single { background: #e0f2fe; color: #0369a1; }
.type-judge { background: #f3e8ff; color: #7c3aed; }
.type-multi { background: #fef3c7; color: #b45309; }
.question-cat {
  font-size: 12px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  white-space: nowrap;
}
.question-content {
  font-size: 16px;
  font-weight: 500;
  color: var(--gray-800);
  margin-bottom: 16px;
  line-height: 1.7;
}
.options-list { display: flex; flex-direction: column; gap: 10px; }
.option-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  border: 2px solid var(--gray-200);
  cursor: pointer;
  transition: var(--transition);
  font-size: 14px;
}
.option-item:hover { border-color: var(--primary); background: var(--primary-light); }
.option-item.selected { border-color: var(--primary); background: var(--primary-light); }
.option-item.correct { border-color: var(--success); background: var(--success-light); }
.option-item.wrong { border-color: var(--danger); background: var(--danger-light); }
.option-item.disabled { cursor: default; pointer-events: none; }
.option-key {
  width: 28px; height: 28px;
  min-width: 28px;
  border-radius: 50%;
  background: var(--gray-100);
  color: var(--gray-600);
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}
.option-item.selected .option-key { background: var(--primary); color: white; }
.option-item.correct .option-key { background: var(--success); color: white; }
.option-item.wrong .option-key { background: var(--danger); color: white; }
.option-text { flex: 1; padding-top: 3px; }

/* Analysis Section */
.analysis-section {
  margin-top: 20px;
  padding: 16px;
  background: var(--gray-50);
  border-radius: var(--radius-sm);
  border-left: 4px solid var(--primary);
}
.analysis-section h4 {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary);
  margin-bottom: 8px;
}
.analysis-section p {
  font-size: 14px;
  color: var(--gray-600);
  line-height: 1.7;
}
.answer-result {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  font-size: 15px;
  font-weight: 600;
}
.answer-result.correct { color: var(--success); }
.answer-result.wrong { color: var(--danger); }

/* Practice Mode */
.practice-container {
  max-width: 800px;
  margin: 0 auto;
}
.practice-progress {
  background: #fff;
  border-radius: var(--radius);
  padding: 16px 20px;
  box-shadow: var(--shadow);
  border: 1px solid var(--gray-200);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.practice-progress-bar {
  flex: 1;
  height: 8px;
  background: var(--gray-100);
  border-radius: 4px;
  margin: 0 16px;
  overflow: hidden;
}
.practice-progress-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 4px;
  transition: width 0.3s ease;
}
.practice-stats {
  display: flex;
  gap: 16px;
  font-size: 13px;
  color: var(--gray-500);
}
.practice-stats span { font-weight: 600; color: var(--gray-700); }

.practice-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 20px;
}
.practice-nav .nav-prev {
  min-width: 110px;
  justify-content: center;
}
.practice-nav .nav-actions {
  display: flex;
  gap: 8px;
  margin-left: auto;
}
.practice-nav .nav-actions .btn {
  min-width: 110px;
  justify-content: center;
}

/* Question List */
.question-list-item {
  background: #fff;
  border-radius: var(--radius);
  padding: 16px 20px;
  box-shadow: var(--shadow);
  border: 1px solid var(--gray-200);
  margin-bottom: 12px;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: flex-start;
  gap: 14px;
}
.question-list-item:hover { box-shadow: var(--shadow-md); border-color: var(--primary); }
.question-list-num {
  width: 36px; height: 36px;
  min-width: 36px;
  background: var(--gray-100);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  color: var(--gray-600);
}
.question-list-body { flex: 1; }
.question-list-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--gray-800);
  margin-bottom: 8px;
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.question-list-meta {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

/* Pagination */
.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-top: 24px;
  padding: 16px;
}
.page-btn {
  min-width: 36px;
  height: 36px;
  padding: 0 10px;
  border: 1px solid var(--gray-200);
  background: #fff;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  color: var(--gray-600);
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
}
.page-btn:hover { background: var(--gray-100); }
.page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Favorites */
.fav-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 20px;
  color: var(--gray-300);
  transition: var(--transition);
  padding: 4px;
}
.fav-btn:hover { color: var(--warning); }
.fav-btn.active { color: var(--warning); }

/* Settings Panel */
.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 0;
  border-bottom: 1px solid var(--gray-100);
}
.settings-row:last-child { border-bottom: none; }
.settings-label { font-size: 14px; font-weight: 500; color: var(--gray-700); }
.settings-desc { font-size: 12px; color: var(--gray-400); margin-top: 2px; }

/* Toggle Switch */
.toggle {
  position: relative;
  width: 44px;
  height: 24px;
  background: var(--gray-300);
  border-radius: 12px;
  cursor: pointer;
  transition: var(--transition);
}
.toggle.active { background: var(--primary); }
.toggle::after {
  content: "";
  position: absolute;
  width: 20px; height: 20px;
  background: #fff;
  border-radius: 50%;
  top: 2px;
  left: 2px;
  transition: var(--transition);
  box-shadow: var(--shadow-sm);
}
.toggle.active::after { left: 22px; }

/* Mobile Menu */
.mobile-menu-btn {
  display: none;
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: var(--gray-600);
}
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 99;
}

/* Empty State */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--gray-400);
}
.empty-state .icon { font-size: 48px; margin-bottom: 16px; }
.empty-state h3 { font-size: 16px; color: var(--gray-600); margin-bottom: 8px; }
.empty-state p { font-size: 14px; }

/* Toast */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.toast {
  background: var(--gray-800);
  color: white;
  padding: 12px 20px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  box-shadow: var(--shadow-lg);
  animation: toastIn 0.3s ease;
  max-width: 320px;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Responsive */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .mobile-menu-btn { display: block; }
  .sidebar-overlay.open { display: block; }
  .content { padding: 16px; }
  .topbar { padding: 12px 16px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .filter-bar { flex-direction: column; align-items: stretch; }
  .practice-nav { flex-wrap: wrap; gap: 8px; }
  .practice-nav .nav-actions { display: contents; }
  .practice-nav .btn { flex: 1 1 0; min-width: 0; justify-content: center; padding: 8px 6px; }
}

/* Animations */
.fade-in { animation: fadeIn 0.3s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Tag */
.tag {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
}
.tag-outline {
  background: transparent;
  border: 1px solid var(--gray-200);
  color: var(--gray-500);
}

/* Status indicators */
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.status-correct { background: var(--success); }
.status-wrong { background: var(--danger); }
.status-unanswered { background: var(--gray-300); }

/* Question grid for overview */
.question-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
  gap: 6px;
  margin-top: 16px;
}

/* Browse question grid */
.browse-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
  gap: 8px;
  margin-top: 16px;
}
.browse-grid .grid-cell { min-height: 44px; }
.browse-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 14px;
  font-size: 13px;
  color: var(--gray-500);
}
.browse-legend-item { display: inline-flex; align-items: center; gap: 6px; }
.browse-legend-dot {
  width: 12px; height: 12px; border-radius: 4px;
  border: 1px solid var(--gray-200);
  background: #fff;
}
.browse-legend-dot.correct { background: var(--success-light); border-color: var(--success); }
.browse-legend-dot.wrong { background: var(--danger-light); border-color: var(--danger); }
.browse-legend-dot.unanswered { background: #fff; border-color: var(--gray-300); }
.grid-cell {
  aspect-ratio: 1;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  border: 1px solid var(--gray-200);
  background: #fff;
  color: var(--gray-500);
}
.grid-cell:hover { transform: scale(1.1); box-shadow: var(--shadow); }
.grid-cell.correct { background: var(--success-light); border-color: var(--success); color: var(--success); }
.grid-cell.wrong { background: var(--danger-light); border-color: var(--danger); color: var(--danger); }
.grid-cell.current { background: var(--primary); border-color: var(--primary); color: white; }
.grid-cell.fav { position: relative; }
.grid-cell.fav::after {
  content: "★";
  position: absolute;
  top: 1px;
  right: 2px;
  font-size: 8px;
  color: var(--warning);
}
</style>
</head>
<body>
<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <p>正在加载题库数据...</p>
</div>

<div class="app" id="app" style="display:none;">
  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1><span class="icon">⚡</span>电气题库</h1>
      <p>共 <span id="totalCount">0</span> 道题目</p>
    </div>
    <div class="nav-menu">
      <button class="nav-item active" data-page="overview" onclick="showPage('overview')">
        <span class="nav-icon">📊</span> 概览

原理图中，接触器的主触头通常画在（）。","A":"  主电路中","B":"  控制电路中","C":" 信号电路中","D":" 照明电路中","正确选项":"A","试题解析":"在电气原理图中,同一电器的不同部件常常不画在一起,而是画在电路的不同地方，例如接触器的主触头通常画在主电路中，而吸引线圈和辅助触头则画在控制电路中,但它们都用KM表示 。"},{"序号":12,"试题类型":"单选题","试题内容":"电路图中的所有电气元件的可动部分通常表示在电器（）和位置。","A":"激励状态","B":" 工作状态","C":" 非激励或不工作状态","D":" 任意状态","正确选项":"C","试题解析":"电路图中的所有电气元件的可动部分通常表示在电器非激励或不工作的状态和位置。如继电器、接触器、制动器等的线圈处在非激励状态；机械控制的行程开关和按钮在其未受机械压合的状态。"},{"序号":13,"试题类型":"单选题","试题内容":"中国标准动车组车上直流110V电源主要来自于（）。","A":"发电机","B":" 充电机","C":"蓄电池或充电机","D":"外部电源","正确选项":"C","试题解析":"在中国标准动车组中，车上直流110V电源来自于蓄电池或充电机，在无高压电时由蓄电池供给车上的一些直流设备，在有高压电时由充电机通过 BatK1，BatK2 分别给车上的贯穿线103,115 线供直流 110V 电源。"},{"序号":14,"试题类型":"单选题","试题内容":"数字信号的特征是（）。","A":"大小和方向连续变化","B":"大小连续变化，方向间断变化","C":"大小和方向间断变化","D":" 大小间断变化，方向连续变化","正确选项":"C","试题解析":"数字信号：大小和方向随时间间断变化，即离散信号，也叫脉冲信号。"},{"序号":15,"试题类型":"单选题","试题内容":"电动机的通路属于（）电路。","A":"控制电路","B":"信号电路","C":"主电路","D":" 照明电路","正确选项":"C","试题解析":"电动机的通路为主电路，接触器吸引线圈的通路为控制电路。此外还有信号电路、照明电路等。"},{"序号":16,"试题类型":"多选题","试题内容":"晶闸管的常见封装外形有（）。","A":"螺栓型","B":"平板型","C":"塑封型","D":"螺旋型","正确选项":"ABC","试题解析":"晶闸管具有体积小、重量轻、损耗小、控制特性好等优点，曾经在许多领域中得到了广泛的应用。常见封装外形有螺栓型、平板型、塑封型；"},{"序号":17,"试题类型":"多选题","试题内容":"电力晶体管是一种耐（）的双极结型晶体管。","A":"高电压","B":"大电流","C":"低电压","D":"小电流","正确选项":"AB","试题解析":"电力晶体管（Giant Transistor——GTR）按英文直译为巨型晶体管，是一种耐高电压、大电流的双极结型晶体管。"},{"序号":18,"试题类型":"多选题","试题内容":"电力场效应晶体管分为（），但通常主要指绝缘栅型中的MOS型,简称电力MOSFET。","A":"双极性","B":"结型","C":"绝缘栅型","D":"单极性","正确选项":"BC","试题解析":"电力场效应晶体管分为结型和绝缘栅型，但通常主要指绝缘栅型中的MOS型,简称电力MOSFET。"},{"序号":19,"试题类型":"多选题","试题内容":"绝缘栅双极晶体管（IGBT）结合了（）器件的优点。","A":"GTR","B":"MOSFET","C":"二极管","D":"单极管","正确选项":"AB","试题解析":"绝缘栅双极晶体管（Insulated-gate Bipolar Transistor——IGBT或IGT）综合了GTR和MOSFET的优点，因而具有良好的特性。"},{"序号":20,"试题类型":"多选题","试题内容":"控制和保护装置：用来控制电路的通断，保护电路的安全，使电路能正常工作，如（）等。","A":"开关","B":" 保险丝","C":" 继电器","D":"干电池","正确选项":"ABC","试题解析":"控制和保护装置：用来控制电路的通断，保护电路的安全，使电路能正常工作，如开关、保险丝（熔断器）、继电器等。"},{"序号":21,"试题类型":"多选题","试题内容":"电源：向电路提供能量的设备。它能把其它形式的能转换成电能。常见的电源有（）。","A":"干电池","B":"发电机","C":"蓄电池","D":"内燃机","正确选项":"ABC" CRH2型前端自动车钩包括：半永久式车钩及缓冲器","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CRH2型前端自动车钩包括：密接式车钩及缓冲器。"},{"序号":200,"试题类型":"单选题","试题内容":"CRH2动车组上装用双向（）型橡胶缓冲器。","A":"Z","B":"W","C":"X","D":"H","正确选项":"B","试题解析":"CRH2动车组上装用双向W型橡胶缓冲器，该型号缓冲器为目前较为独有的初压力为零的橡胶缓冲器。"},{"序号":201,"试题类型":"判断题","试题内容":"双向W型橡胶缓冲器的初压力为零。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"双向W型缓冲器为目前较为独有的初压力为零的橡胶缓冲器。"},{"序号":202,"试题类型":"单选题","试题内容":"下列不是CRH2动车组车辆间风挡类别的是（）。","A":"压缩式外风挡","B":"气密式内风挡","C":"防雪风档","D":"防水风档","正确选项":"D","试题解析":"CRH2动车组两车辆间共有三类风挡，分别为：压缩式外风挡、气密式内风挡和防雪风档。"},{"序号":203,"试题类型":"单选题","试题内容":"防雪风挡安装在（）的下方。","A":"中间车钩","B":"头车车钩","C":"侧墙","D":"内端墙","正确选项":"A","试题解析":"压缩式外风挡、气密式内风挡等均安装在车体的外端墙上，防雪风挡则安装在中间车钩的下方。"},{"序号":204,"试题类型":"判断题","试题内容":"CRH3动车组采用的是夏芬伯格系列车钩。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CRH3动车组采用的是夏芬伯格系列车钩。"},{"序号":205,"试题类型":"多选题","试题内容":"CRH3型动车组的全自动车钩主要由（）、连接卡环、接地线等零部件组成。","A":"机械钩头","B":"电气车钩","C":"风管接头","D":"钩身","正确选项":"ABCD","试题解析":"CRH3型全自动车钩主要由机械钩头、电气车钩、风管接头、钩身、连接卡环、接地线等零部件组成。"},{"序号":206,"试题类型":"单选题","试题内容":"（）不是CRH3型动车组的全自动车钩的状态。","A":"待挂","B":"闭锁","C":"解钩","D":"压缩","正确选项":"D","试题解析":"CRH3型动车组全自动车钩有待挂、闭锁、解钩三种状态。"},{"序号":207,"试题类型":"多选题","试题内容":"CRH3型动车组的半永久性车钩由（）、联结卡环、接地线等零部件组成。","A":"风管接头","B":"牵引杆","C":"轴承座","D":"电器车钩","正确选项":"ABC","试题解析":"CRH3型动车组的半永久性车钩。它由风管接头、牵引杆、轴承座、联结卡环、接地线等零部件组成。"},{"序号":208,"试题类型":"判断题","试题内容":"CRH3动车组压缩空气连接部分有三类。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CRH3动车组有两类压缩空气连接部分，即自动车钩压缩空气连接和半永久车钩压缩空气连接。"},{"序号":209,"试题类型":"单选题","试题内容":"CRH3型动车组及各相邻车辆之间的压缩空气连接不包含（）。","A":"列车管空气管路的连接","B":"总风管空气管路连接","C":"车钩解钩空气管路连接","D":"液压管路连接","正确选项":"D","试题解析":"CRH3型动车组及各相邻车辆之间的压缩空气连接又可分为：列车管空气管路的连接、总风管空气管路连接和车钩解钩空气管路连接。"},{"序号":210,"试题类型":"判断题","试题内容":"CRH5型动车组的风挡采用的是滑动式风挡。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CRH5型动车组的风挡采用的是双层折棚式风挡。"},{"序号":211,"试题类型":"单选题","试题内容":"双层折棚式风挡不具有良好的（）。","A":"伸缩性","B":"气密性","C":"水密性","D":"导电性","正确选项":"D","试题解析":"双层折棚式风挡具有良好的伸缩性、气密性和水密性。"},{"序号":212,"试题类型":"判断题","试题内容":"CR400AF型动车组前端车钩缓冲装置采用10型钩头，不带电气连接器。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CR400AF型动车组前端车钩缓冲装置采用 10型钩头，带电气连接器。"},{"序号":213,"试题类型":"单选题","试题内容":"CR400BF型动车组前端车钩的电气连接器不可实现（）的自动或手动连接和分解。","A":"机械","B":"气路","C":"电路","D":"外接电源","正确选项":"D","试题解析":"CR400BF型动车组前端车钩缓冲装置采用 10型钩头，带电气连接器，可以实现机械、气路和电路的自动或手动连接和分解。"},{"序号":214,"试题类型":"单选题","试题内容":"CR400AF型动车组前端车钩缓冲装置采用大容量（）和后置压溃管，可以吸收动车组在正常运行和连挂过程中产生能量的功能和吸收多余冲击能量。","A":"气液缓冲器","B":"油压减振器","C":"合金垫","D":"弹性胶泥","正确选项":"A","试题解析":"CR400AF型动车组前端车钩缓冲装置采用大容量气液缓冲器和后置压溃管，可以吸收动车组在正常运行和连挂过程中产生能量的功能和吸收多余冲击能量。"},{"序号":215,"试题类型":"多选题","试题内容":"CR400AF型动车组前端车钩缓冲装置主要由（）和连接卡环构成。","A":"连挂系统","B":"缓冲系统","C":"安装吊挂系统","D":"过渡车钩","正确选项":"ABC","试题解析":"CR400AF型动车组前端车钩缓冲装置主要由连挂系统、缓冲系统、安装吊挂系统和连接卡环构成。"},{"序号":216,"试题类型":"判断题","试题内容":"车钩缓冲系统采用大容量气液缓冲器、环簧和橡胶轴承，拉伸方向的缓冲通过液压缓冲器和橡胶轴承来实现。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"车钩缓冲系统采用大容量气液缓冲器、环簧和橡胶轴承，拉伸方向的缓冲通过环簧和橡胶轴承来实现，压缩方向的缓冲通过气液缓冲器和橡胶轴承来实现，可以满足高速连挂时的能量吸收功能。"},{"序号":217,"试题类型":"单选题","试题内容":"双包折棚风挡不具有良好的（）。","A":"密封性能","B":"耐压强度","C":"隔声性能","D":"膨胀性能","正确选项":"D","试题解析":"双包折棚风挡具有良好的密封性能、耐压强度和隔声性能。"},{"序号":218,"试题类型":"单选题","试题内容":"全波纹气密式风挡不具有良好的（）。","A":"伸缩性","B":"气密性","C":"水密性","D":"导电性","正确选项":"D","试题解析":"全波纹气密式风挡具有良好的伸缩性、气密性和水密性。"},{"序号":219,"试题类型":"多选题","试题内容":"全波纹气密式风挡由（）等组成。","A":"金属框","B":"安装框（金属）","C":"全波纹密封件","D":"外罩","正确选项":"ABCD","试题解析":"全波纹气密式风挡由金属框、安装框（金属）、全波纹密封件和外罩等组成。"},{"序号":220,"试题类型":"多选题","试题内容":"CR400AF内风挡采用一体式双包结构，主要包括（）等。","A":"双包折棚组成","B":"过渡板","C":"渡板","D":"踏板","正确选项":"ABCD","试题解析":"CR400AF内风挡采用一体式双包结构，主要包括双包折棚组成、过渡板、渡板和踏板等双包折棚组成由内外折棚以及两个铰接框组成。"},{"序号":221,"试题类型":"判断题","试题内容":"CR400AF内风挡渡板采用镶嵌式,插入到车体端墙内，通过钛合金螺栓固定在两车的车端。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CR400AF内风挡渡板采用镶嵌式,插入到车体端墙内，通过渡板支架的滑动支撑固定在两车的车端。两侧踏板一侧通过螺钉固定在车体底架上，一侧搭在渡板上，使地板与踏板平顺。"},{"序号":222,"试题类型":"单选题","试题内容":"CR400AF动车组外风挡采用分体式结构，由橡胶囊和（）型材组成。","A":"不锈钢","B":"铝合金","C":"复合材料","D":"碳纤维","正确选项":"B","试题解析":"CR400AF动车组外风挡采用分体式结构，由橡胶囊和铝合金型材组成，在车间减振器位置断开，预留出车间减振器安装和检修操作空间。"},{"序号":223,"试题类型":"判断题","试题内容":"CR400BF动车组车端减振器具有防止摇头和侧滚振动的作用。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CR400BF动车组车端减振器的作用具有防止摇头和侧滚振动的作用。"},{"序号":224,"试题类型":"判断题","试题内容":"排障器是安装在中间车前端轨道上方，排除运营前方轨道上小型、低矮障碍物的装置。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"排障器是安装在头车前端轨道上方，排除运营前方轨道上小型、低矮障碍物的装置。主要由排障板和缓冲板两部分组成，高度不能太低。"},{"序号":225,"试题类型":"多选题","试题内容":"排障装置主要由（）等部件构成。","A":"排障板","B":"缓冲板组成","C":"缓冲板支撑","D":"排障橡胶","正确选项":"ABCD","试题解析":"以某动车组排障装置为例，排障装置主要由排障板、缓冲板组成、缓冲板支撑及排障橡胶等部件构成。"},{"序号":226,"试题类型":"单选题","试题内容":"缓冲板组成主要用来吸收碰撞能量，采用（）结构。","A":"铝板层叠","B":"单层铝板","C":"不锈钢","D":"多层碳纤维","正确选项":"A","试题解析":"缓冲板组成主要用来吸收碰撞能量，采用铝板层叠结构。"},{"序号":227,"试题类型":"判断题","试题内容":"CR400BF排障器由型材、 铜板及连接螺栓组成，通过支架固定在司机室的下方。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CR400BF排障器由型材、 铝板及连接螺栓组成，通过螺栓固定在司机室的下方。"},{"序号":228,"试题类型":"单选题","试题内容":"CR400BF排障器导流罩为整套部件，即单个金属零部件（衬套、插入嵌件和螺栓）粘在玻璃 钢部件上，导流罩分为两个前部导流罩和两个后部导流罩，共（）部分。","A":2,"B":4,"C":6,"D":8,"正确选项":"B","试题解析":"CR400BF排障器导流罩为整套部件，即单个金属零部件（衬套、插入嵌件和螺栓）粘在玻璃 钢部件上，导流罩分为两个前部导流罩和两个后部导流罩，共 4 部分。"},{"序号":229,"试题类型":"单选题","试题内容":"CR400AF头车车顶设置 （） 个无线天线。","A":2,"B":4,"C":6,"D":8,"正确选项":"D","试题解析":"CR400AF头车车顶设置8个无线天线和车顶空调。"},{"序号":230,"试题类型":"单选题","试题内容":"CR400AF车顶天线采用（）安装结构，安装座与车体基本齐平。","A":"悬挂式","B":"沉入式","C":"架悬式","D":"突出式","正确选项":"B","试题解析":"CR400AF车顶天线采用沉入式安装结构，安装座与车体基本齐平。"},{"序号":231,"试题类型":"单选题","试题内容":"CR400AF卫星天线导流罩安装后与（）一致，不影响动车组运行的阻力和噪声。","A":"车内轮廓","B":"设备舱轮廓","C":"车体外轮廓","D":"车下外轮廓","正确选项":"C","试题解析":"CR400AF卫星天线导流罩安装后与车体外轮廓一致，不影响动车组运行的阻力和噪声。"},{"序号":232,"试题类型":"判断题","试题内容":"CR400AF卫星上网天线自带减振器，采用滑槽安装结构。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CR400AF卫星上网天线自带减振器，采用滑槽安装结构。"},{"序号":233,"试题类型":"判断题","试题内容":"CR400AF因车体采用类似受电弓盆式结构的平台，为避免平台内积水，导流罩采用一体式和密封 安装结构。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CR400AF因车体采用类似受电弓盆式结构的平台，为避免平台内积水，导流罩采用一体式和密封 安装结构。"},{"序号":234,"试题类型":"判断题","试题内容":"CR400AF导流罩中部设置 1 个支撑座，以增加导流罩安 装强度，支撑座顶部设置滑槽座，便于安装和保证密封性","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CR400AF导流罩中部设置 3 个支撑座，以增加导流罩安 装强度，支撑座顶部设置滑槽座，便于安装和保证密封性。"},{"序号":235,"试题类型":"判断题","试题内容":"车顶设备安装完成后，紧固件无须涂打防松标记。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"车顶设备安装完成后，紧固件须涂打防松标记。"},{"序号":236,"试题类型":"多选题","试题内容":"动车组车内设备主要有（）、行李架等","A":"侧门","B":"内门","C":"车窗","D":"设备仓","正确选项":"ABC","试题解析":"动车组车内设备主要有侧门、内门、车窗、座椅、行李架等。"},{"序号":237,"试题类型":"单选题","试题内容":"车内设备材料，首先应满足功能要求和防火阻燃要求，装饰板应反映时代感，车内设备约占客车总重量的（），轻量化具有重要意义。","A":0.1,"B":0.2,"C":0.3,"D":0.4,"正确选项":"B","试题解析":"车内设备材料，首先应满足功能要求和防火阻燃要求，装饰板应反映时代感，车内设备约占客车总重量的20％，轻量化具有重要意义。"},{"序号":238,"试题类型":"单选题","试题内容":"CRH1型动车组车门分为内门和（）。","A":"司机室门","B":"外门","C":"厕所门","D":"监控室门","正确选项":"B","试题解析":"CRH1型动车组车门分为外门和内门。"},{"序号":239,"试题类型":"判断题","试题内容":"CRH1型动车组外门是乘务人员和乘客进入车内的通道。每节车厢两侧各设有一个外门，均采用电动塞拉门。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CRH1型动车组外门是乘务人员和乘客进入车内的通道。每节车厢两侧各设有一个外门，均采用电动塞拉门。"},{"序号":240,"试题类型":"多选题","试题内容":"CRH1型动车组内门位于车厢内各部分的通道，分为()。","A":"司机室门","B":"通过台门","C":"风挡门","D":"乘务室门","正确选项":"ABCD","试题解析":"内门位于车厢内各部分的通道，分为司机室门、通过台门、风挡门、乘务室门。"},{"序号":241,"试题类型":"多选题","试题内容":"CRH1型动车组外门机械组成主要由门扇、（）、活动脚蹬装置、紧急解锁装置、门控单元、内操作和外操作装置、密封装置、防冻装置等组成。","A":"单层玻璃窗","B":"承载驱动装置","C":"导向装置","D":"锁闭装置","正确选项":"BCD","试题解析":"CRH1型动车组外门机械组成主要由门扇、承载驱动装置、导向装置、锁闭装置、活动脚蹬装置、紧急解锁装置、门控单元、内操作和外操作装置、密封装置、防冻装置等组成。"},{"序号":242,"试题类型":"判断题","试题内容":"CRH1型动车组外门结构中，安装在滚动支撑架上的滚动支撑对门页的滑动起稳定作用。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CRH1型动车组外门工作原理齿轮齿条传动：驱动电机通过弹性联轴器带动齿轮转动，齿轮与安装在空心管中的轴上的齿轮啮合而带动它转动，进而驱动安装在门页驱动臂上的齿条带动门页，沿着安装在车体上的导轨滑动，而实现门的开启与关闭。安装在滚动支撑架上的滚动支撑对门页的滑动起稳定作用。"},{"序号":243,"试题类型":"多选题","试题内容":"CRH2型动车组侧门结构侧门为单扇的滑门，主要包括：（）","A":"关门机构","B":"螺杆装置","C":"导向机构","D":"驱动装置","正确选项":"ACD","试题解析":"CRH2型动车组侧门结构侧门为单扇的滑门，主要包括：（1）关门机构：力量不强的直动式复动气压风缸。（2）压紧装置：将空气压力转换为液压的液压关门结构。（3）导向机构：安装在门罩内。（4）驱动装置：直动式复动缸。"},{"序号":244,"试题类型":"判断题","试题内容":"CRH2型动车组侧门在紧急情况下，可通过操作车内门上部的气阀，将门气缸里的空气强行进行排气，然后手动打开门。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CRH2型动车组侧门在紧急情况下，可通过操作车内门上部的气阀，将门气缸里的空气强行进行排气，然后手动打开门。外部紧急开关在门旁裙板后。"},{"序号":245,"试题类型":"单选题","试题内容":"CR400AF型动车组塞拉门为电控、电动单扇门，（）压紧密封。","A":"电控气动","B":"电控液压","C":"气控气动","D":"液控液压","正确选项":"A","试题解析":"CR400AF型动车组塞拉门为电控、电动单扇门，电控气动压紧密封。采用主、副门控器进行网络控制。"},{"序号":246,"试题类型":"单选题","试题内容":"CR400AF型动车组车辆与主门控器采用（） 连接进行列车级网络通信","A":"CAN","B":"MVB","C":"WTB","D":"光纤","正确选项":"B","试题解析":"CR400AF型动车组车辆与主门控器采用 MVB 连接进行列车级网络通信。"},{"序号":247,"试题类型":"单选题","试题内容":"CR400AF型动车组同一辆车副门控器与主门控器采用（）线连接进行车辆级网络通信。","A":"CAN","B":"MVB","C":"WTB","D":"光纤","正确选项":"A","试题解析":"CR400AF型动车组同一辆车副门控器与主门控器采用CAN线连接进行车辆级网络通信。"},{"序号":248,"试题类型":"判断题","试题内容":"CR400AF型动车组关键信号指令（关门指令、开门指令、开门允许指令、速度信号、安全回路）采用无线传输。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CR400AF型动车组关键信号指令（关门指令、开门指令、开门允许指令、速度信号、安全回路）采用硬线传输。"},{"序号":249,"试题类型":"判断题","试题内容":"CR400AF型动车组首尾车设置有可在车内操作的隔离锁，其他车门在正常情况下可从车内或车外操作隔离锁。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CR400AF型动车组1、8车设置有可在车内和车外操作的隔离锁，其他车门在正常情况下只从内部操作隔离锁。"},{"序号":250,"试题类型":"单选题","试题内容":"CR400AF型动车组塞拉门采用（）和本地控制两种方式来开关门。","A":"集中控制","B":"无线控制","C":"声音控制","D":"分开控制","正确选项":"A","试题解析":"CR400AF型动车组塞拉门在动车组车上采用集中控制和本地控制两种方式来开关门，司机通过设置在驾驶台上的集控开关控制整列车门的动作；同时在每个门口设置有本地的开关门按钮， 进行本地开关门控制。"},{"序号":251,"试题类型":"单选题","试题内容":"CR400AF型动车组两端司机室的塞拉门释放按钮、开门按钮、关门按钮分别是（）颜色。","A":"黄、红、绿","B":"红、绿、黄","C":"绿、红、黄","D":"黄、绿、红","正确选项":"A","试题解析":"CR400AF型动车组动车组两端司机室设置有塞拉门集控按钮，按钮分左右两侧设置，分别控制单侧车门集中开关；每侧有 3个按钮，分别为释放按钮（黄色按钮，带灯和保护罩）、开门按钮（红色按钮，带保护罩）和关门按钮（绿色按钮），按钮均为自复位式，释放按钮带灯用于显示当前的车门释放状态，释放有效时，该灯点亮。"},{"序号":252,"试题类型":"判断题","试题内容":"CR400AF型动车组塞拉门集控按钮均为自复位式，释放按钮带灯用于显示当前的车门释放状态，释放有效时，该灯点亮。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CR400AF型动车组塞拉门按钮均为自复位式，释放按钮带灯用于显示当前的车门释放状态，释放有效时，该灯点亮。"},{"序号":253,"试题类型":"单选题","试题内容":"CR400AF型动车组门系统使用电源为（），在机构区域作业时要小心触电， 关掉电源。","A":"DC110V","B":"AC220V","C":"DC24V","D":"AC100V","正确选项":"A","试题解析":"CR400AF型动车组门系统使用电源为110VDC，在机构区域作业时要小心触电，关掉电源。"},{"序号":254,"试题类型":"判断题","试题内容":"CR400AF型动车组门到位开关触发后，门不会失去电机防挤压功能。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CR400AF型动车组门到位开关触发后，门将失去电机防挤压功能。注意不要被门夹住。"},{"序号":255,"试题类型":"判断题","试题 乘务员室","D":"多功能室","正确选项":"B","试题解析":"CR400AF按安装位置不同客室车窗可分为：观光区车窗和客室车窗。"},{"序号":296,"试题类型":"判断题","试题内容":"CR400BF在刷车时可以使用硬毛刷直接刷洗密封胶位置。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"在车外侧，车窗通过密封胶确保气密性和水密性，因此刷车时应避免使用硬毛刷直接刷洗密封胶位置，以防止密封胶破坏进而导致漏雨。"},{"序号":297,"试题类型":"单选题","试题内容":"CR400BF客室车窗玻璃使用（）玻璃，在保证光学、隔音、隔热性能的同时，满足强度要求。","A":"单层","B":"夹层中空","C":"瓷晶","D":"高透光","正确选项":"B","试题解析":"CR400BF客室车窗玻璃使用夹层中空玻璃，在保证光学、隔音、隔热性能的同时，满足强度要求。"},{"序号":298,"试题类型":"判断题","试题内容":"CR400AF司机室逃生窗为夹层中空物理钢化玻璃，紧急状况下不可使用破窗锤敲碎形成逃生通道。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CR400AF司机室逃生窗为夹层中空物理钢化玻璃，紧急状况下可使用破窗锤敲碎形成逃生通道。"},{"序号":299,"试题类型":"单选题","试题内容":"CR400AF司机室座椅采用（），机械调节，调节操作简单，具有较高的舒适性和可靠性。","A":"空气囊减振系统","B":"剪刀架式减振系统","C":"平板式减振系统","D":"气液式减振系统","正确选项":"B","试题解析":"CR400AF座椅采用剪刀架式减振系统，机械调节，调节操作简单，具有较高的舒适性和可靠性。"},{"序号":300,"试题类型":"判断题","试题内容":"CR400BFvip座椅分为单人vip座椅和双人vip座椅。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CR400BFvip座椅分为单人vip座椅和双人vip座椅。"},{"序号":301,"试题类型":"单选题","试题内容":"列车的给排水及卫生系统不包括（）部分。","A":"供水系统","B":"饮水机","C":"卫生系统","D":"消毒系统","正确选项":"D","试题解析":"列车的给排水及卫生系统主要包括供水系统、饮水机及卫生系统三部分。"},{"序号":302,"试题类型":"多选题","试题内容":"供水系统主要向（）等设备提供各种用水。","A":"冲洗集便器","B":"洗漱用水","C":"饮水机供水","D":"雨刮器用水","正确选项":"ABC","试题解析":"供水系统主要任务是向列车提供各种用水，如冲洗集便器、洗漱用水、饮水机供水和吧车用水。"},{"序号":303,"试题类型":"判断题","试题内容":"饮水机专为司乘人员提供饮用水；卫生系统为乘客提供舒适的卫生环境，并负责收集污物。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"饮水机用于为乘客提供饮用水；卫生系统为乘客提供舒适的卫生环境，并负责收集污物。"},{"序号":304,"试题类型":"单选题","试题内容":"中国标准动车组每车均设置 （） 车下净水箱给水系统。","A":"200L","B":"400L","C":"600L","D":"800L","正确选项":"B","试题解析":"中国标准动车组每车均设置 400L 车下净水箱给水系统，采用电动水泵供水的方式， 为卫生间便器、卫生间和盥洗室节水阀、洁具池水阀、厨房洗池、电热开水器等用水部件供水；"},{"序号":305,"试题类型":"单选题","试题内容":"中国标准动车组1、8 号车设置450L 车下废水污物箱，2、3、4、6、7 号车设置（）车下废水污物箱，用于收集来自便器的污物与盥洗废水，5 号车设置450L 车下废水箱，用于收集厨房的废水。","A":"300L","B":"450L","C":"600L","D":"650L","正确选项":"C","试题解析":"1、8 号车设置450L 车下废水污物箱，2、3、4、6、7 号车设置600L 车下废水污物箱，用于收集来自便器的污物与盥洗废水，5 号车设置450L 车下废水箱，用于收集厨房的废水。"},{"序号":306,"试题类型":"多选题","试题内容":"中国标准动车组给水装置主要功能有（）。","A":"接受来在线路供水系统的供水","B":"在列车运营过程中储水","C":"为车上用水部件供水","D":"为旅客提供饮用水和卫生系统用水","正确选项":"ABCD","试题解析":"中国标准动车组给水装置主要功能：接受来在线路供水系统的供水；在列车运营过程中储水；为车上用水部件供水；为旅客提供饮用水和卫生系统用水。"},{"序号":307,"试题类型":"单选题","试题内容":"CR400AF动车组为保证系统在低温环境下的正常使用，水箱、水泵、管路设有（）。","A":"防寒及电加热装置","B":"防火及密封装置","C":"过滤及净化装置","D":"增压及调节装置","正确选项":"A","试题解析":"CR400AF动车组为保证系统在低温环境下的正常使用，水箱、水泵、管路设有防寒及电加热装置。"},{"序号":308,"试题类型":"单选题","试题内容":"CR400BF动车组当列车在户外停放时，户外温度介于-25℃~0℃时停车时间超过12小时必须将水箱排空，当户外温度介于-40℃~-25℃时停车时间超过 （）小时必须将水箱排空。","A":2,"B":6,"C":8,"D":4,"正确选项":"C","试题解析":"CR400BF动车组当列车在户外停放时，户外温度介于-25℃~0℃时停车时间超过 12 小时必须将水箱排空，当户外温度介于-40℃~-25℃时停车时间超过 8 小时必须将水箱排空。"},{"序号":309,"试题类型":"判断题","试题内容":"CR400AF动车组给水系统采用的供电制式为交流AC110V，直流DC220V，进行操作时，确保断开电源。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CR400AF动车组系统采用的供电制式为交流AC220V，直流DC110V，进行操作时，确保断开电源。"},{"序号":310,"试题类型":"多选题","试题内容":"CR400BF动车组给水系统主要由车下净水箱、（）、供水管路、排水管路、防冻装置、液位开关、液位显示器等组成。","A":"水泵装置","B":"电气箱","C":"注水管路","D":"溢水管路","正确选项":"ABCD","试题解析":"CR400BF动车组给水系统主要由车下净水箱、水泵装置、电气箱、注水管路、溢水管路、供水管路、排水管路、防冻装置、液位开关、液位显示器等组成。"},{"序号":311,"试题类型":"判断题","试题内容":"CR400AF动车组水箱内箱和骨架由铝合金板或铝合金型材焊接而成，内箱设有防波板和补强梁。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CR400AF动车组水箱内箱和骨架由不锈钢板或不锈钢型材焊接而成，内箱设有防波板和补强梁；水箱顶部和四周的外箱采用铝板，底部无防护的外箱采用不锈钢板，保证水箱良好的抗石击能力。"},{"序号":312,"试题类型":"单选题","试题内容":"CR400BF动车组水箱装置集内箱体组成、水泵组成、供水管路、注水管路、溢水管路、排水管路、保温层和外箱、电伴热装置等部件为一体，与车体（）相连接固定。","A":"横梁","B":"端梁","C":"端板","D":"顶梁","正确选项":"A","试题解析":"CR400BF动车组水箱装置集内箱体组成、水泵组成、供水管路、注水管路、溢水管路、排水管路、保温层和外箱、电伴热装置等部件为一体，与车体横梁相连接固定。"},{"序号":313,"试题类型":"多选题","试题内容":"CR400BF动车组车下水泵装置主要由（）、排水电磁阀、 电气箱等组成。","A":"水泵","B":"吸气检测开关","C":"泄漏检测开关","D":"水箱","正确选项":"ABC","试题解析":"CR400BF动车组车下水泵装置采用集成化设计，位于水箱端部泵房内，主要由水泵(包含压力缓冲罐、流量开关、扬程压力开关)、吸气检测开关、泄漏检测开关、进水电磁阀、排水电磁阀、 电气箱等组成。"},{"序号":314,"试题类型":"单选题","试题内容":"CR400AF动车组车下液位显示器不指示（）存水情况。","A":"水箱","B":"污物箱","C":"废水箱","D":"温水箱","正确选项":"D","试题解析":"CR400AF动车组车下液位显示器装于车下设备舱内靠近水箱注水口附近，用于指示水箱、污物和废水箱存水情况，车下液位显示器通过电力连接器与车上液位及加热显示器、电气控制单元连接。"},{"序号":315,"试题类型":"单选题","试题内容":"CR400AF动车组车下净水箱供水系统 ，"},{"序号":335,"试题类型":"单选题","试题内容":"CR400BF电热开水器的自动保温程序为：电热开水器停止工作三分钟后，能自行开启加热 （）秒钟，这样保证储水箱中水温达到 95℃以上。","A":6,"B":8,"C":2,"D":4,"正确选项":"B","试题解析":"CR400BF电热开水器由单片微处理器设置了自动保温程序，在储水箱满水位时能自动进入保温状态：即电热开水器停止工作三分钟后，能自行开启加热 8 秒钟，这样保证储水箱中水温达到 95℃以上。"},{"序号":336,"试题类型":"判断题","试题内容":"CR400AF电热开水器具有二次缺水保护装置，即当产水箱水位下降至下水位时，电热开水器开始补水，停止加热。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CR400AF电热开水器具有二次缺水保护装置，即当产水箱水位下降至下水位时，电热开水器开始补水，停止加热。"},{"序号":337,"试题类型":"单选题","试题内容":"CR400AF电热开水器内设置漏电保护开关，当开水器的对地漏电流超过（）时，空气开关立即动作，切断交流电源。","A":"22mA","B":"10mA","C":"30mA","D":"20mA","正确选项":"C","试题解析":"CR400AF电热开水器内设置漏电保护开关，当开水器的对地漏电流超过 30mA 时，空气开关立即动作，切断交流电源，电热开水器脱离列车供电系统，避免电热开水器影响其它设备的正常工作。"},{"序号":338,"试题类型":"多选题","试题内容":"CR400AF电热开水器由柜体、（）、加热腔、水位传感器、电磁阀等器件组成。","A":"电气控制箱","B":"辅助控制箱","C":"产水箱","D":"储水箱","正确选项":"ABCD","试题解析":"CR400AF电热开水器由柜体、电气控制箱、辅助控制箱、产水箱、储水箱、加热腔、水位传感器、电磁阀等器件组成。"},{"序号":339,"试题类型":"多选题","试题内容":"控制箱是CR400AF电热开水器的功能控制部件，具有电热开水器（）保护等多种功能。","A":"过热","B":"过流","C":"缺水","D":"过冷","正确选项":"ABC","试题解析":"控制箱是CR400AF电热开水器的功能控制部件，具有电热开水器过热、过流、缺水保护等多种功能。加热腔设有加热线圈，在交变电场作用下，产生磁场，产生涡流，是产生开水的热源。储水箱存放开水，外接水位传感器，控制电热开水器的加热与关闭。"},{"序号":340,"试题类型":"单选题","试题内容":"CR400AF卫生间采用（）集便系统，每个卫生间和盥洗室设有一个按压式洗手阀。","A":"中转式","B":"重力式","C":"储水式","D":"循环式","正确选项":"A","试题解析":"CR400AF卫生间采用中转式集便系统，每个卫生间和盥洗室设有一个按压式洗手阀。"},{"序号":341,"试题类型":"单选题","试题内容":"CR400AF座式便器使用清水高压冲洗，分为两次冲洗，首次冲洗耗水不超过 （）/次，二次冲洗耗水不超过（）/次。","A":"0.4L、 0.2L","B":"0.3L、 0.1L","C":"0.3L、 0.4L","D":"0.2L、 0.4L","正确选项":"A","试题解析":"CR400AF座式便器使用清水高压冲洗，分为两次冲洗，首次冲洗耗水不超过 0.4L/次，二次冲洗耗水不超过 0.2L/次。"},{"序号":342,"试题类型":"判断题","试题内容":"CR400AF为减少污物的附着，便器内表面采用钛合金涂层。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CR400AF为减少污物的附着，便器内表面采用特殊聚四氟乙烯涂层。"},{"序号":343,"试题类型":"多选题","试题内容":"CR400AF卫生间电气控制单元用于控制整个给水卫生系统的工作，包括：集便系统各部件的动作控制、集便系统故障保护与报警、水箱与污物箱液位指示、缺水保护、（）等。","A":"失火保护","B":"箱满保护","C":"泄漏保护","D":"防冻排空","正确选项":"BCD","试题解析":"CR400AF卫生间电气控制单元用于控制整个给水卫生系统的工作，包括：集便系统各部件的动作控制、集便系统故障保护与报警、水箱与污物箱液位指示、缺水保护、箱满保护、泄漏保护、防冻排空等。"},{"序号":344,"试题类型":"多选题","试题内容":" :"制冷","B":"恒温","C":"加湿","D":"消毒","正确选项":"A","试题解析":"CR400AF/BF动车组为满足司机室舒适度要求，司机室除了从客室的空调装置吸入新鲜空气之外，司机室单独设置空调装置和暖风机，实现司机室的制冷功能和制热功能。在司机第二操作区设有冷气开关和暖气开关，可以根据要求对空调装置及暖风机进行控制，从而保证司机室的温度和环境。"},{"序号":356,"试题类型":"多选题","试题内容":"CR400AF/BF动车组司机室前窗玻璃为电热夹层安全玻璃，具有抗飞弹冲击、（）。","A":"防飞溅","B":"抗砾石","C":"隔声","D":"隔热性能","正确选项":"ABCD","试题解析":"CR400AF/BF动车组司机室前窗玻璃为电热夹层安全玻璃，具有抗飞弹冲击、防飞溅、抗砾石、隔声、隔热性能。"},{"序号":357,"试题类型":"单选题","试题内容":"司机室前窗装置不包含（）。","A":"刮雨器","B":"加热器","C":"遮阳装置","D":"挡雨棚","正确选项":"D","试题解析":"司机室前窗安装有刮雨器、加热器及遮阳装置。"},{"序号":358,"试题类型":"判断题","试题内容":"CR400AF动车组司机室内的照明通过顶板上的卤素灯来实现。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"司机室内的照明通过顶板上的 LED 灯来实现。"},{"序号":359,"试题类型":"单选题","试题内容":"司机室材料均选用()的非延燃性材料或防火材料，电气设备、电线电缆等的绝缘性能优良。","A":"易燃","B":"高烟","C":"无毒（低毒）","D":"有卤","正确选项":"C","试题解析":"司机室材料均选用阻燃、低烟、无毒（低毒）、无卤的非延燃性材料或防火材料，电气设备、电线电缆等的绝缘性能优良。"},{"序号":360,"试题类型":"单选题","试题内容":"下列不是CR400AF/BF动车组司机室仪表盘构成结构的是（）。","A":"主安装骨架","B":"设备安装件","C":"仪表盘装饰板","D":"精密直线导轨","正确选项":"D","试题解析":"CR400AF/BF动车组司机室仪表盘由主安装骨架、设备安装件和仪表盘装饰板构成。整个仪表盘采用主安装骨架安装设备外覆仪表盘装饰板的结构，大大提高了设备的检修及维护性。"},{"序号":361,"试题类型":"多选题","试题内容":"司机室划分为（）三个区域。","A":"设备舱","B":"操控区","C":"电气柜","D":"自动车钩","正确选项":"ABC","试题解析":"我们将司机室划分为三个区域：设备舱、操控区、电气柜。操控区位于司机室的中间， 前窗玻璃的下方，操控区与气密墙之间为设备舱区，司机室电气柜位于司机的左右两侧，如图1-67所示。"},{"序号":362,"试题类型":"多选题","试题内容":"CR400AF/BF动车组司机室操纵台前面的仪表盘上除ATP显示器外，还安装有（）等显示设备。","A":"PLC显示器","B":"TCMS显示器","C":"CIR显示器","D":"TCAS显示器","正确选项":"BCD","试题解析":"操纵台骨架上安装有司机控制器等，操纵台台面上安装有操纵台前面的仪表盘上安装有 ATP 显示器、TCMS 显示器、CIR 显示器、TCAS 显示器等显示设备。"},{"序号":363,"试题类型":"多选题","试题内容":"CR400AF/BF动车组司机室电气柜分为（）。","A":"右前电气柜","B":"右后电气柜","C":"左前电气柜","D":"左后电气柜。","正确选项":"ABCD","试题解析":"我们将电气柜划分为 4 部分：右前电气柜、右后电气柜、左前电气柜、左后电气柜。"},{"序号":364,"试题类型":"多选题","试题内容":"CR400AF/BF动车组司机室右后电气柜主要布置了司机室配电盘 、司机室转换开关盘 、（）。","A":"接线端子排","B":"司机室配电盘","C":"连接器","D":"司机室端子排盘","正确选项":"ABCD","试题解析":"CR400AF/BF动车组右后电气柜主要布置了司机室配电盘 、司机室转换开关盘 、接线端子排、司机室配电盘、连接器、司机室端子排盘。"},{"序号":365,"试题类型":"单选题","试题内容":"CR400AF/BF动车组司机室左前电气柜主要布置了刮雨器水箱和（）。","A":"灭火器","B":"刮雨器水泵","C":"破窗锤","D":"副司机座椅","正确选项":"B","试题解析":"CR400AF/BF动车组左前电气柜主要布置了刮雨器水箱、刮雨器水泵。"},{"序号":366,"试题类型":"多选题","试题内容":"CR400AF/BF动车组司机室左后电气柜主要布置了司机室配电盘 3、司机室辅助座椅、TCMS 数字量输入模块(DC24V)、（）。","A":"连接器","B":"灭火器","C":"司机室电暖气","D":"FB电子排","正确选项":"ABC","试题解析":"CR400AF/BF动车组左后电气柜主要布置了司机室配电盘 3、司机室辅助座椅、TCMS 数字量输入模块(DC24V)、连接器、灭火器、司机室电暖气、TB 端子排。"},{"序号":367,"试题类型":"判断题","试题内容":"CR400AF/BF动车组司机前窗玻璃下方左右两侧布置有前照灯和标志灯，车辆在起动状态时，前照灯不会自动打开。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CR400AF/BF动车组司机前窗玻璃下方左右两侧布置有前照灯和标志灯，车辆在起动状态时，前照灯就会自动打开。"},{"序号":368,"试题类型":"多选题","试题内容":"CR400AF/BF动车组前组合灯电气部分主要包括：（）及电缆附件组成。","A":"灯泡","B":"镇流器","C":"电源","D":"LED","正确选项":"ABCD","试题解析":"CR400AF/BF动车组前组合灯电气部分主要包括：灯泡、镇流器、电源、LED 及电缆附件组成。"},{"序号":369,"试题类型":"多选题","试题内容":"CR400AF/BF动车组前组合灯机械及光学部件主要包括：（）、反射器、透镜组件及安装附件组成","A":"总成","B":"装饰框","C":"灯罩","D":"后盖","正确选项":"ABCD","试题解析":"CR400AF/BF动车组前组合灯机械及光学部件主要包括：总成、装饰框、灯罩、后盖、反射器、透镜组件及安装附件组成"},{"序号":370,"试题类型":"单选题","试题内容":"CR400AF/BF动车组前组合灯电源的功能是对车体的输入 DC110 进行变压，变压成 （），同时对电路起稳压、保护的功能。","A":"DC24V","B":"DC220V","C":"AC24V","D":"AC220V","正确选项":"A","试题解析":"CR400AF/BF动车组前组合灯电源的功能是对车体的输入 DC110 进行变压，变压成 DC24V，同时对电路起稳压、保护的功能。"},{"序号":371,"试题类型":"判断题","试题内容":"风笛是仅由高音风笛组成。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"风笛是由高音风笛和低音风笛两部分组成。"},{"序号":372,"试题类型":"多选题","试题内容":"风笛主要零部件包括：（）、O型圈、喇叭筒。","A":"接头体","B":"阀体","C":"发音板","D":"阀盖","正确选项":"ABCD","试题解析":"风笛主要零部件：接头体、阀体、发音板、阀盖等。"},{"序号":373,"试题类型":"单选题","试题内容":"风笛的接头体用于连接风笛阀体与车辆起源管路并起到（）的作用。","A":"连接固定","B":"传递声音","C":"储存气体","D":"调节气压","正确选项":"A","试题解析":"接头体：用于连接风笛阀体与车辆起源管路。有连接固定的作用。"},{"序号":374,"试题类型":"单选题","试题内容":"阀体是整个风笛装置（）的主要构成部分之一。","A":"连接","B":"储存","C":"承载","D":"发声","正确选项":"D","试题解析":"阀体：阀体分为内腔和外腔。气流由外腔进入内腔，从而进行发声。阀体是整个风笛装置发声的主要构成部分。"},{"序号":375,"试题类型":"单选题","试题内容":"发音板也是整个风笛装置发声的重要构成部分，主要起到（）发声的作用。","A":"超声波","B":"震动","C":"传导","D":"调节","正确选项":"B","试题解析":"发音板：主要作用是置于阀体凸台与盖凸台之间，对气流进行一定程度上的封堵作用。它是气流由阀体外腔进入到阀体内腔的主要阻碍物。气流不断的将其顶起（很小的一点缝隙），从而发音板不断进行着振幅极小的往复震动，从而达到发声的目的。发音板也是整个风笛装置发声的重要构成部分，主要起到震动发声的作用。"},{"序号":376,"试题类型":"单选题","试题内容":"风笛的阀盖主要用于连接阀体并且将发音板紧紧压于阀体凸台与盖凸台之间，起到（）的作用。","A":"调压","B":"传导","C":"压紧","D":"调节","正确选项":"C","试题解析":"阀盖：主要用于连接阀体并且将发音板紧紧压于阀体凸台与盖凸台之间。起到压紧的作用。"},{"序号":377,"试题类型":"单选题","试题内容":"风笛的喇叭筒与阀体直接通过螺纹连接，主要起到（）作用。","A":"扩大分贝值","B":"调节音色","C":"转变音调","D":"提高音质","正确选项":"A","试题解析":"喇叭筒：与阀体直接通过螺纹连接。主要作用是将声源的分贝值扩大至要求范围值及风笛频率达到某个范围值。"},{"序号":378,"试题类型":"单选题","试题内容":"TZY1系列型司机座椅具有结构（），功能齐全，减震效果好、调节灵活、使用方便、坐靠舒适、经久耐用。","A":"紧凑","B":"宽大","C":"复杂","D":"重量大","正确选项":"A","试题解析":"TZY1 系列型司机座椅具有结构紧凑，功能齐全，减震效果好、调节灵活、使用方便、坐靠舒适、经久耐用。"},{"序号":379,"试题类型":"单选题","试题内容":"司机室座椅使用材料均通过了严格（）检验。","A":"防水性能","B":"防火阻燃","C":"抗氧化","D":"气密性","正确选项":"B","试题解析":"座椅使用材料均通过了严格防火阻燃检验。"},{"序号":380,"试题类型":"多选题","试题内容":"CR400AF/BF动车组司机室遮阳帘系统包括:（），驱动单元，钢丝绳组成，线束组成(电路控制模块)及车体连接支架组成。","A":"左导轨组成","B":"右导轨组成","C":"前部导轨组成","D":"卷帘组成(包含内部弹簧)","正确选项":"ABCD","试题解析":"CR400AF/BF动车组司机室遮阳帘系统包括:左导轨组成，右导轨组成，前部导轨组成,卷帘组成(包含内部弹簧)，驱动单元，钢丝绳组成，线束组成(电路控制模块)及车体连接支架组成。"},{"序号":381,"试题类型":"单选题","试题内容":"CR400AF/BF动车组司机室遮阳帘控制开关设有几个挡位？","A":1,"B":3,"C":5,"D":7,"正确选项":"B","试题解析":"司机室遮阳帘控制开关设置在操纵台上，分别设有升、降、停三个档位，将开关打到相应档位即可对遮阳帘进行控制。"},{"序号":382,"试题类型":"单选题","试题内容":"动车组重联与解编作业由司机和（）共同进行。","A":"司机","B":"机械师","C":"列车长","D":"乘警","正确选项":"B","试题解析":"动车组重联与解编作业由司机与机械师共同进行，司机负责操作动车组，机械师负责检查连接装置和显示信号"},{"序号":383,"试题类型":"判断题","试题内容":"重联过程中，移动的车作为被控车，静止的车作为主控车。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"重联过程中，移动的车作为主控车，静止的车作为被控车。"},{"序号":384,"试题类型":"判断题","试题内容":"CR400AF/BF动车组被控车进入联挂线路停车，车辆无需施加停放制动。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"动车组被控车进入联挂线路停车，车辆施加停放制动。"},{"序号":385,"试题类型":"单选题","试题内容":"CR400AF动车组重联时，主控车进入联挂线路，距离被控车大于（）以上停车，施加停放制动","A":"3m","B":"5m","C":"2m","D":"1m","正确选项":"B","试题解析":"动车组主控车进入联挂线路，距离被控车大于5m以上停车，施加停放制动"},{"序号":386,"试题类型":"单选题","试题内容":"CR400AF动车组重联时，分别确认两重联动车组联挂端（）断路器处于闭合位置。","A":"联解控制","B":"救援转换装置","C":"闭锁解除强制合","D":"罩开强制合","正确选项":"A","试题解析":"分别确认两重联动车组联挂端【联解控制】断路器处于闭合位置。"},{"序号":387,"试题类型":"单选题","试题内容":"CR400AF动车组重联时，确认主控车与被控车 HMI 显示屏“联挂准备－电钩退回到位—（）－头罩打开－头罩锁关闭－机械钩解联—联挂准备就绪”依次显示绿色，状态正常，","A":"头罩锁打开","B":"头罩锁闭合","C":"限位开关到位","D":"电钩分离","正确选项":"A","试题解析":"确认主控车与被控车 HMI 显示屏“联挂准备－电钩退回到位—头罩锁打开－头罩打开－头罩锁关闭－机械钩解联—联挂准备就绪”依次显示绿色，状态正常，"},{"序号":388,"试题类型":"单选题","试题内容":"CR400AF动车组重联时，主控车司机确认“联挂准备就绪”键变为（），缓解停放制动，点击“恒速2km/h”后操纵动车组以2km/h的速度进行联挂。","A":"绿色","B":"白色","C":"黄色","D":"红色","正确选项":"A","试题解析":"主控车司机确认“联挂准备就绪”键变为绿色，缓解停放制动，点击“恒速2km/h”后操纵动车组以2km/h的速度进行联挂。"},{"序号":389,"试题类型":"单选题","试题内容":"CR400AF动车组重联时，联挂速度不能超过（）。","A":"4km/h","B":"2km/h","C":"3km/h","D":"5km/h","正确选项":"B","试题解析":"界面中联挂解联过程中已经完成的步骤背景色为绿色，失败的步骤背景色为红色，尚未进行的步骤背景色为白色；2.如主控车不采用联挂2km/h时，联挂时速度为不能超过2km/h；3.两重联动车组之间距离需大于5米。"},{"序号":390,"试题类型":"单选题","试题内容":"CR400AF动车组解编时，主控车操作HMI屏【联挂解联】界面中的【开始解联】按键后，动车组（）动作。","A":"紧急制动EB和UB","B":"常用制动","C":"电阻制动","D":"再生制动","正确选项":"A","试题解析":"主控车重联端投入主控并操作 HMI 屏【联挂解联】界面中的【开始解联】按键，确认“电钩退回到位－空气管关闭－机械钩解联—解联准备就绪”依次显示绿色，状态正常，两编组紧急制动EB和UB动作。"},{"序号":391,"试题类型":"单选题","试题内容":"CR400AF动车组解编完成，主控车缓解停放制动，施加牵引后，要离开被控车（）以上。","A":3,"B":5,"C":1,"D":2,"正确选项":"B","试题解析":"缓解停放制动，施加牵引，尽快离开被控车5m以上。"},{"序号":392,"试题类型":"单选题","试题内容":"CR400AF动车组解编完成后需断开两列车的（）断路器。","A":"联解控制","B":"联解分控","C":"联解限位","D":"24V电源","正确选项":"A","试题解析":"断开两列重联动车组“联解控制“断路器，解编作业完成。"},{"序号":393,"试题类型":"判断题","试题内容":"CR400BF动车组重联前无需设置本车的重联状态。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"两列车重联前都是单列状态，CCT车厢号均为1~8。两列车重联前，需要设置本车的重联状态。"},{"序号":394,"试题类型":"单选题","试题内容":"CR400BF动车组重联时，两车需相距（）左右，升同号车受电弓并施加停放制动。","A":3,"B":5,"C":1,"D":2,"正确选项":"B","试题解析":"两列动车组进入联挂线路，距离5m左右停车，确认动车组主断路器闭合，高压供电正常，确认两列动车组同时升起3车受电弓或6车受电弓，停放制动处于施加状态。"},{"序号":395,"试题类型":"判断题","试题内容":"CR400BF动车组联挂前，对联挂主车和联挂从车进行PIS设置。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"联挂前，对联挂主车和联挂从车进行PIS设置。"},{"序号":396,"试题类型":"单选题","试题内容":"CR400BF动车组重联解编作业过程中，保持至少（）米安全距离防止受伤。","A":0.5,"B":1,"C":0.3,"D":0.7,"正确选项":"B","试题解析":"注：a.如果待联挂车不在准备联挂位置，可操作自动或手动解钩设备；b.超过联挂范围或对角联挂时，车钩可能突然向侧面旋转，保持至少一米安全距离防止受伤。"},{"序号":397,"试题类型":"判断题","试题内容":"CR400BF动车组联挂到位后机械联挂指示的两红色区域不重合。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"观察机械联挂指示的两红色区域是否重合到位，重合则联挂到位。"},{"序号":398,"试题类型":"单选题","试题内容":"CR400BF动车组重联后，机械师无需确认（）。","A":"联挂端机械车钩","B":"电气连接器连接","C":"导向杆","D":"车顶天线","正确选项":"D","试题解析":"机械师车下确认联挂端机械车钩、电气连接器连接、导向杆正常，通知司机。"},{"序号":399,"试题类型":"多选题","试题内容":"风挡检查作业时需对（）部位进行检查。","A":"螺栓","B":"框架","C":"篷布","D":"外风挡内侧底部","正确选项":"ABCD","试题解析":"（一）外风挡检查：1.螺栓无松动。2.框架与车体连接配合良好。3.篷布无破损。4.打开内风挡渡板，查看外风挡内侧底部无积水，如有积水需要清除。"},{"序号":400,"试题类型":"单选题","试题内容":"下列（）不属于客室上部设施检修范围。","A":"客室地板","B":"座椅及附件","C":"大件行李隔板","D":"空压机","正确选项":"D","试题解析":"上部设施检修（一）检查客室地板、顶板、装饰板、座椅及附件、窗帘、茶桌、行李架、衣帽钩等配件齐全、作用良好，窗玻璃外观及安装状态良好。（二）垃圾箱、大件行李隔板外观及安装状态良好，无松动。（三）信息显示屏外观及状态良好。"},{"序号":401,"试题类型":"判断题","试题内容":"灭火器指针指示应在黄色合格区域。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"检查司机室、客室端部及厨房灭火器规格数量齐全，位置正确，外观良好，安装座牢固；喷嘴（喷管）、压把、压力表、插销齐全良好；灭火器定检日期距下次检查不过期；灭火器指针指示在绿区合格区域。"},{"序号":402,"试题类型":"单选题","试题内容":"下列（）不属于给排水卫生系统检修范围。","A":"电开水炉指示灯","B":"洗池模块","C":"水龙头","D":"HMI屏","正确选项":"D","试题解析":"给排水卫生系统检修（一）厨房电开水炉指示灯显示正常，无漏水，接水面板无脏堵，水龙头无损坏，水龙头开关出水正常；（二）检查洗池模块水管路无泄露，功能良好。洗池滤网无杂物、无堵塞，水龙头开关出水正常。"},{"序号":403,"试题类型":"单选题","试题内容":"下列（）不属于卫生间 、洗面间 、拖布洗池检修范围。","A":"厕所门","B":"便器","C":"盥洗装置","D":"内端门","正确选项":"D","试题解析":"卫生间 、洗面间 、拖布洗池检修（一）便器、洗手池、厕纸架、镜子、盥洗装置、冲洗按钮等设施外观良好，无异味，零部件无缺失。（二）厕所门开关作用良好。（三）客室内卫生间有无人显示器功能正常。（四）按压冲洗按钮作用良好；洗手水嘴出水正常。（五）洗面间，拖布洗池按压冲洗按钮作用良好，功能良好。"},{"序号":404,"试题类型":"单选题","试题内容":"下列（）不属于司机室设备检查检修范围。","A":"电压表、压力表","B":"照明灯、仪表灯","C":"遮阳帘","D":"车顶天线","正确选项":"D","试题解析":"司机室设备检查（一）检查司机室设备无损伤，安装无松动，状态良好正常。（二）检查电压表、压力表外观及安装状态良好。（三）检查室内照明灯、仪表灯状态良好，无损坏。（四）检查各柜门开启及锁闭作用良好。（五）检查遮阳帘无损伤，作用良好。"},{"序号":405,"试题类型":"多选题","试题内容":"辅助变流器向轻量化、小体积发展，近年均采用( )来提高效率和可靠性。","A":"IGBT元件","B":"高频电力电子技术","C":"低频电力电子技术","D":"JTR","正确选项":"AB","试题解析":"辅助变流器向轻量化、小体积发展，近年均采用IGBT元件和高频电力电子技术来提高效率和可靠性。"},{"序号":406,"试题类型":"多选题","试题内容":"动车组的辅助供电系统一般由辅( )等组成。","A":"辅助变流器","B":"蓄电池","C":"充电机","D":"牵引变压器","正确选项":"ABC","试题解析":"动车组的辅助供电系统一般由辅助变流器、蓄电池、充电机等组成。"},{"序号":407,"试题类型":"多选题","试题内容":"辅助变流器由( )和控制单元组成。","A":"输入滤波器","B":"斩波器","C":"逆变器","D":"输出滤波器","正确选项":"ABCD","试题解析":"辅助变流器由输入滤波器、斩波器、逆变器、输出滤波器和控制单元组成。"},{"序号":408,"试题类型":"多选题","试题内容":"辅助供电系统具有包 ":558,"试题类型":"单选题","试题内容":"动车组制动系统具备的条件之一：保证高速制动时车轮不()。","A":"空转","B":"滑行","C":"剥离","D":"硌伤","正确选项":"B","试题解析":"动车组制动系统具备的条件是:①尽可能缩短制动距离以保障列车安全;②保证高速制动时车轮不滑行;③司机操纵制动系统灵活可靠，能适应列车自动控制的要求。"},{"序号":559,"试题类型":"单选题","试题内容":"车钩缓冲装置在列车中起传递()力的作用。它直接影响列车纵向冲击力的大小，旅客的舒适性和列车的安全性。","A":"横向","B":"侧向","C":"纵向","D":"斜向","正确选项":"C","试题解析":"车钩缓冲装置在列车中起传递纵向力的作用。它直接影响列车纵向冲击力的大小，旅客的舒适性和列车的安全性。"},{"序号":560,"试题类型":"单选题","试题内容":"密接式车钩缓冲装置的两车钩连接面的纵向间隙一般都小于（） mm，上下、左右偏移也很小，对提高列车的运行平稳性和电气线路、风管的自动对接提供了保证。 ","A":2,"B":4,"C":6,"D":8,"正确选项":"A","试题解析":"密接式车钩缓冲装置的两车钩连接面的纵向间隙一般都小于2 mm，上下、左右偏移也很小，对提高列车的运行平稳性和电气线路、风管的自动对接提供了保证。 "},{"序号":561,"试题类型":"单选题","试题内容":"交流传动系统的()装置是将单相交流电转变为调频调压的三相交流电。","A":"变频","B":"变流","C":"变压","D":"变阻","正确选项":"B","试题解析":"交流传动系统的变流装置是将单相交流电转变为调频调压的三相交流电。"},{"序号":562,"试题类型":"单选题","试题内容":"列车网络控制诊断技术主要是实现动车组的控制、监视、信息传输和故障()功能。","A":"引导","B":"处理","C":"显示","D":"诊断","正确选项":"D","试题解析":"列车网络控制诊断技术主要是实现动车组的控制、监视、信息传输和故障诊断功能。"},{"序号":563,"试题类型":"单选题","试题内容":"我国接触网电压全国统一为（） kV，与欧洲相比，避免车载设备需兼容多电压制式的问题。","A":23,"B":25,"C":29,"D":31,"正确选项":"B","试题解析":"我国接触网电压全国统一为25 kV，与欧洲相比，避免车载设备需兼容多电压制式的问题。"},{"序号":564,"试题类型":"判断题","试题内容":"中国标准动车组构建了体系完整、结构合理、先进科学的中国动车组技术标准体系，具有创新性、安全性、智能化、人性化、经济性等特点。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"中国标准动车组构建了体系完整、结构合理、先进科学的中国动车组技术标准体系，具有创新性、安全性、智能化、人性化、经济性等特点。中国标准动车组采用的标准涵盖了动车组基础通用、车体、走行装置、司机室布置及设备、牵引电气、制动及供风、列车网络标准、运用维修等10多个方面。"},{"序号":565,"试题类型":"判断题","试题内容":"互联互通就是指中国标准动车组具备重联、救援、回送、互操作四部分功能，该功能可以解决互联、互通、互操作问题实现。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"互联互通就是指中国标准动车组具备重联、救援、回送、互操作四部分功能，该功能可以解决互联、互通、互操作问题实现。"},{"序号":566,"试题类型":"单选题","试题内容":"（）指发送设备到接收设备之间信号传递所经媒介。","A":"数据总线","B":"载波信号","C":"传输介质","D":"基带信号","正确选项":"C","试题解析":"传输介质指发送设备到接收设备之间信号传递所经媒介。"},{"序号":567,"试题类型":"单选题","试题内容":"在曼彻斯特编码中，时间被划分为等间隔的小段，其中每小段代表（）。","A":"两个字节","B":"一个比特","C":"一个字","D":"两个字长","正确选项":"B","试题解析":"在曼彻斯特编码中，时间被划分为等间隔的小段，其中每小段代表一个比特。每一小段时间本身又分为两半，前半个时间段所传信号是该时间段传送比特值取反码，后半个时间段传送的是比特值本身。"},{"序号":568,"试题类型":"单选题","试题内容":"（）就是在数字通信的信道上直接传送数据的基带信号，即按数据波的原样进行传输，不包含有任何调制，它是最基本的数据传输方式。","A":"基带传输","B":"载波传输","C":"频带传输","D":"数字调制","正确选项":"A","试题解析":"基带传输就是在数字通信的信道上直接传送数据的基带信号，即按数据波的原样进行传输，不包含有任何调制，它是最基本的数据传输方式。"},{"序号":569,"试题类型":"单选题","试题内容":"载波传输采用（）对载波进行调制后实行传输。","A":"电压信号","B":"模拟信号","C":"数字信号","D":"电流信号","正确选项":"C","试题解析":"载波传输采用数字信号对载波进行调制后实行传输。"},{"序号":570,"试题类型":"单选题","试题内容":"全双工通信是指能同时作双向通信，一般采用（）结构。","A":"两线制","B":"三线制","C":"四线制","D":"单线制","正确选项":"C","试题解析":"全双工通信是指能同时作双向通信。它相当于把两个相反方向的单工通信方式组合在一起。因此全双工通信一般采用四线制结构。"},{"序号":571,"试题类型":"单选题","试题内容":"在总线型拓扑中，一个站发送数据，所有其他站都能接收。因此，总线型拓扑的传输介质称作多点式或（）。","A":"点对点","B":"广播式","C":"双向传输","D":"环形结构","正确选项":"B","试题解析":"在总线型拓扑中，传输介质是一条总线，工作站通过相应硬件接口接至总线上。一个站发送数据，所有其他站都能接收。因此，总线型拓扑的传输介质称作多点式或广播式。在总线两端连接有端结器(或终端匹配器)，主要与总线进行阻抗匹配，最大限度吸收传送端部的能量，避免信号反射回总线产生不必要的干扰。"},{"序号":572,"试题类型":"单选题","试题内容":"管理主、从设备使用总线的一套规则称为（）。这是一套事先规定的、必须共同遵守的规约。","A":"总线协议","B":"传输协议","C":"通信协议","D":"网络协议","正确选项":"A","试题解析":"总线协议：管理主、从设备使用总线的一套规则称为“总线协议”（bus Protocol）。这是一套事先规定的、必须共同遵守的规约。"},{"序号":573,"试题类型":"单选题","试题内容":"双绞线由按规则螺旋结构排列的两根或四根绝缘线组成。一对线可以作为一条通信线路,各个线对螺旋排列的目的是（）。","A":"增加信号传输速度","B":"减小信号衰减","C":"使各线对之间的电磁干扰最小","D":"增大线对之间的电容","正确选项":"C","试题解析":"双绞线由按规则螺旋结构排列的两根或四根绝缘线组成。一对线可以作为一条通信线路,各个线对螺旋排列的目的是使各线对之间的电磁干扰最小。抗干扰性∶双绞线的抗干扰性取决于一束线中相邻线对的扭曲长度及适当的屏蔽。在低频传输时，其抗干扰能力相当于同轴电缆。在10～100kHz时，其抗干扰能力低于同轴电缆。"},{"序号":574,"试题类型":"单选题","试题内容":"ACU是标准动车组（）的简称。","A":"辅助变流器控制单元","B":"空调控制单元","C":"门控制单元","D":"人机交互接口","正确选项":"A","试题解析":"ACU是标准动车组辅助变流器控制单元的简称。"},{"序号":575,"试题类型":"单选题","试题内容":"HVAC是标准动车组（）的简称。","A":"辅助变流器控制单元","B":"空调控制单元","C":"门控制单元","D":"人机交互接口","正确选项":"B","试题解析":"HVAC是标准动车组空调控制单元的简称。"},{"序号":576,"试题类型":"单选题","试题内容":"DCU是标准动车组（）的简称。","A":"辅助变流器控制单元","B":"空调控制单元","C":"门控制单元","D":"人机交互接口","正确选项":"C","试题解析":"DCU是标准动车组门控制单元的简称。"},{"序号":577,"试题类型":"单选题","试题内容":"HMI是标准动车组（）的简称。","A":"辅助变流器控制单元","B":"空调控制单元","C":"门控制单元","D":"人机交互接口","正确选项":"D","试题解析":"HMI是标准动车组人机交互接口的简称。"},{"序号":578,"试题类型":"单选题","试题内容":"中国标准动车组网络控制系统的警惕功能是指列车在运行过程中，为（），需要司机在规定的时间内对手柄，灯，踏板等设备进行操作，否则在一定时间内进行警惕报警，如果仍然无动作，进行紧急制动停车。","A":"监控列车速度","B":"防止司机睡着","C":"控制列车方向","D":"监测车辆故障","正确选项":"B","试题解析":"中国标准动车组网络控制系统的警惕功能是指列车在运行过程中，为防止司机睡着，需要司机在规定的时间内对手柄，灯，踏板等设备进行操作，否则在一定时间内进行警惕报警，如果仍然无动作，进行紧急制动停车。"},{"序号":579,"试题类型":"单选题","试题内容":"中国标准动车组网络控制系统的诊断功能不包括（）。","A":"采集车载各部件故障数据","B":"分析故障数据","C":"显示故障信息","D":"控制列车运行","正确选项":"D","试题解析":"中国标准动车组网络控制系统的诊断功能是指完成车载各部件故障数据的采集、分析、转储和显示。故障信息在司机台上通过显示屏显示，诊断信息能上传到地面维修和服务系统中，供长期的储存和深入的地面分析。"},{"序号":580,"试题类型":"单选题","试题内容":"中国标准动车组网络控制系统的车辆控制功能包括（）、空电联合制动控制。","A":"限速控制","B":"方向控制","C":"以上都是","D":"保持制动缓解控制","正确选项":"C","试题解析":"中国标准动车组网络控制系统的车辆控制功能包括限速控制、方向控制、空电联合制动控制、保持制动缓解控制。"},{"序号":581,"试题类型":"单选题","试题内容":"当任何一个司机室的“紧急制动”按钮被按下，TCMS均执行( )，同时封锁牵引信号的输出。","A":"忽略该指令","B":"“紧急制动”指令","C":"发出警告声音","D":"停止接收所有控制指令","正确选项":"B","试题解析":"中国标准动车组网络控制系统TCMS激活时，只允许接收来自主控司机室的各种控制指令，而忽略非主控司机室的各种控制指令，但有一条指令除外，即“紧急制动”指令。当任何一个司机室的“紧急制动”按钮被按下，TCMS均执行“紧急制动”指令，同时封锁牵引信号的输出。"},{"序号":582,"试题类型":"单选题","试题内容":"如果在列车运行过程中，不管是人为操作原因还是司控器故障原因导致方向信号变化了，TCMS会诊断出()，并在显示器上做故障提示。","A":"紧急制动故障","B":"警惕故障","C":"方向信号丢失故障","D":"停放制动故障","正确选项":"C","试题解析":"如果在列车运行过程中，不管是人为操作原因还是司控器故障原因导致方向信号变化了，TCMS会诊断出“方向信号丢失故障”，并在显示器上做故障提示。"},{"序号":583,"试题类型":"单选题","试题内容":"TCMS对空调机组压缩机进行错时启动控制，可防止各节车辆的空调机组的压缩机同时启动，从而（）。","A":"防止空调机组冷凝风扇损坏","B":"提高空调制冷效果","C":"防止辅助供电系统交流负载严重过载","D":"节约电能","正确选项":"C","试题解析":"中国标准动车组网络控制系统的空调控制功能指：TCMS对空调机组压缩机进行错时启动控制，可防止各节车辆的空调机组的压缩机同时启动，从而对辅助供电系统造成的交流负载严重过载。"},{"序号":584,"试题类型":"单选题","试题内容":"TCMS按照一定的循环周期，分别向各节车辆的空调系统发送（）的时间窗口，每节车的空调系统只能在属于自己的时间窗口时才能启动，其他时间则不允许启动。","A":"同时启动所有空调压缩机","B":"空调允许启动","C":"只启动一个空调压缩机","D":"空调禁止启动","正确选项":"B","试题解析":"TCMS按照一定的循环周期，分别向各节车辆的空调系统发送“空调允许启动”的时间窗口，每节车的空调系统只能在属于自己的时间窗口时才能启动，其他时间则不允许启动。在一个时间窗口中，只允许启动一个空调压缩机。对于已经完成启动的空调系统，其停机过程不受该时间窗口的控制，可以根据外界温度条件或者控制指令随时停机。"},{"序号":585,"试题类型":"单选题","试题内容":"TCMS通过（）检测所有连接至网络上的设备的通信状态。","A":"生命信号机制","B":"故障代码机制","C":"定时检查机制","D":"手动检查机制","正确选项":"A","试题解析":"中国标准动车组网络控制系统通信状态检测功能是指：TCMS通过生命信号机制检测所有连接至网络上的设备的通信状态。当设备生命信号停止跳变超过5个传输周期，TCMS判定该设备通信失败，在显示器上显示通信故障。当设备恢复跳变后，TCMS判定该设备通信正常，并复位通信故障。"},{"序号":586,"试题类型":"单选题","试题内容":"CR400BF动车组每个牵引单元有（）中央控制单元（CCU），位于01车、00车的司机室控制柜内。","A":"1个","B":"2个","C":"3个","D":"4个","正确选项":"B","试题解析":"CR400BF动车组每个牵引单元有两个中央控制单元（CCU），位于01车、00车的司机室控制柜内。其中一个CCU以主CCU方式工作，负责本牵引单元内车辆控制，向WTB和MVB发送控制信号和反馈信息；另一个以从CCU方式工作，负责监控记录主CCU的状态，并做好主CCU故障时接替其工作的准备，实现冗余功能。"},{"序号":587,"试题类型":"单选题","试题内容":"在司机室占用端的主CCU为列车（），除了本牵引单元主CCU的工作外，它还负责整个列车的总体网络控制。","A":"被引导主CCU","B":"被引导从CCU","C":"主CCU","D":"从CCU","正确选项":"C","试题解析":"在司机室占用端的主CCU为列车主CCU，除了本牵引单元主CCU的工作外，它还负责整个列车的总体网络控制。其它牵引单元的主CCU称为被引导主CCU。"},{"序号":588,"试题类型":"单选题","试题内容":"中央控制单元作为动车组网络控制的核心单元，采集与车辆运行状况有关的各种信息，并对这些数据进行（） 。","A":"收集","B":"解释","C":"传输","D":"逻辑判断处理","正确选项":"D","试题解析":"中央控制单元作为动车组网络控制的核心单元，采集与车辆运行状况有关的各种信息，并对这些数据进行逻辑判断处理后，发送到牵引、制动、辅助供电等子系统，从而对各子系统进行控制、监视和故障诊断。"},{"序号":589,"试题类型":"单选题","试题内容":"在以下（）情形时，CCU需进行主从转换。","A":"列车紧急制动激活","B":"列车运行速度超过限制","C":"主CCU的网关出现故障","D":"列车常用制动激活","正确选项":"C","试题解析":"正常操作时，牵引单元内两个CCU依次交替轮流成为主CCU，即每次列车蓄电池接通（或装上蓄电池）时，主CCU分配就转换一次。在以下情形时，CCU需进行主从转换：\n①主CCU重要组件（电源装置/中央处理器和I/O模块）出现故障；\n②主CCU的MVB接口或MVB总线管理器出现故障或MVB分支段和主CCU都出现故障；\n③主CCU的网关出现故障。"},{"序号":590,"试题类型":"单选题","试题内容":"当（）发生主从转换时不但MVB接口转换，其附属网关同时需要转换。","A":"CCU","B":"BCU","C":"TCU","D":"ACU","正确选项":"A","试题解析":"当CCU发生主从转换时不但MVB接口转换，其附属网关同时需要转换。原因是只有主CCU的网关才能激活工作，从CCU的网关会被禁用。因此在网关转换的同时会触发列车初运行任务，重新进行列车相关配置。"},{"序号":591,"试题类型":"单选题","试题内容":"中继器的作用是（），补偿信号衰减，支持远距离通信。","A":"放大信号","B":"控制车辆制动","C":"监控列车速度","D":"维修列车设备","正确选项":"A","试题解析":"中继器的作用是放大信号，补偿信号衰减，支持远距离通信。"},{"序号":592,"试题类型":"单选题","试题内容":"动车组共有5个HMI，其中01车、00车司机室内各有2个HMI互为冗余，05车机械师室（CR400BF-A型动车组位于09车机械师室）有（）HMI。","A":"3个","B":"1个","C":"2个","D":"0个","正确选项":"B","试题解析":"动车组共有5个HMI，其中01车、00车司机室内各有2个HMI互为冗余，05车机械师室（CR400BF-A型动车组位于09车机械师室）有1个HMI。"},{"序号":593,"试题类型":"单选题","试题内容":"每个牵引单元设有（）互为冗余的网关.","A":"1个","B":"2个","C":"3个","D":"4个","正确选项":"B","试题解析":"每个牵引单元设有两个互为冗余的网关，位于01车、00车的司机室控制柜和CR400BF-A型动车组08车、09车电气柜中，分别集成在两个中央控制单元CCU内。"},{"序号":594,"试题类型":"单选题","试题内容":"牵引变流器经交-直-交变换，为本车四台三相异步牵引电机供电，同时通过中间直流环节为辅助变流器提供电能，所有过程都由()进行控制。","A":"TCU","B":"BC","C":"BCU","D":"ACU","正确选项":"A","试题解析":"牵引变流器经交-直-交变换，为本车四台三相异步牵引电机供电，同时通过中间直流环节为辅助变流器提供电能，所有过程都由TCU进行控制。"},{"序号":595,"试题类型":"单选题","试题内容":"交流干线在列车高压状态下处于()，当交流干线发生故障时可以打开双辅助变流器的耦合接触器，从而将交流干线分段隔离。","A":"耦合状态","B":"断开状态","C":"半耦合状态","D":"待机状态","正确选项":"A","试题解析":"交流干线在列车高压状态下处于耦合状态，当交流干线发生故障时可以打开双辅助变流器的耦合接触器，从而将交流干线分段隔离。"},{"序号":596,"试题类型":"单选题","试题内容":"动车组列车通信网络分为()列车通信网络体系结构以及ARCNET通信网络体系结构。","A":"TCN","B":"MVB","C":"CAN","D":"WTB","正确选项":"A","试题解析":"动车组列车通信网络分为TCN列车通信网络体系结构以及ARCNET通信网络体系结构。"},{"序号":597,"试题类型":"单选题","试题内容":"ARCNET通信网络体系结构由()、终端装置、车辆信息显示器、显示控制装置、IC读卡器、乘客信息显示器等组成","A":"司机控制柜","B":"中央单元","C":"电气柜","D":"中央装置","正确选项":"D","试题解析":"ARCNET通信网络体系结构由中央装置、终端装置、车辆信息显示器、显示控制装置、IC读卡器、乘客信息显示器等组成"},{"序号":598,"试题类型":"单选题","试题内容":"多功能车辆总线MVB主要用于实现（）的通信。","A":"各单元内部车辆间","B":"列车与外部网络","C":"司机室与车厢","D":"乘客信息系统","正确选项":"A","试题解析":"多功能车辆总线MVB主要用于实现各单元内部车辆间的通信。"},{"序号":599,"试题类型":"单选题","试题内容":"列车总线和车辆总线由（）连接，并进行协议转换。","A":"中继阀","B":"中继器","C":"网关","D":"网桥","正确选项":"C","试题解析":"列车总线和车辆总线由网关连接，并进行协议转换。"},{"序号":600,"试题类型":"单选题","试题内容":"列车初运行过程包括：1.（）；2.由主节点组织寻找网络节点并命名；3.生成网络结构。","A":"确定主节点","B":"列车车门系统测试","C":"列车制动系统测试","D":"确定从节点","正确选项":"A","试题解析":"列车初运行过程包括：1.确定主节点；2.由主节点组织寻找网络节点并命名；3.生成网络结构。"},{"序号":601,"试题类型":"单选题","试题内容":"列车网络控制权转移的过程中：原主控端拔出主控钥匙，原主节点降级为（），并控制网络继续运行。","A":"强节点","B":"弱节点","C":"从节点","D":"备用节点","正确选项":"B","试题解析":"列车网络控制权转移的过程中：原主控端拔出主控钥匙，原主节点降级为弱节点，并控制网络继续运行。"},{"序号":602,"试题类型":"单选题","试题内容":"列车网络控制权转移的过程中：换端操作后弱节点（原主节点）取消对所有节点命名，成为（）。","A":"主节点","B":"弱节点","C":"从节点","D":"备用节点","正确选项":"C","试题解析":"列车网络控制权转移的过程中：换端操作后弱节点（原主节点）取消对所有节点命名，成为从节点。"},{"序号":603,"试题类型":"单选题","试题内容":"动车组网络通信中WTB的数据速率是（），MVB的数据速率是1.5Mbps","A":"1.5Mbps","B":"1.0Mbps","C":"0.5Mbps","D":"2.0Mbps","正确选项":"B","试题解析":"动车组网络通信中WTB的数据速率是1.0Mbps，MVB的数据速率是1.5Mbps"},{"序号":604,"试题类型":"单选题","试题内容":"WTB采用（），每一数据位码元中间都有跳变，从高到低的跳变（负跳变）表示‘1’，正跳变则表示‘0’。","A":"曼彻斯特编码","B":"差分编码","C":"非零编码","D":"归零编码","正确选项":"A","试题解析":"WTB采用曼彻斯特编码，每一数据位码元中间都有跳变，从高到低的跳变（负跳变）表示‘1’，正跳变则表示‘0’。"},{"序号":605,"试题类型":"单选题","试题内容":"ARCNET局域网采用了优化的（）（1EEE802.4），控制指令及监控信息以固定周期轮流在总线中传输。","A":"令牌总线协议","B":"以太网协议","C":"光纤协议","D":"串行通信协议","正确选项":"A","试题解析":"ARCNET局域网采用了优化的令牌总线协议（1EEE802.4），控制指令及监控信息以固定周期轮流在总线中传输。"},{"序号":606,"试题类型":"单选题","试题内容":"ARCNET局域网监控信息传输控制方式为（）方式，令牌在各网络节点间轮流传递，获得令牌的节点具有向总线发送信息的权限。","A":"令牌传递","B":"抢占方式","C":"优先级排序","D":"随机分配","正确选项":"A","试题解析":"ARCNET局域网监控信息传输控制方式为令牌传递方式，令牌在各网络节点间轮流传递，获得令牌的节点具有向总线发送信息的权限。"},{"序号":607,"试题类型":"单选题","试题内容":"CAN网络上的节点信息分成（），可满足不同的实时要求。","A":"离散优先级","B":"动态优先级","C":"不同的优先级","D":"随机优先级","正确选项":"C","试题解析":"CAN网络上的节点信息分成不同的优先级，可满足不同的实时要求。"},{"序号":608,"试题类型":"单选题","试题内容":"CAN节点在错误严重的情况下具有（）功能，以使总线上其他节点的操作不受影响。","A":"自动关闭输出","B":"自动重启","C":"自动降级","D":"无任何操作","正确选项":"A","试题解析":"CAN节点在错误严重的情况下具有自动关闭输出功能，以使总线上其他节点的操作不受影响。"},{"序号":609,"试题类型":"单选题","试题内容":"列车级通信网络还采用以太网环网贯穿全列车，并且预留重联接口，以太网主要承担传输各系统状态数据和（）的功能。","A":"视频信号","B":"消息数据","C":"故障数据","D":"供电给各节点","正确选项":"C","试题解析":"列车级通信网络还采用以太网环网贯穿全列车，并且预留重联接口，以太网主要承担传输各系统状态数据和故障数据的功能。"},{"序号":610,"试题类型":"单选题","试题内容":"CR400AF动车组网络控制系统的主要组成设备不包括（）。","A":"中央控制单元模块","B":"以太网交换机模块","C":"司机室控制模块","D":"人机交互显示屏模块","正确选项":"C","试题解析":"CR400AF动车组网络控制系统（TCMS）主要组成设备为中央控制单元模块，网关模块，输入输出模块，事件记录模块，中继器模块，以太网交换机模块，以及人机交互显示屏模块。"},{"序号":611,"试题类型":"单选题","试题内容":"双绞式列车总线（WTB）的最大传输距离（无需中继器）是（）。","A":"430米","B":"860米","C":"1720米","D":"2580米","正确选项":"B","试题解析":"双绞式列车总线（WTB）是专为铁路列车车辆重联而开发的高可靠和实时的现场总线，它特别适合用于需要动态编组的开式列车（也同样适合于固定编组的闭式列车），物理层采用变压器耦合的双绞屏蔽线，传输通道可配置为冗余或非冗余方式，不需中继器传输距离可达860米，采用16位的循环冗余校验方式，传输波特率为1Mbps。"},{"序号":612,"试题类型":"单选题","试题内容":"CR400BF平台动车组的TCN网关是WTB和MVB之间数据交换的基础，负责WTB和MVB之间的数据（）任务。","A":"数据存储","B":"故障诊断","C":"数据转换和路由","D":"牵引控制","正确选项":"C","试题解析":"CR400BF平台动车组的TCN网关是WTB和MVB之间数据交换的基础，负责WTB和MVB之间的数据转换和路由任务。每个牵引单元设有两个互为冗余的网关，两个网关的工作方式为：主CCU网关参与WTB和MVB之间数据转换，从CCU网关接通电源但不工作，处于备用状态。"},{"序号":613,"试题类型":"单选题","试题内容":"两列CR400BF（或一列CR400AF和一列CR400BF）型动车组连挂和解编时，通过（）能够动态识别网络终端和网络拓扑，实现WTB节点动态地址分配，自动完成列车级的相关配置，具有可变的拓扑结构。","A":"MVB总线","B":"CAN总线","C":"WTB总线","D":"司机室控制","正确选项":"C","试题解析":"两列CR400BF（或一列CR400AF和一列CR400BF）型动车组连挂和解编时，通过WTB总线能够动态识别网络终端和网络拓扑，实现WTB节点动态地址分配，自动完成列车级的相关配置，具有可变的拓扑结构。"},{"序号":614,"试题类型":"多选题","试题内容":"数据通信系统的组成分为：信息源、（）、信息接收者。","A":"发送设备","B":"传输介质","C":"接收设备","D":"信息采集","正确选项":"ABC","试题解析":"数据通信系统的组成分为：信息源、发送设备、传输介质、接收设备、信息接收者。"},{"序号":615,"试题类型":"多选题","试题内容":"用模拟信号的（）、不同相位来表达数据的0、1状态，称为模拟数据编码。","A":"不同模态","B":"不同幅度","C":"不同频率","D":"不同方向","正确选项":"BC","试题解析":"数据编码：是指通信系统中以何种物理信号的形式来表示数据。分别用模拟信号的不同幅度、不同频率、不同相位来表达数据的0、1状态，称为模拟数据编码。用高低电平的矩形脉冲信号来表示数据的0、1状态的，称为数字数据编码。"},{"序号":616,"试题类型":"多选题","试题内容":"模拟数据编码有三种编码方法，分别为（）。","A":"频移键控RSK","B":"幅度键控ASK","C":"频移键控FSK","D":"相移键控PSK","正确选项":"BCD","试题解析":"模拟数据编码有三种编码方法，分别为幅度键控ASK、频移键控FSK、相移键控PSK。"},{"序号":617,"试题类型":"多选题","试题内容":"常见的网络拓扑结构有（）和树形等。","A":"星形","B":"梯形","C":"环形","D":"总线形","正确选项":"ACD","试题解析":"常见的网络拓扑结构有星形、环形、总线形和树形等。"},{"序号":618,"试题类型":"多选题","试题内容":"CR400AF动车组网络控制系统（TCMS）具有（）和用户支持五大功能。","A":"信息传输","B":"逻辑控制","C":"画面显示","D":"故障诊断","正确选项":"ABCD","试题解析":"CR400AF动车组网络控制系统（TCMS）具有信息传输、逻辑控制、画面显示、故障诊断和用户支持五大功能。"},{"序号":619,"试题类型":"多选题","试题内容":"中国标准动车组网络控制系统的诊断功能实现的诊断信息主要包括（）。\n\n\n","A":"牵引、制动以及控制系统的状态","B":"旅客安全相关设备的状态","C":"影响列车正常运行和使用的其它设备状态","D":"\n列车自诊断信息","正确选项":"ABCD","试题解析":"中国标准动车组网络控制系统的诊断功能实现的诊断信息主要包括：\n①牵引、制动以及控制系统的状态；\n②旅客安全相关设备的状态； \n③影响列车正常运行和使用的其它设备状态；\n④列车自诊断信息。"},{"序号":620,"试题类型":"多选题","试题内容":"CR400BF型动车组牵引控制单元（TCU）内主要由()MVB通信模块和电源模块等组成。","A":"中央控制模块","B":"WTB通信模块","C":"信号处理器","D":"信号输入输出模块","正确选项":"ACD","试题解析":"CR400BF型动车组牵引控制单元（TCU）内主要由中央控制模块、信号处理器、信号输入输出模块、MVB通信模块和电源模块等组成，其中信号处理器负责实施所有牵引控制功能，以减轻中央控制模块的数据处理任务。"},{"序号":621,"试题类型":"多选题","试题内容":"中国标准动车组网络控制系统TCMS产生牵引封锁的条件有（）。","A":"中间车作为主控车","B":"无司机室激活时","C":"CCU检测方向故障","D":"非零速时，停放制动未缓解","正确选项":"ABCD","试题解析":"中国标准动车组网络控制系统TCMS产生牵引封锁的条件有：\n①中间车作为主控车；\n②无司机室激活时；\n③CCU检测方向故障；\n④非零速时，停放制动未缓解；\n⑤列车处于牵引工况超过一定时间，或速度大于5km/h时，所有制动未缓解；\n⑥无牵引使能信号；\n⑦主控单元车的紧急EB环路状态为低电平；\n⑧主控单元车的紧急UB环路状态为低电平。\n当以上条件触发牵引封锁时，TCMS在显示器显示牵引封锁状态，便于司机了解牵引封锁的产生原因，对车辆进行相对应的处理。"},{"序号":622,"试题类型":"多选题","试题内容":"CR400BF型动车组网络控制单元包括：()辅助变流器控制单元（ACU）等。","A":"牵引控制单元（TCU）","B":"制动控制单元（BCU）","C":"电池充电机控制单元（BC）","D":"制动控制单元（CCU）","正确选项":"ABC","试题解析":"CR400BF型动车组网络控制单元包括：牵引控制单元（TCU）、制动控制单元（BCU）、电池充电机控制单元（BC）、辅助变流器控制单元（ACU）等。"},{"序号":623,"试题类型":"多选题","试题内容":"网关模块EGWM由（）两块电路板组成，分别固定在模块外壳的上下盖上。","A":"CPU板","B":"电源接口板","C":"128位通信板","D":"模态控制板","正确选项":"AB","试题解析":"网关模块EGWM由CPU板和电源接口板两块电路板组成，分别固定在模块外壳的上下盖上。"},{"序号":624,"试题类型":"多选题","试题内容":"每个牵引单元有两个CCU，位于（）的司机室控制柜内。","A":"01车","B":"04车","C":"05车","D":"00车","正确选项":"AD","试题解析":"每个牵引单元有两个CCU，位于01车、00车的司机室控制柜（CR400BF-A型动车组不带司机室的两个牵引单元CCU位于08车、09车电气柜）内。"},{"序号":625,"试题类型":"多选题","试题内容":"电池充电机主要由（）构成。","A":"蓄电池模块","B":"控制模块","C":"功率模块","D":"传输模块","正确选项":"BC","试题解析":"电池充电机主要由控制模块和功率模块构成，其中控制模块负责电池充电机整体控制并和MVB进行数据通信，功率模块负责实际整流任务"},{"序号":626,"试题类型":"多选题","试题内容":"TCN列车通信网络体系结构由()中继器、显示器、输入输出模块等组成。","A":"中央单元","B":"终端单元","C":"网关","D":"网桥","正确选项":"ABC","试题解析":"TCN列车通信网络体系结构由中央单元、终端单元、网关、中继器、显示器、输入输出模块等组成。"},{"序号":627,"试题类型":"多选题","试题内容":"多功能车辆总线MVB可以用来传递()，控制各设备执行相应的功能。","A":"过程数据","B":"视频信号","C":"消息数据","D":"监督数据","正确选项":"ACD","试题解析":"多功能车辆总线MVB可以用来传递过程数据、消息数据以及监督数据，控制各设备执行相应的功能。"},{"序号":628,"试题类型":"多选题","试题内容":"列车网络控制权转移的过程包括：1.原主控端拔出主控钥匙，原主节点降级为（），并控制网络继续运行；2.新主控端投入主控钥匙，该节点升级为主节点；3.弱节点（）取消对所有节点命名，成为从节点；4.新主节点对所有节点命名并控制网络运行。","A":"主节点","B":"弱节点","C":"原主节点","D":"从节点","正确选项":"BC","试题解析":"列车网络控制权转移的过程包括：1.原主控端拔出主控钥匙，原主节点降级为弱节点，并控制网络继续运行；2.新主控端投入主控钥匙，该节点升级为主节点；3.弱节点（原主节点）取消对所有节点命名，成为从节点；4.新主节点对所有节点命名并控制网络运行。"},{"序号":629,"试题类型":"多选题","试题内容":"MVB总线介质为（），通信速率为1.5Mbps。","A":"同轴电缆","B":"单绞电缆","C":"光缆","D":"双绞屏蔽电缆","正确选项":"CD","试题解析":"MVB总线介质为双绞屏蔽电缆或光缆，通信速率为1.5Mbps"},{"序号":630,"试题类型":"多选题","试题内容":"ARCNET局域网通过下列（）途径确保数据的安全传输。","A":"数据发送前通过发送FBE帧对目的节点的接收准备进行确认","B":"每个数据帧中都含有一个CRC-16的帧校验序列","C":"一旦令牌丢失，将引发重构，自动重构网络","D":"协议控制器提供强大的网络故障诊断功能","正确选项":"ABCD","试题解析":"ARCNET局域网通过下列几种途径确保数据的安全传输：\n1.数据发送前通过发送FBE帧对目的节点的接收准备进行确认。\n2.每个数据帧中都含有一个CRC-16的帧校验序列。\n3.一旦令牌丢失，将引发重构，自动重构网络。\n4.协议控制器提供强大的网络故障诊断功能。"},{"序号":631,"试题类型":"多选题","试题内容":"CAN即控制器局域网络，具有（）等特点。","A":"超远距离传输","B":"高性能","C":"高可靠性","D":"独特的设计","正确选项":"BCD","试题解析":"CAN即控制器局域网络，具有高性能、高可靠性、及独特的设计等特点。"},{"序号":632,"试题类型":"多选题","试题内容":"中国标准动车组的通信网络划分为两级：（）。","A":"系统级","B":"控制级","C":"车辆级","D":"列车级","正确选项":"CD","试题解析":"中国标准动车组的通信网络划分为两级：车辆级和列车级。列车级采用WTB总线；车辆级采用MVB总线。"},{"序号":633,"试题类型":"判断题","试题内容":"可在总线上发起信息传输的设备叫做“总线从设备”（bus master）。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"可在总线上发起信息传输的设备叫做“总线主设备”（bus master）。"},{"序号":634,"试题类型":"判断题","试题内容":"非零码（RZ）在每一位二进制信息传输之后均返回零电平的编码，例如其逻辑1只在该码元时间中的某段（如码元时间的一半）维持高电平后就回复到低电平。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"归零码（RZ）在每一位二进制信息传输之后均返回零电平的编码，例如其逻辑1只在该码元时间中的某段（如码元时间的一半）维持高电平后就回复到低电平。非零码（NRZ）在整个码元时间内维持有效电平。"},{"序号":635,"试题类型":"判断题","试题内容":"全双工通信是指信息流可在两个方向上传输，但同一时刻只限于一个方向传输。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"半双工通信是指信息流可在两个方向上传输，但同一时刻只限于一个方向传输。"},{"序号":636,"试题类型":"判断题","试题内容":"BCU是标准动车组中央控制单元的简称。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CCU是标准动车组中央控制单元的简称。"},{"序号":637,"试题类型":"判断题","试题内容":"BC是标准动车组蓄电池单元的简称。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"BC是标准动车组充电机单元的简称。"},{"序号":638,"试题类型":"判断题","试题内容":"PIS是标准旅客信息系统的简称。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"PIS是标准旅客信息系统的简称。"},{"序号":639,"试题类型":"判断题","试题内容":"中国标准动车组网络控制系统TCMS处于“待机”状态（司机钥匙没有插入司控器的钥匙孔并旋转至“激活”位）时，将拒绝接收和执行诸如施加牵引、缓解制动等各种涉及安全的控制指令，但可以对全列车的状态信息进行监视和故障诊断。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"中国标准动车组网络控制系统TCMS处于“待机”状态（司机钥匙没有插入司控器的钥匙孔并旋转至“激活”位）时，将拒绝接收和执行诸如施加牵引、缓解制动等各种涉及安全的控制指令，但可以对全列车的状态信息进行监视和故障诊断。"},{"序号":640,"试题类型":"判断题","试题内容":"列车的换向操作可以在列车静止或运行的状态下进行。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"列车的换向操作只允许在列车静止的状态下进行。一旦列车开始运行后，TCMS将锁定当前列车的方向信号，直到列车停止运行后才解锁。"},{"序号":641,"试题类型":"判断题","试题内容":"AXMe实现模拟量信号的采集输入和控制输出，通过WTB与EGWM模块通讯。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"AXMe实现模拟量信号的采集输入和控制输出，通过MVB与EGWM模块通讯。"},{"序号":642,"试题类型":"判断题","试题内容":"ECNN为时代电气网络系统的编组网交换机。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"ECNN为时代电气网络系统的编组网交换机，主要用来连接中央控制单元及辅助控制单元等智能设备的以太网接口，担任传输显示数据及显示数据冗余备份的功能，还实现通过以太网对各设备进行维护及诊断。"},{"序号":643,"试题类型":"判断题","试题内容":"CR400BF型动车组中共有10个中继器，其中01车、06车内各有2个，其它车内各有1个。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CR400BF型动车组中共有10个中继器，其中01车、00车内各有2个，其它车内各有1个。"},{"序号":644,"试题类型":"判断题","试题内容":"BCU可执行各自子系统内的控制和诊断，即对自己所在车厢的制动系统进行控制和诊断，其中包括防滑控制等功能。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"BCU可执行各自子系统内的控制和诊断，即对自己所在车厢的制动系统进行控制和诊断，其中包括防滑控制等功能。"},{"序号":645,"试题类型":"判断题","试题内容":"TCN（列车通信网络）于1996年6 月正式成为国际标准，即IEC61735。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"TCN（列车通信网络）于1999年6 月正式成为国际标准，即IEC61735。"},{"序号":646,"试题类型":"判断题","试题内容":"动车组列车通信网络采用列车总线（WTB）和多功能车辆总线（MVB）两层拓扑结构。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"动车组列车通信网络采用列车总线（WTB）和多功能车辆总线（MVB）两层拓扑结构。"},{"序号":647,"试题类型":"判断题","试题内容":"列车通信网络功能分为三大类：控制逻辑的处理与传输；设备状态的监视；异常、故障的检测与处理。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"列车通信网络功能分为三大类：控制逻辑的处理与传输；设备状态的监视；异常、故障的检测与处理。"},{"序号":648,"试题类型":"判断题","试题内容":"车辆总线WTB功能：实现各单元间传递列车级数据及实现数据交换。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"列车总线WTB功能：实现各单元间传递列车级数据及实现数据交换。"},{"序号":649,"试题类型":"判断题","试题内容":"TCN列车网络列车总线WTB中，主控端的中央单元为主节点，其他为从节点。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"TCN列车网络列车总线WTB中，主控端的中央单元为主节点，其他为从节点。"},{"序号":650,"试题类型":"判断题","试题内容":"列车初运行：列车投入主控或列车重联解编时，由主节点重新组织网络。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"列车初运行：列车投入主控或列车重联解编时，由主节点重新组织网络。"},{"序号":651,"试题类型":"判断题","试题内容":"列车网络控制权转移的过程中：新主控端投入主控钥匙，该节点升级为主节点。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"列车网络控制权转移的过程中：新主控端投入主控钥匙，该节点升级为主节点。"},{"序号":652,"试题类型":"判断题","试题内容":"列车网络控制权转移的过程中：新主节点对所有节点命名并控制网络运行。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"列车网络控制权转移的过程中：新主节点对所有节点命名并控制网络运行。"},{"序号":653,"试题类型":"判断题","试题内容":"动车组网络通信中MVB采用的是曼彻斯特编码。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"动车组网络通信中MVB采用的是曼彻斯特编码。"},{"序号":654,"试题类型":"判断题","试题内容":"列车重联时，由从节点重新组织网络初运行。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"列车重联时，由主节点重新组织网络初运行。"},{"序号":655,"试题类型":"判断题","试题内容":"ARCNET网络中每个节点保存有下一个节点的逻辑地址，可以生成一个网络活动节点地址表。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"ARCNET网络中每个节点保存有下一个节点的逻辑地址，可以生成一个网络活动节点地址表。"},{"序号":656,"试题类型":"判断题","试题内容":"CAN的直接通信距离最远可达10km。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CAN的直接通信距离最远可达10km；通信速率最高可达1Mbps（此时通信距离最长为40m）。"},{"序号":657,"试题类型":"判断题","试题内容":"CAN的通信介质可为双绞线、同轴电缆或光纤，选择灵活。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CAN的通信介质可为双绞线、同轴电缆或光纤，选择灵活。"},{"序号":658,"试题类型":"判断题","试题内容":"CR400AF动车组为固定的8辆编组形式，同时具备最多4列重联编组的能力，其网络控制系统采用符合IEC61375标准的TCN网络。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CR400AF动车组为固定的8辆编组形式，同时具备最多2列重联编组的能力，其网络控制系统采用符合IEC61375标准的TCN网络。"},{"序号":659,"试题类型":"判断题","试题内容":"多功能车辆总线MVB是专为铁路列车(车辆)内设备互联而开发的高可靠和强实时的现场总线。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"多功能车辆总线MVB是专为铁路列车(车辆)内设备互联而开发的高可靠和强实时的现场总线，物理层支持三种传输介质，采用8位的循环冗余校验方式，传输波特率为1.5Mbps。"},{"序号":660,"试题类型":"判断题","试题内容":"CR400BF型动车组WTB总线的作用是连接不同的牵引单元，使不同牵引单元之间能进行必要的列车级数据通信，完成列车级信息的传递。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"CR400BF型动车组WTB总线的作用是连接不同的牵引单元，使不同牵引单元之间能进行必要的列车级数据通信，完成列车级信息的传递。"},{"序号":661,"试题类型":"判断题","试题内容":"CR400BF型动车组一个牵引单元内设备之间通过MVB总线进行数据通信，完成车辆级信息的传递，设备数量可动态改变。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"CR400BF型动车组一个牵引单元内设备之间通过MVB总线进行数据通信，完成车辆级信息的传递，设备数量不能动态改变，具有固定的拓扑结构。"},{"序号":662,"试题类型":"单选题","试题内容":"动车组维修制度以（）为总体框架。","A":"计划预防修","B":"状态修","C":"事后修","D":"换件修","正确选项":"A","试题解析":"动车组维修制度是以以计划预防修为总体框架"},{"序号":663,"试题类型":"多选题","试题内容":"动车组维修中广泛实施（）（）。","A":"临修","B":"原件修","C":"换件修","D":"集中修","正确选项":"CD","试题解析":"动车组维修中广泛实施换件修和集中修"},{"序号":664,"试题类型":"多选题","试题内容":"动车组维修制度的特点有（）。","A":"计划预防修的总体框架","B":"灵活多变的维修体系、广泛实施换件修和集中修","C":"严格寿命管理","D":"细分维修层次","正确选项":"ABCD","试题解析":"动车组维修制度的特点包括：\n1.以计划预防修为总体框架，随着修程修制改革逐步向数字化精准修转变。\n2.总体框架下灵活多变的维修体系，高科技支撑的状态修维修方式状态修占有越来越大的比例。（依靠计算机维修信息系统、先进的通讯手段和精密可靠的检测诊断设备等高科技的支撑）\n3.广泛实施换件修和集中修。\n4.严格寿命管理，对关键件严格执行到期报废或更换，以确保运输安全和舒适。\n5.根据部件特点，细分维修层次，使维修设施的负荷尽量平衡，降低维修成本。"},{"序号":665,"试题类型":"判断题","试题内容":"动车组维修制度中，高科技支撑的状态修占比越来越大。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"动车组维修制度中，总体框架下灵活多变的维修体系，高科技支撑的状态修维修方式状态修占有越来越大的比例。（依靠计算机维修信息系统、先进的通讯手段和精密可靠的检测诊断设备等高科技的支撑）"},{"序号":666,"试题类型":"判断题","试题内容":"为了降低维修成本，动车组维修不细分维修层次。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"动车组维修中根据部件特点，细分维修层次，使维修设施的负荷尽量平衡，降低维修成本。 "},{"序号":667,"试题类型":"单选题","试题内容":"转向架等走行部的检查周期与（）有关。","A":"车辆载重","B":"运行公里","C":"车辆重量","D":"车辆长度","正确选项":"B","试题解析":"转向架等走行部的检查周期与运行公里有关"},{"序号":668,"试题类型":"单选题","试题内容":"车体、空气系统、橡胶件的检查周期主要与（）有关。","A":"运行公里","B":"故障次数","C":"动作次数","D":"时间","正确选项":"D","试题解析":"车体、空气系统、橡胶件等部件的检查周期与时间有关"},{"序号":669,"试题类型":"判断题","试题内容":"车体、空气系统、橡胶件的检查周期与使用时间无关。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"车体、空气系统、橡胶件等部件的检查周期与时间有关"},{"序号":670,"试题类型":"单选题","试题内容":"接触器、继电器触头的检查周期与（）有关。","A":"功率","B":"运行公里","C":"车辆长度","D":"动作次数","正确选项":"D","试题解析":"接触器、继电器触头的检查周期与动作次数有关"},{"序号":671,"试题类型":"多选题","试题内容":"车辆（）（）会影响动车组检修周期的确定。","A":"各部件故障发生的概率","B":"运行速度","C":"制造商","D":"工作方式","正确选项":"AD","试题解析":"检查周期的确定，充分考虑车辆各部件故障发生的概率和工作方式"},{"序号":672,"试题类型":"判断题","试题内容":"动车组检查周期的确定不需要考虑车辆各部件的工作方式。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"检查周期的确定，充分考虑车辆各部件故障发生的概率和工作方式"},{"序号":673,"试题类型":"判断题","试题内容":"电子部件的检查周期主要与工作时间有关。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"电子部件的检查周期与工作时间有关"},{"序号":674,"试题类型":"单选题","试题内容":"动车组检修中的“状态修”主要指的是（）。","A":"随检随修，保持技术状态良好","B":"定期检修，保持技术状态良好","C":"临时检修，保持技术状态良好","D":"集中检修，保持技术状态良好","正确选项":"A","试题解析":"服务性设施一般采取状态修，即随检随修，始终保持技术状态良好；同时部分设备或部件按照使用寿命的界定，在不能适应使用要求，即将发生故障前进行更换，采用监视型的状态修。"},{"序号":675,"试题类型":"单选题","试题内容":"“均衡修”的主要目的是（）。","A":"提高检修效率","B":"减少检修成本","C":"延长部件使用寿命","D":"增加检修次数","正确选项":"A","试题解析":"“均衡修”：将预防性维修工作分为若干个小块进行，一般来说，将每个小块耗时控制在4小时之内。对列车、对检修人员来说，每次的检修工作量都是相对均衡的。可避免预防性维修工作的堆积，提高检修效率。"},{"序号":676,"试题类型":"单选题","试题内容":"动车组检修作业方式中，对于除转向架以外的其他大部件，通常采用（）方式。","A":"落车","B":"换件","C":"分解","D":"原件","正确选项":"B","试题解析":"动车组检修作业方式在“检修单位”主要表现为检查、拆装、检测、试验，除转向架以外，其它大部件的检修采用换件的方式。"},{"序号":677,"试题类型":"多选题","试题内容":"动车组检修作业方式在“检修单位”主要表现为（），除转向架以外，其它大部件的检修采用换件的方式。","A":"检查","B":"拆装","C":"检测","D":"试验","正确选项":"ABCD","试题解析":"动车组检修作业方式在“检修单位”主要表现为检查、拆装、检测、试验，除转向架以外，其它大部件的检修采用换件的方式。"},{"序号":678,"试题类型":"判断题","试题内容":"动车组检修中的换件修是指将拆下的部件直接更换为全新的部件。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"无论在运用修程中发现部件故障，还是在高级修程中需要检修或更换部件，都采用换件修的方式，拆下的部件均送制造工厂或其设立的派出机构进行检查、修理、检测、试验。修峻并经过检验后才能继续装车使用。"},{"序号":679,"试题类型":"判断题","试题内容":"视觉检查指的是，用眼观察机器、部件形状、染色、伤痕、裂纹、腐蚀、磨耗、焊接部龟裂状态。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"视觉检查指的是，用眼观察机器、部件形状、染色、伤痕、裂纹、腐蚀、磨耗、焊接部龟裂状态。"},{"序号":680,"试题类型":"判断题","试题内容":"测量尺寸指的是，通过测量机器部件间的距离、安装高度，间隙，厚度进行判断。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"测量尺寸指的是，通过测量机器部件间的距离、安装高度，间隙，厚度进行判断。"},{"序号":681,"试题类型":"判断题","试题内容":"听觉检查指的是，检查机器发出异声，漏气声等状态，也可用听诊设备听转动声等。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"听觉检查指的是，检查机器发出异声，漏气声等状态，也可用听诊棒听转动声等。"},{"序号":682,"试题类型":"单选题","试题内容":"动车组修程分为（）级。","A":"3级","B":"4级","C":"5级","D":"6级","正确选项":"C","试题解析":"动车组修程分为5级。"},{"序号":683,"试题类型":"单选题","试题内容":"一、二级检修是在（）进行的。","A":"动车组运用所","B":"动车组制造厂","C":"动车组高级修车间","D":"动车组调度中心","正确选项":"A","试题解析":"一、二级检修为运用检修，在动车组运用所（以下简称动车所）内进行。"},{"序号":684,"试题类型":"判断题","试题内容":"动车组修程修制中，一、二级检修通常在动车所外进行。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"一、二级检修为运用检修，在动车组运用所（以下简称动车所）内进行。"},{"序号":685,"试题类型":"单选题","试题内容":"三、四、五级检修通常在（）进行。","A":"动车组运用所","B":"客车车辆段","C":"具备相应车型检修资质的检修单位","D":"动车组调度中心","正确选项":"C","试题解析":"三、四、五级检修为高级检修，在具备相应车型检修资质的检修单位进行"},{"序号":686,"试题类型":"多选题","试题内容":"以下检修级别中属于动车组高级检修的有（）。","A":"一级检修","B":"二级检修","C":"三级检修","D":"四级检修","正确选项":"CD","试题解析":"三、四、五级检修为高级检修，在具备相应车型检修资质的检修单位进行"},{"序号":687,"试题类型":"多选题","试题内容":"动车组的修程修制采用（）（）（）方式。","A":"以走行公里周期为主","B":"以时间周期为辅","C":"计划预防修","D":"超期维修","正确选项":"ABC","试题解析":"动车组修程修制采用以走行公里周期为主、时间周期为辅（先到为准）的计划预防修"},{"序号":688,"试题类型":"判断题","试题内容":"动车组修程修制完全基于走行公里周期，不考虑时间周期。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"动车组修程修制采用以走行公里周期为主、时间周期为辅（先到为准）的计划预防修"},{"序号":689,"试题类型":"判断题","试题内容":"动车组实行以走行公里周期为主、时间周期为辅（先到为准）的计划预防修，并逐步推进动车组数字化精准预防修，亦可根据实际情况研究部件视情维修。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"动车组实行以走行公里周期为主、时间周期为辅（先到为准）的计划预防修，并逐步推进动车组 ：\n①构架、联系枕梁、天线梁、制动梁及电机吊架外观良好，无变形、裂纹及腐蚀。\n②制动梁弹性橡胶节点无老化、龟裂，球型节点及心轴状态良好、无腐蚀。\n③横向橡胶止挡和挡板无缺失、松动和破损。"},{"序号":739,"试题类型":"判断题","试题内容":"转向架构架组成中，构架、联系枕梁、天线梁、制动梁及电机吊架的外观应良好，允许有轻微变形。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"构架组成的一级修质量标准：\n①构架、联系枕梁、天线梁、制动梁及电机吊架外观良好，无变形、裂纹及腐蚀。\n②制动梁弹性橡胶节点无老化、龟裂，球型节点及心轴状态良好、无腐蚀。\n③横向橡胶止挡和挡板无缺失、松动和破损。"},{"序号":740,"试题类型":"单选题","试题内容":"转向架轮对轴箱组成中，轴箱及定位装置的状态要求是（）。","A":"配件齐全，无松动、裂损","B":"橡胶节点老化","C":"前后盖安装螺栓甩油","D":"轴身防腐涂层剥落","正确选项":"A","试题解析":"轮对轴箱组成的一级修质量标准：\n①轮对及制动盘各部配件齐全、紧固件无松动；各部限度符合规定；制动盘内无杂物；轴身防腐涂层无损伤、剥落。\n②轴箱及定位装置各部配件齐全，无松动、裂损；橡胶节点无老化、龟裂；前后盖安装螺栓紧固，无松动、甩油。"},{"序号":741,"试题类型":"判断题","试题内容":"轮对轴箱组成中，轴箱及定位装置的橡胶节点若出现老化、龟裂现象，则必须及时更换。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"轮对轴箱组成的一级修质量标准：\n①轮对及制动盘各部配件齐全、紧固件无松动；各部限度符合规定；制动盘内无杂物；轴身防腐涂层无损伤、剥落。\n②轴箱及定位装置各部配件齐全，无松动、裂损；橡胶节点无老化、龟裂；前后盖安装螺栓紧固，无松动、甩油。"},{"序号":742,"试题类型":"单选题","试题内容":"一系悬挂装置中，防振橡胶的正常状态是（）。","A":"老化","B":"龟裂","C":"无老化、龟裂","D":"变形","正确选项":"C","试题解析":"一系悬挂的一级修质量标准：\n①轴箱弹簧无断裂，橡胶护套无破损。\n②垂向减振器状态良好，安装无松动、无漏油。\n③垂向止挡、轴箱拉杆状态良好。\n④防振橡胶无老化、龟裂。"},{"序号":743,"试题类型":"单选题","试题内容":"二系悬挂中，高度调整阀及托架的安装要求有（）。","A":"防振橡胶无老化、龟裂","B":"定位螺栓松动","C":"垂向止挡、轴箱拉杆状态良好","D":"高度调整杆无弯曲变形，连接可靠","正确选项":"D","试题解析":"二系悬挂的一级修质量标准：\n①牵引拉杆、中心销外观及安装状态良好；牵引座无裂纹；橡胶节点无老化、龟裂。\n②抗侧滚扭杆及扭杆吊杆装置安装牢固，安全吊绳安装牢固。\n③减振器状态良好，安装无松动、无漏油；减振器座无裂纹，各橡胶节点无老化、龟裂。\n④高度调整阀及托架安装牢固；定位螺栓无松动；各阀及连接管路无泄漏；高度调整杆无弯曲变形，连接可靠。\n⑤空气弹簧气囊无严重龟裂、划伤，无漏泄；附属配件齐全、安装牢固、作用良好，连接空气管系无腐蚀、裂损、漏泄。"},{"序号":744,"试题类型":"判断题","试题内容":"二系悬挂中，高度调整杆若有弯曲变形，则必须立即更换整个二系悬挂系统。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"二系悬挂的一级修质量标准：\n①牵引拉杆、中心销外观及安装状态良好；牵引座无裂纹；橡胶节点无老化、龟裂。\n②抗侧滚扭杆及扭杆吊杆装置安装牢固，安全吊绳安装牢固。\n③减振器状态良好，安装无松动、无漏油；减振器座无裂纹，各橡胶节点无老化、龟裂。\n④高度调整阀及托架安装牢固；定位螺栓无松动；各阀及连接管路无泄漏；高度调整杆无弯曲变形，连接可靠。\n⑤空气弹簧气囊无严重龟裂、划伤，无漏泄；附属配件齐全、安装牢固、作用良好，连接空气管系无腐蚀、裂损、漏泄。"},{"序号":745,"试题类型":"多选题","试题内容":"驱动装置中，齿轮箱的正常状态包括（）（）。","A":"整体密封良好","B":"万向轴安装螺栓齐全","C":"油位及油色正常","D":"联轴器外观及安装状态良好","正确选项":"AC","试题解析":"驱动装置的一级修质量标准：\n①齿轮箱整体密封良好，安装螺栓紧固，无漏油现象；油位及油色正常；附属配件齐全安装牢固；挡水密封圈状态良好。\n②万向轴安 过培训的人员对动车组进行巡视及防寒打温工作。"},{"序号":778,"试题类型":"单选题","试题内容":"当环境温度低于（）时，动车组应供电保温防冻。","A":"3℃","B":"0℃","C":"5℃","D":"10℃","正确选项":"B","试题解析":"当环境温度低于0℃时，动车组应供电保温防冻"},{"序号":779,"试题类型":"单选题","试题内容":"当环境温度低于0℃且动车组不具备防寒防冻条件时，应进行（）作业。","A":"排空作业","B":"充电作业","C":"维修作业","D":"清洁作业","正确选项":"A","试题解析":"当动车组不具备防寒防冻条件时，动车组应进行排空作业。"},{"序号":780,"试题类型":"判断题","试题内容":"动车组在防寒防冻条件不足时，必须进行排空作业以防止设备冻结。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"当动车组不具备防寒防冻条件时，动车组应进行排空作业。"},{"序号":781,"试题类型":"多选题","试题内容":"动车组排空作业的主要目的是（）（）。","A":"防止水箱、污物箱冻结破损","B":"防止电茶炉及管路等存水设备冻结破损","C":"延长动车组的使用寿命","D":"防止列车牵引系统故障","正确选项":"AB","试题解析":"动车组排空作业可以防止水箱、污物箱、电茶炉及管路等存水设备发生冻结破损。"},{"序号":782,"试题类型":"单选题","试题内容":"动车组管理信息系统是涵盖（）三级联网的应用系统。","A":"国铁集团、铁路局集团公司、动车段","B":"国铁集团、铁路局、车站","C":"铁路局、动车段、动车所","D":"车站、动车段、维修中心","正确选项":"A","试题解析":"动车组管理信息系统是一个涵盖国铁集团、铁路局集团公司、动车段三级联网应用系统"},{"序号":783,"试题类型":"单选题","试题内容":"动车组管理信息系统的主要目标不包括（）。","A":"准确及时地完成生产信息采集共享","B":"简化检修流程","C":"规范管理流程","D":"达到“计划周密、作业高效、管理规范、决策科学”","正确选项":"B","试题解析":" 建设动车组管理信息系统，准确及时地完成各种生产信息的采集共享、规范管理流程，达到“计划周密、作业高效、管理规范、决策科学”管理目标，是实现动车组高效检修、安全运营的重要保障。 "},{"序号":784,"试题类型":"单选题","试题内容":"动车组管理信息系统提供的信息服务不包括（）。","A":"动车组配属信息","B":"动车组运用信息","C":"动车组维修记录","D":"动车组设计方案","正确选项":"D","试题解析":"通过建设动车组管理信息网络，实现全路动车组检修运用信息的自动收集和集中管理，提供动车组配属、运用、维修及动车组履历管理等信息服务，支持多种查询、导出及打印功能，使用户能够全面掌握涉及全路所有动车组的相关信息。"},{"序号":785,"试题类型":"判断题","试题内容":"动车组管理信息系统只能提供动车组配属信息，不能提供其他服务。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"通过建设动车组管理信息网络，实现全路动车组检修运用信息的自动收集和集中管理，提供动车组配属、运用、维修及动车组履历管理等信息服务，支持多种查询、导出及打印功能，使用户能够全面掌握涉及全路所有动车组的相关信息。"},{"序号":786,"试题类型":"多选题","试题内容":"动车组管理信息系统的三级管理指的是（）（）（）。","A":"国铁集团","B":"铁路局集团公司","C":"动车段（运用所）","D":"信息中心","正确选项":"ABC","试题解析":"动车组管理信息系统由国铁集团动车组管理信息系统、铁路局集团公司动车组管理信息系统、动车基地管理信息系统、动车运用所管理信息系统组成，划分为三级四层，即国铁集团、铁路局集团公司、动车段（运用所）三级管理，国铁集团、铁路局集团公司、动车段、动车运用所四个业务层面。三层四级管理信息系统"},{"序号":787,"试题类型":"多选题","试题内容":"动车组管理信息系统的四个业务层面包括（）。","A":"国铁集团","B":"铁路局集团公司","C":"动车段","D":"动车运用所","正确选项":"ABCD","试题解析":"动车组管理信息系统的四层指的是，国铁集团、铁路局集团公司、动车段、动车运用所四个业务层面。"},{"序号":78 务集成、信息共享功能可以实现个运用检修业务紧密集成，履历、大部件、故障信息按业务规则自动同步，一车一档、档随车走。 "},{"序号":800,"试题类型":"单选题","试题内容":"动车组履历信息是（）的依据。","A":"动车所调度管理","B":"动车组运用检修","C":"动车组故障排查","D":"动车组生产组织","正确选项":"B","试题解析":"动车组履历信息是动车组运用检修的依据，是全生命周期管理的基础。"},{"序号":801,"试题类型":"单选题","试题内容":"动车组管理信息系统提供动车组履历集中管理，实现全路动车组（）。","A":"纸质文档管理","B":"履历的自动同步","C":"履历的人工录入","D":"履历的口头传达","正确选项":"B","试题解析":"动车组管理信息系统提供动车组履历集中管理，实现全路动车组履历的自动同步，一车一档、档随车走，有效支持动车组网络化运用检修业务的开展。"},{"序号":802,"试题类型":"单选题","试题内容":"故障管理在动车组管理信息系统中以（）为基础。","A":"故障开环管理","B":"故障闭环处理","C":"故障单一管理","D":"故障随机管理","正确选项":"B","试题解析":"以闭环管理为核心的故障管理：故障管理以故障闭环处理为基础，保障运用检修质量。系统全面收集故障及处理的相关信息，建立全路统一的故障数据仓库，并提供多维度统计分析，为检修、设计及制造提供技术支持。"},{"序号":803,"试题类型":"判断题","试题内容":"动车组故障管理仅关注故障的处理，不涉及故障信息的收集和分析。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"以闭环管理为核心的故障管理：故障管理以故障闭环处理为基础，保障运用检修质量。系统全面收集故障及处理的相关信息，建立全路统一的故障数据仓库，并提供多维度统计分析，为检修、设计及制造提供技术支持。"},{"序号":804,"试题类型":"单选题","试题内容":"动车组管理信息系统利用物联网技术实现对（）的全方位跟踪。","A":"配件","B":"故障","C":"一级修","D":"二级修","正确选项":"A","试题解析":"基于物联网技术的物流集成平台：建立关键配件统一编码，利用物联网技术实现对配件的全方位跟踪，以配件管理、配送管理，供应商管理为核心，实现关键配件全生命周期管理，开展供应商的质量评价和管理，达到运用检修物料成本的有效控制。"},{"序号":805,"试题类型":"多选题","试题内容":"动车组管理信息系统的主要功能包括（）。","A":"履历管理","B":"计划编制","C":"作业过程管理","D":"故障管理","正确选项":"ABCD","试题解析":"动车组管理信息系统的主要功能有，一车一档的履历管理、计划编制、一体化的作业过程管理、以闭环管理为核心的故障管理、基于自动化设备接口的设备管理、基于物联网技术的物流集成平台、建立各车型的技术支持体系"},{"序号":806,"试题类型":"多选题","试题内容":"动车组作业过程管理涉及（）方面的监控。","A":"车流","B":"人流","C":"物流","D":"作业流","正确选项":"ABCD","试题解析":"一体化的作业过程管理：作业管理是生产组织的重要内容，高效的作业管理需要实时监控车流、人流、物流和作业流。系统结合生产工艺，严格卡控作业流程，及时协调各单位有序开展生产活动，实现多专业、多作业面的一体化协同作业管理。"},{"序号":807,"试题类型":"判断题","试题内容":"动车组作业过程管理需要严格卡控作业流程，确保各单位有序开展生产活动。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"A","试题解析":"一体化的作业过程管理：作业管理是生产组织的重要内容，高效的作业管理需要实时监控车流、人流、物流和作业流。系统结合生产工艺，严格卡控作业流程，及时协调各单位有序开展生产活动，实现多专业、多作业面的一体化协同作业管理。"},{"序号":808,"试题类型":"判断题","试题内容":"动车组管理信息系统的计划编制功能完全依赖于调度人员的个人经验。","A":"正确","B":"错误","C":null,"D":null,"正确选项":"B","试题解析":"计划编制：调度管理是运用检修工作的龙头，系统构建了周密的计划编制、下达功能，根据业务规则自动预排计划，调度人员决策并调整确认，作业任务自动下发。计划、作业、实绩各功能模块间按业务流程紧密结合、信息闭环，异常自动提醒，可有效
